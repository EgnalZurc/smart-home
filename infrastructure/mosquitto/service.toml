# Service integration contract (complements docker-compose.prod.yml).

[service]
key = "mosquitto"
class = "infrastructure"
code_path = "infrastructure/mosquitto"
port = 1883
data_dir = "data/mosquitto"
docker_image = "eclipse-mosquitto"
health_path = ""

[dashboard]
enabled = false
app_key = ""
catalogue = false
controllable = false
deploy_service = ""
status_url = ""
in_all_health = false

[nginx]
exposed = false
spa_path = ""
api_prefix = ""

[ci]
enabled = false
workflow_dispatch = false

[docs]
api_doc = false
notes = "MQTT broker (eclipse-mosquitto 2.0.18). Config in infrastructure/mosquitto; also exposes 8883. Compose healthcheck uses TCP (nc)."