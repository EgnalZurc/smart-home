# ═══════════════════════════════════════════════════════════════════════════════
# Mosquitto ACL Configuration
# See infrastructure/mosquitto/README.md for topic permissions documentation
# ═══════════════════════════════════════════════════════════════════════════════
# Defines per-user topic permissions (read/write/readwrite)

# ─── Zigbee2MQTT ──────────────────────────────────────────────────────────────
# Full access to its own namespace (publishes sensor data, handles bridge commands)
user zigbee2mqtt
topic readwrite zigbee2mqtt/#

# ─── AC Service ───────────────────────────────────────────────────────────────
# Sensor data (read) and device discovery (read response + write request)
user ac-service
topic read zigbee2mqtt/+
topic read zigbee2mqtt/bridge/devices
topic write zigbee2mqtt/bridge/request/devices
