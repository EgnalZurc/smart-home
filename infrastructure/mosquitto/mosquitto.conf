# ═══════════════════════════════════════════════════════════════════════════════
# Mosquitto MQTT Broker - Dual Listener Configuration (Plain + TLS)
# ═══════════════════════════════════════════════════════════════════════════════
#
# This configuration enables both plain MQTT (1883) for internal Docker network
# traffic and TLS-encrypted MQTT (8883) for secure connections.
#
# TLS requires certificates in /mosquitto/certs/ (mounted from data/mosquitto/certs/)
# Generate certs with: ./scripts/generate-certs.sh
#
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Global Authentication & Authorization ────────────────────────────────────
# These settings apply to ALL listeners.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# ─── Internal Plain Listener (Docker network only) ────────────────────────────
# Port 1883 serves containers on the Docker bridge network where TLS overhead
# is unnecessary (all traffic stays within the isolated network).
listener 1883

# SECURITY NOTE (2026-10-26): bind_address 0.0.0.0 is INTENTIONAL for Docker
# networking. In production, this listener is only reachable from within the
# Docker bridge network (smart-home_default). External access is blocked by:
#   1. Docker network isolation (not exposed in docker-compose ports)
#   2. Host firewall (ufw deny 1883 from any)
#   3. Tailscale ACLs (MQTT ports not exposed externally)
# Using 127.0.0.1 would BREAK inter-container communication.
bind_address 0.0.0.0

# ─── TLS Encrypted Listener ───────────────────────────────────────────────────
# Port 8883 is the standard MQTT over TLS port (IANA assigned).
# Used for clients requiring encrypted connections.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.3

# SECURITY NOTE (2026-10-26): require_certificate false is INTENTIONAL.
# Authentication is handled via username/password (password_file above).
# This allows simpler client onboarding without certificate distribution.
# For higher security environments, consider enabling mTLS:
#   require_certificate true
#   use_identity_as_username true
require_certificate false

# ─── Persistence ──────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ─── Logging ──────────────────────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Subscription audit logging for security monitoring
# Enables tracking of which clients subscribe/unsubscribe to which topics
log_type subscribe
log_type unsubscribe

# ─── Resource Limits ──────────────────────────────────────────────────────────
# DoS protection: limit connections and message queues to prevent resource exhaustion.
max_connections 50
max_inflight_messages 20
max_keepalive 300
