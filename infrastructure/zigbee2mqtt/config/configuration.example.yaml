# ══════════════════════════════════════════════════════════════════════════════
# Zigbee2MQTT Configuration
# SECURITY: This file contains sensitive network credentials. Ensure:
#   - File permissions are restricted (chmod 600 on the deployed copy)
#   - Never commit real passwords/keys to version control
#   - Use environment variables for secrets where supported
# ══════════════════════════════════════════════════════════════════════════════

# Security: explicitly disable device pairing by default.
# Only enable temporarily via frontend when adding new devices.
# WARNING: permit_join: true allows ANY Zigbee device to join your network.
permit_join: false

homeassistant:
  enabled: false

mqtt:
  base_topic: zigbee2mqtt
  # ──────────────────────────────────────────────────────────────────────────
  # SECURITY NOTE: Using mqtt:// (plaintext) is ACCEPTED RISK for this setup.
  # Rationale: MQTT traffic is Docker-internal only (mosquitto container on the
  # same bridge network). No MQTT traffic leaves the Pi or crosses the internet.
  # TLS would add complexity without security benefit in this isolated context.
  # Review: 2026-10-26 | Next review: 2027-04-26
  # ──────────────────────────────────────────────────────────────────────────
  server: mqtt://mosquitto:1883
  # ──────────────────────────────────────────────────────────────────────────
  # MQTT Authentication (REQUIRED)
  # Anonymous MQTT access is disabled in mosquitto. Authentication is
  # configured in infrastructure/mosquitto/config/mosquitto.conf with:
  #   allow_anonymous false
  #   password_file /mosquitto/config/passwd
  # Generate password: docker exec mosquitto mosquitto_passwd -b /mosquitto/config/passwd zigbee2mqtt <password>
  # ──────────────────────────────────────────────────────────────────────────
  user: zigbee2mqtt
  # ⚠️ WARNING: CHANGE_ME is a placeholder - deployment will fail without a real password!
  # Steps to set up MQTT authentication:
  #   1. Deploy mosquitto first (docker compose up -d mosquitto)
  #   2. Generate password: docker exec mosquitto mosquitto_passwd -b /mosquitto/config/passwd zigbee2mqtt YOUR_PASSWORD
  #   3. Replace CHANGE_ME below with YOUR_PASSWORD
  #   4. Restart zigbee2mqtt: docker compose restart zigbee2mqtt
  # VALIDATION: If you see "CHANGE_ME" in production, authentication is NOT configured!
  password: CHANGE_ME

serial:
  port: tcp://host.docker.internal:8282
  adapter: ember

frontend:
  enabled: true
  # SECURITY: Bind to localhost only. The frontend is proxied through nginx
  # which handles authentication. Binding to 0.0.0.0 (default) would expose
  # the frontend directly if firewall/Docker network is misconfigured.
  host: 127.0.0.1
  port: 8081
  # ──────────────────────────────────────────────────────────────────────────
  # DUAL-LAYER AUTHENTICATION DESIGN
  # ──────────────────────────────────────────────────────────────────────────
  # Layer 1 (REQUIRED): nginx auth_request on /zigbee/ path
  #   - Configured in infrastructure/nginx/conf.d/smart-home.conf
  #   - Validates dashboard session token before proxying to zigbee2mqtt
  #   - This is the PRIMARY authentication gate - always active
  #
  # Layer 2 (OPTIONAL): Frontend auth_token (defense-in-depth)
  #   - Reads from Z2M_FRONTEND_PASSWORD env var (set in docker-compose.prod.yml)
  #   - Generate with: openssl rand -hex 32
  #   - Provides additional protection if nginx misconfiguration occurs
  #
  # ACCEPTED RISK: If Z2M_FRONTEND_PASSWORD env var is empty/unset, Layer 2
  # is inactive. This is acceptable because:
  #   - Layer 1 (nginx auth_request) is ALWAYS enforced
  #   - Frontend binds to 127.0.0.1 (not directly accessible)
  #   - Network is Tailscale-only (no public internet exposure)
  # See docs/SECURITY_FIXES.md for full risk assessment.
  # ──────────────────────────────────────────────────────────────────────────
  auth_token: '!env Z2M_FRONTEND_PASSWORD'

advanced:
  log_level: info
  # ──────────────────────────────────────────────────────────────────────────
  # SECURITY: Zigbee Network Key
  # This 128-bit key encrypts all Zigbee traffic on your network.
  # - GENERATE: Zigbee2MQTT will generate a random key on first start
  # - Once generated, the actual key is stored in coordinator_backup.json
  # - NEVER share this key - it allows decryption of all Zigbee traffic
  # - If compromised, all devices must be re-paired with a new key
  # - Consider storing in environment variable for production deployments
  # ──────────────────────────────────────────────────────────────────────────
  network_key: GENERATE
  cache_state: true
  cache_state_send_on_startup: false
  last_seen: epoch

devices: {}  # Add your devices here after pairing
version: 5
