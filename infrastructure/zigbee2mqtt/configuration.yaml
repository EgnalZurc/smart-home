homeassistant:
  enabled: false
mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://mosquitto:1883
serial:
  port: tcp://host.docker.internal:8282
  adapter: ember
frontend:
  enabled: true
  port: 8081
advanced:
  log_level: info
  network_key:
    - 149
    - 174
    - 2
    - 189
    - 150
    - 208
    - 70
    - 139
    - 41
    - 149
    - 66
    - 62
    - 244
    - 209
    - 20
    - 174
  cache_state: true
  cache_state_send_on_startup: false
  last_seen: epoch
