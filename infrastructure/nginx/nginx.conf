# ═══════════════════════════════════════════════════════════════════════════════
# nginx Main Configuration
# See infrastructure/nginx/README.md for security documentation
#
# CSP STRATEGY (Content-Security-Policy):
# - Dashboard routes (/, /api/, /static/): Backend (CSPNonceMiddleware) sets CSP
#   with per-request nonce. nginx passes the header through without modification.
# - Other routes (Vaultwarden, Zigbee2MQTT, microservices): nginx adds static CSP
#   via snippets/csp-static.conf with 'unsafe-inline' fallback.
# - security-headers.conf contains all headers EXCEPT CSP (handled per-route).
# ═══════════════════════════════════════════════════════════════════════════════

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ═══════════════════════════════════════════════════════════════════════════
    # Logging - detailed format with timing metrics for debugging
    # ═══════════════════════════════════════════════════════════════════════════
    log_format detailed '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time uct=$upstream_connect_time '
                        'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log detailed;
    error_log /var/log/nginx/error.log;

    sendfile on;

    # ═══════════════════════════════════════════════════════════════════════════
    # Connection Settings
    # ═══════════════════════════════════════════════════════════════════════════
    # keepalive_timeout: How long to keep idle connections open.
    # 65s balances connection reuse (reduces TLS handshakes) vs resource usage.
    # Lower values (30s) save memory but increase handshake overhead.
    # Higher values (120s) help slow clients but waste server resources.
    # Reference: https://nginx.org/en/docs/http/ngx_http_core_module.html#keepalive_timeout
    keepalive_timeout 65;

    gzip on;

    # Hide nginx version in error pages and headers
    server_tokens off;

    # ═══════════════════════════════════════════════════════════════════════════
    # TLS Hardening - Mozilla Intermediate configuration
    # https://ssl-config.mozilla.org/#server=nginx&version=1.25.3&config=intermediate
    #
    # CIPHER SUITE RATIONALE:
    # - All ciphers use AEAD (Authenticated Encryption with Associated Data)
    # - ECDHE/DHE provides Perfect Forward Secrecy (PFS) - past sessions remain
    #   secure even if the server's private key is compromised later
    # - AES-GCM and ChaCha20-Poly1305 are the only allowed authenticated ciphers
    # - No CBC mode ciphers (vulnerable to padding oracle attacks like POODLE)
    # - No RSA key exchange (no PFS, vulnerable to Bleichenbacher attacks)
    # - No 3DES, RC4, or other weak ciphers
    #
    # COMPATIBILITY: Works with all modern browsers (Chrome 49+, Firefox 44+,
    # Safari 12.1+, Edge 12+, Android 7.0+, iOS 12.2+). Legacy clients (IE 10,
    # Windows XP) are intentionally excluded for security.
    # ═══════════════════════════════════════════════════════════════════════════
    
    # Strong cipher suites only - no weak ciphers
    # Order: ECDHE preferred over DHE (faster), AES-128 before AES-256 (sufficient
    # security with better performance), ChaCha20 for clients without AES-NI.
    #
    # DHE CIPHERS NOTE: DHE-RSA-AES* ciphers are included for compatibility with
    # older clients that don't support ECDHE. These ciphers CAN use a custom DH
    # group via ssl_dhparam, but it's OPTIONAL:
    #   - Without ssl_dhparam: OpenSSL uses built-in safe primes (2048-bit minimum
    #     since OpenSSL 1.1.0). This is secure for TLS 1.2+ connections.
    #   - With ssl_dhparam: Allows using a custom DH group (e.g., 4096-bit) for
    #     extra security margin, but requires generating and managing the file.
    # Current choice: No ssl_dhparam. The built-in primes are sufficient, and
    # ECDHE is preferred anyway (faster, same security, no DH param needed).
    # To add custom DH params if desired:
    #   openssl dhparam -out /etc/nginx/dhparam.pem 4096
    #   ssl_dhparam /etc/nginx/dhparam.pem;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    
    # Elliptic curves for ECDHE key exchange
    # X25519: Modern curve by djb, fastest, resistant to timing attacks, 128-bit security
    # secp384r1: NIST P-384, 192-bit security, fallback for clients that don't support X25519
    # Note: secp256r1 (P-256) not included - X25519 is preferred at 128-bit security level
    ssl_ecdh_curve X25519:secp384r1;
    
    # TLS Session Caching - reduces TLS handshake overhead for returning clients
    # 10MB cache holds ~40,000 sessions (each session ~256 bytes)
    # Tradeoff: More cache = less CPU for handshakes, but more memory usage
    ssl_session_cache shared:SSL:10m;

    # Session timeout: How long cached sessions remain valid
    # 1 day balances security (limits window if session ticket key is compromised)
    # vs performance (clients reconnecting within 24h skip full handshake)
    ssl_session_timeout 1d;

    # Session tickets: DISABLED for Perfect Forward Secrecy
    # Session tickets encrypt the session state and send it to the client, allowing
    # session resumption without server-side storage. However, if the ticket key is
    # compromised, an attacker can decrypt ALL sessions encrypted with that key.
    # Disabling tickets ensures each session uses fresh key material via ECDHE.
    # Reference: https://blog.cloudflare.com/tls-session-resumption-full-speed-and-secure/
    ssl_session_tickets off;

    # OCSP Stapling - disabled for self-signed certificates
    # Self-signed certs have no OCSP responder, so stapling would fail.
    # Re-enable these lines if switching to a CA-signed certificate:
    # ssl_stapling on;
    # ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ═══════════════════════════════════════════════════════════════════════════
    # Rate Limiting Zones
    # Reference: https://nginx.org/en/docs/http/ngx_http_limit_req_module.html
    #
    # ZONE MEMORY: 10m = 10MB, holds ~160,000 IP addresses (each entry ~64 bytes)
    # $binary_remote_addr uses 4-byte IPv4 or 16-byte IPv6 (vs string IP which
    # would use 7-15 bytes for IPv4). Binary format saves memory in high-traffic.
    #
    # BURST PARAMETER (set per-location, not here):
    # - burst=N allows N requests to queue beyond the rate limit
    # - nodelay: queued requests are processed immediately (no artificial delay)
    #   Without nodelay, burst requests are spaced out to match the rate limit,
    #   which adds latency. With nodelay, burst requests complete fast but the
    #   client exhausts their burst capacity quickly.
    # ═══════════════════════════════════════════════════════════════════════════

    # General zone: 20 requests/second per IP
    # Suitable for normal app traffic (page loads, API calls, static assets)
    # At 20r/s, a user browsing normally won't hit the limit; automated scrapers will.
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

    # Auth zone: 60 requests/minute (1 req/s) per IP
    # Applied to authentication endpoints to limit brute-force attacks.
    # 60r/m allows legitimate multi-user households (2-3 users logging in) while
    # blocking password-guessing attacks (which typically attempt 100s of passwords).
    limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;

    # HTTP status code returned when rate limit is exceeded
    # 429 Too Many Requests is the standard code; some bots ignore it but
    # well-behaved clients will back off. Alternatives: 503 (pretend overload)
    # or 444 (nginx-specific: close connection without response).
    limit_req_status 429;
    limit_conn_status 429;

    # Default client body size (can be overridden per-location)
    client_max_body_size 10m;

    include /etc/nginx/conf.d/*.conf;
}
