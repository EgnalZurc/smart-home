# ═══════════════════════════════════════════════════════════════════════════════
# Static CSP - For routes that don't support dynamic nonces
#
# Include this in locations that proxy to services without CSP middleware
# (Vaultwarden, Zigbee2MQTT, microservices, static files from non-dashboard services).
#
# REFERENCES:
# - CSP Reference: https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
# - CSP Evaluator: https://csp-evaluator.withgoogle.com/
# - OWASP CSP Cheat Sheet: https://cheatsheetseries.owasp.org/cheatsheets/Content_Security_Policy_Cheat_Sheet.html
#
# DIRECTIVE BREAKDOWN:
# - default-src 'self': Fallback for all fetch directives; only allow same-origin
# - script-src 'self' 'unsafe-inline' ...: Scripts from same origin + inline scripts
#   - 'unsafe-inline' is required for Vaultwarden/Zigbee2MQTT (legacy services)
#   - cdn.jsdelivr.net: Chart.js and other visualization libraries
#   - unpkg.com: Common JS libraries (Alpine.js, htmx, etc.)
# - style-src 'self' 'unsafe-inline': Styles from same origin + inline styles
#   - Many services use inline styles; removing 'unsafe-inline' would break them
# - img-src 'self' data: https:: Images from same origin, data URIs (inline SVGs),
#   and any HTTPS source (favicons, external images)
# - connect-src 'self' wss:: XHR/fetch to same origin + WebSocket (wss://) for
#   real-time updates in Vaultwarden, AC service, Zigbee2MQTT
# - frame-ancestors 'none': Equivalent to X-Frame-Options: DENY; prevents embedding
#   in iframes to mitigate clickjacking. More flexible than X-Frame-Options because
#   it supports allowlisting specific origins if needed later.
#
# SECURITY LIMITATIONS:
# - 'unsafe-inline' in script-src weakens XSS protection significantly
# - Ideally, services would support nonce-based CSP (like the dashboard does)
# - This is a tradeoff: some protection > no CSP at all
#
# Dashboard routes (/, /api/, /static/) should NOT include this file - they
# receive CSP headers with per-request nonces from CSPNonceMiddleware.
# ═══════════════════════════════════════════════════════════════════════════════

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss:; frame-ancestors 'none'" always;
