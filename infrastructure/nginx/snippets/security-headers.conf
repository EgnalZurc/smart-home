# ═══════════════════════════════════════════════════════════════════════════════
# Security Headers - Shared across all server blocks
# Include this file in each server block: include /etc/nginx/snippets/security-headers.conf;
#
# NOTE: Content-Security-Policy is NOT included here because it needs per-route
# customization (dynamic nonces for dashboard routes). See csp-static.conf for
# the fallback CSP used by non-dashboard routes.
#
# REFERENCES:
# - OWASP Secure Headers: https://owasp.org/www-project-secure-headers/
# - MDN HTTP Headers: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers
# - SecurityHeaders.com: https://securityheaders.com/
# ═══════════════════════════════════════════════════════════════════════════════

# HSTS (HTTP Strict Transport Security)
# Forces browsers to only connect via HTTPS for 1 year (31536000 seconds).
# includeSubDomains: Applies to all subdomains (e.g., api.example.com)
# preload: Signals intent to be included in browser HSTS preload lists
#          (requires submission to https://hstspreload.org/)
# 'always': Add header even on error responses (4xx, 5xx)
# Reference: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# X-Frame-Options - Clickjacking protection
# DENY: Page cannot be displayed in a frame, regardless of the site attempting to do so
# Alternatives: SAMEORIGIN (allow frames from same origin), ALLOW-FROM uri (deprecated)
# Note: Superseded by CSP frame-ancestors, but still needed for older browsers
# Reference: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Frame-Options
add_header X-Frame-Options "DENY" always;

# X-Content-Type-Options - MIME type sniffing prevention
# nosniff: Browser must use the declared Content-Type, not guess from content
# Prevents attacks where browser interprets uploaded file as HTML/JS
# Reference: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
add_header X-Content-Type-Options "nosniff" always;

# Referrer-Policy - Controls information sent in Referer header
# strict-origin-when-cross-origin:
#   - Same-origin requests: full URL path sent
#   - Cross-origin HTTPS→HTTPS: only origin (no path) sent
#   - HTTPS→HTTP (downgrade): no referrer sent (prevents leaking sensitive URLs)
# Alternatives: no-referrer (most private), origin-when-cross-origin (less strict)
# Reference: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Referrer-Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions-Policy (formerly Feature-Policy) - Restrict browser features
# geolocation=(): Disable geolocation API
# microphone=(): Disable microphone access
# camera=(): Disable camera access
# Empty () means "disabled for all origins including self"
# Note: Can also allowlist specific origins, e.g., camera=(self "https://trusted.com")
# Reference: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Hide upstream server technology headers
# X-Powered-By: Commonly reveals framework/version (e.g., "Express", "PHP/8.1")
# Server: nginx's server_tokens off handles the nginx version, but upstreams
#         may still send their own Server header through the proxy.
# Hiding these prevents information disclosure that aids attackers in targeting
# known vulnerabilities for specific versions.
# Reference: https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/01-Information_Gathering/02-Fingerprinting_Web_Server
proxy_hide_header X-Powered-By;
proxy_hide_header Server;

# X-XSS-Protection - XSS Auditor control
# "0": DISABLED (recommended by MDN as of 2024)
# Modern browsers have removed or deprecated their XSS auditors because:
# 1. They created false positives blocking legitimate content
# 2. They could be exploited to leak data or bypass other protections
# 3. CSP provides superior XSS protection
# Setting to "0" explicitly disables any remaining auditor behavior.
# Reference: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
add_header X-XSS-Protection "0" always;

# X-DNS-Prefetch-Control - DNS prefetching control
# "off": Disable DNS prefetching to prevent privacy leakage
# DNS prefetching resolves domain names before the user clicks links, which:
# 1. Leaks browsing intent to DNS servers (what links are on the page)
# 2. Can be abused for tracking via unique subdomains
# 3. Minor performance gain isn't worth the privacy tradeoff for internal apps
# Reference: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-DNS-Prefetch-Control
add_header X-DNS-Prefetch-Control "off" always;

# Cross-Origin-Opener-Policy (COOP) - Window isolation
# "same-origin": Page can only share browsing context with same-origin documents
# Prevents cross-origin attacks like Spectre that exploit shared process memory.
# Windows opened by this page with different origins get their own browsing context.
# Reference: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cross-Origin-Opener-Policy
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Cross-Origin-Resource-Policy (CORP) - Resource loading restriction
# "same-origin": Resources can only be loaded by same-origin pages
# Prevents cross-origin embedding of resources (images, scripts, styles).
# Works with COOP to provide defense against Spectre-like side-channel attacks.
# Note: May need "cross-origin" if serving assets to other origins (CDN, etc.)
# Reference: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cross-Origin-Resource-Policy
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Cache-Control - Prevent caching of sensitive responses
# "no-store": Browser must not store any part of the response (memory or disk).
# This prevents sensitive data (session tokens, personal info, API responses)
# from being cached and potentially accessed later by other users or processes.
# Note: For static assets (CSS, JS, images), override this per-location with
# appropriate caching headers (e.g., Cache-Control: public, max-age=31536000).
# Reference: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control
add_header Cache-Control "no-store" always;
