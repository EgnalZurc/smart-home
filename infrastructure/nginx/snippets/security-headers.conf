# ═══════════════════════════════════════════════════════════════════════════════
# Security Headers - Shared across all server blocks
# Include this file in each server block: include /etc/nginx/snippets/security-headers.conf;
#
# NOTE: Content-Security-Policy is NOT included here because it needs per-route
# customization (dynamic nonces for dashboard routes). See csp-static.conf for
# the fallback CSP used by non-dashboard routes.
# ═══════════════════════════════════════════════════════════════════════════════

# HSTS - Force HTTPS for 1 year, include subdomains, allow preload list submission
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Prevent clickjacking - deny all framing
add_header X-Frame-Options "DENY" always;

# Prevent MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Control referrer information sent to other sites
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Restrict browser features - deny geolocation, microphone, camera
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
