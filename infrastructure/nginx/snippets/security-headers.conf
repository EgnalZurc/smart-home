# ═══════════════════════════════════════════════════════════════════════════════
# Security Headers - Shared across all server blocks
# Include this file in each server block: include /etc/nginx/snippets/security-headers.conf;
# ═══════════════════════════════════════════════════════════════════════════════

# HSTS - Force HTTPS for 1 year, include subdomains, allow preload list submission
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Prevent clickjacking - deny all framing
add_header X-Frame-Options "DENY" always;

# Prevent MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Control referrer information sent to other sites
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Restrict browser features - deny geolocation, microphone, camera
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Content Security Policy - baseline restrictive policy
# - default-src 'self': only allow resources from same origin
# - script-src: allow inline scripts (needed for some services), self, and trusted CDNs
# - style-src: allow inline styles (needed for some services) and self
# - img-src: allow self, data URIs, and HTTPS images
# - connect-src: allow self and WebSocket connections
# - frame-ancestors 'none': equivalent to X-Frame-Options DENY for CSP-aware browsers
# Trusted CDNs: cdn.jsdelivr.net (Chart.js), unpkg.com (common JS libraries)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss:; frame-ancestors 'none'" always;
