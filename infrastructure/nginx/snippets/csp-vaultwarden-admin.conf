# ═══════════════════════════════════════════════════════════════════════════════
# Restrictive CSP - Vaultwarden Admin Panel
#
# The admin panel is a high-value target (server config, user management) so it
# gets a stricter CSP than regular Vaultwarden routes:
# - NO 'unsafe-inline' in script-src (admin panel doesn't need it)
# - NO external CDNs (admin panel doesn't load Chart.js or other external libs)
# - NO wss: in connect-src (admin panel uses standard HTTP, no WebSocket)
#
# This reduces attack surface compared to csp-static.conf while maintaining
# functionality. If the admin panel breaks, verify Vaultwarden version hasn't
# added inline scripts or external dependencies.
#
# REFERENCES:
# - CSP Reference: https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
# - Vaultwarden Admin: https://github.com/dani-garcia/vaultwarden/wiki/Enabling-admin-page
# ═══════════════════════════════════════════════════════════════════════════════

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
