server {
    listen 80;
    server_name _;
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── nginx auth_request guard ─────────────────────────────────────────────
    # Called by auth_request before proxying to external microservices.
    # Returns 200 (authenticated) or 401 (redirect to login).
    location = /_auth_check {
        internal;
        client_max_body_size 650M;
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_http_version 1.1;
    }


    # PWA manifest and favicon
    location = /static/manifest.json {
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
    location = /favicon.ico {
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080/static/favicon.ico;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # Auth routes
    location /auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req zone=general burst=20 nodelay;
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Static files
    location /static/ {
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # ── Vaultwarden (PWD-1) ───────────────────────────────────────────────────
    # Single regex block captures ALL Bitwarden client API paths and the web UI.
    # Using ^~ prefix match + regex inside ensures no trailing-slash redirect
    # issues and no leakage to the FastAPI /api/ block below.
    #
    # Paths routed here:
    #   /passwords/          web-vault SPA
    #   /identity/           authentication (login, token refresh)
    #   /api/accounts/       registration, profile, prelogin
    #   /api/ciphers         create/read/update/delete credentials  ← POST without slash
    #   /api/sync            full vault sync
    #   /api/folders         folder management
    #   /api/sends           Bitwarden Send
    #   /api/collections     org collections
    #   /api/organizations   org management
    #   /api/settings        account settings
    #   /api/two-factor      2FA management
    #   /api/devices         device management
    #   /api/config          server config (fetched on login)
    #   /api/public          org public API
    #   /notifications/      WebSocket push notifications
    #   /icons/              website favicons
    #   /vw_static/          Vaultwarden static assets

    location = /passwords { return 301 /passwords/; }

    location /passwords/ {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://vaultwarden:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /identity/ {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://vaultwarden:80/identity/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location /notifications/ {
        proxy_pass http://vaultwarden:80/notifications/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    location /icons/ {
        proxy_pass http://vaultwarden:80/icons/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    location /vw_static/ {
        proxy_pass http://vaultwarden:80/vw_static/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # Vaultwarden /api/* — regex match, no trailing-slash redirect, no FastAPI leakage.
    # ~* makes it case-insensitive. The regex matches /api/<vaultwarden-path> exactly.
    # FastAPI smart-home paths are: /api/status /api/health/* /api/proxy/* /api/ac/*
    # /api/sensors /api/outdoor /api/errors /casita/* /api/humidity /api/ac-chart
    # None of these overlap with Bitwarden paths.
    location ~* ^/api/(accounts|ciphers|folders|collections|sends|organizations|settings|two-factor|devices|sync|public)(/|$) {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://vaultwarden:80$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # ── Public health checks (no auth_request) ─────────────────────────────
    # These are polled by the dashboard without a session cookie.
    # They proxy to the backend which in turn proxies to each service.
    # Baby Gifts health check (direct to service, must be before the generic health regex)
    location = /api/health/baby-gifts {
        set $babygifts_host "baby-gifts-service";
        proxy_pass http://$babygifts_host:8004;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
    location ~ ^/api/health/ {
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }


    # ── /api/config: split GET→Vaultwarden (server config) / POST→ac-service ──
    # GET  /api/config is called by Bitwarden clients on login (server capability discovery).
    # POST /api/config is called by the AC dashboard to update target temperature.
    # Named internal location avoids proxy_pass inside if{} (nginx "evil if" anti-pattern).
    location = /api/config {
        limit_req zone=general burst=30 nodelay;
        if ($request_method = GET) {
            rewrite ^ /_vw_config_internal last;
        }
        # POST (and any other method) → ac-service with auth guard
        auth_request /_auth_check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;
        set $ac_host "ac-service";
        proxy_pass http://$ac_host:8002/api/config;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    # Internal proxy to Vaultwarden server config (GET /api/config only)
    location = /_vw_config_internal {
        internal;
        proxy_pass http://vaultwarden:80/api/config;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # ── AC Service (AC-1) — port 8002 ────────────────────────────────────────
    location /smart-home/ac {
        auth_request /_auth_check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;
        set $ac_host "ac-service";
        proxy_pass http://$ac_host:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    # AC API routes — all proxied to ac-service:8002
    location ~ ^/api/(status|sensors|history|control_mode|manual_params?|ac_real|outdoor|errors|subscriptions|humidity|energy)(/|$) {
        auth_request /_auth_check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;
        set $ac_host "ac-service";
        proxy_pass http://$ac_host:8002$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # ── Valheim Admin (VLH-ADM-1) — port 8080 ───────────────────────────────
    location /valheim-admin {
        return 301 /valheim-admin/;
    }
    location /valheim-admin/ {
        auth_request /_auth_check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;
        set $vadmin_host "valheim-admin";
        rewrite ^/valheim-admin/(.*)$ /$1 break;
        proxy_pass http://$vadmin_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        client_max_body_size 650M;
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;
    }

    # ── Vacaciones Service (VAC-1) — port 8003 ───────────────────────────────
    location /smart-home/vacaciones {
        auth_request /_auth_check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;
        set $vac_host "vacaciones-service";
        proxy_pass http://$vac_host:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-User $auth_user;
        proxy_http_version 1.1;
    }
    location /api/vacaciones {
        auth_request /_auth_check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;
        set $vac_host "vacaciones-service";
        proxy_pass http://$vac_host:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    location /api/health/vacaciones {
        set $vac_host "vacaciones-service";
        proxy_pass http://$vac_host:8003;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # ── Baby Gifts Service — port 8004 ───────────────────────────────────────
    # Admin routes (protected by auth_request)
    location /smart-home/baby-gifts {
        auth_request /_auth_check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;
        set $babygifts_host "baby-gifts-service";
        proxy_pass http://$babygifts_host:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-User $auth_user;
        proxy_http_version 1.1;
    }
    # Admin API (protected)
    location /api/baby-gifts {
        auth_request /_auth_check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;
        set $babygifts_host "baby-gifts-service";
        proxy_pass http://$babygifts_host:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-User $auth_user;
        proxy_http_version 1.1;
    }
    # Guest routes (PUBLIC - no auth_request, token-based access)
    location /baby-gifts/i/ {
        limit_req zone=auth burst=10 nodelay;
        set $babygifts_host "baby-gifts-service";
        proxy_pass http://$babygifts_host:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    # Guest API (PUBLIC - token validated by service)
    location ~ ^/api/baby-gifts/guest/ {
        limit_req zone=auth burst=10 nodelay;
        set $babygifts_host "baby-gifts-service";
        proxy_pass http://$babygifts_host:8004$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # ── Smart-home FastAPI backend ────────────────────────────────────────────
    location /api/ {
        limit_req zone=general burst=30 nodelay;
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Main app
    location / {
        limit_req zone=general burst=20 nodelay;
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /zigbee/ {
        limit_req zone=general burst=20 nodelay;
        rewrite ^/zigbee/(.*)$ /$1 break;
        proxy_pass http://zigbee2mqtt:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location = /zigbee { return 301 /zigbee/; }

    location = /photos {
        return 301 https://raspberrypi.tailaa37cd.ts.net:10000/;
    }

    location /health {
        limit_req zone=general burst=5 nodelay;
        return 200 "OK\n";
    }

    location @login_redirect {
        return 302 /auth/login?next=$request_uri;
    }

}
