server {
    listen 80;
    server_name cuchi-casa.duckdns.org raspberrypi.tailaa37cd.ts.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cuchi-casa.duckdns.org raspberrypi.tailaa37cd.ts.net;

    ssl_certificate /etc/letsencrypt/live/cuchi-casa.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cuchi-casa.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    auth_basic "Smart Home";
    auth_basic_user_file /etc/nginx/.htpasswd;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate limiting (F0.27)
    # Apply strict auth zone to catch brute force on authentication
    limit_req zone=auth burst=10 nodelay;
    limit_req zone=general burst=20 nodelay;

    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /zigbee/ {
        proxy_pass http://zigbee2mqtt:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /zigbee {
        return 301 /zigbee/;
    }

    location /health {
        auth_basic off;
        limit_req zone=general burst=5 nodelay;
        return 200 "OK\n";
    }
}