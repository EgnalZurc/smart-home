server {
    listen 80;
    server_name _;
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    # AUTH: HTTP Basic Auth removed — authentication is now handled by
    # the FastAPI backend via JWT session cookies (see src/backend/auth.py).
    # All protected routes redirect to /auth/login if no valid cookie is found.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    resolver 127.0.0.11 valid=30s ipv6=off;
    # PWA manifest and favicon: no auth (browser fetches these automatically)
    location = /static/manifest.json {
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
    location = /favicon.ico {
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080/static/favicon.ico;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
    # Auth routes: public (login page, token endpoint, logout, trust callbacks)
    # Extra rate limiting here as first line of brute-force defence.
    location /auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req zone=general burst=20 nodelay;
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    # Static files: NO rate limiting
    # ES modules load ~15 files in parallel on page load — never throttle them
    location /static/ {
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    # ── Vaultwarden API routes (PWD-1) ────────────────────────────────────────
    # These MUST appear BEFORE the generic /api/ block below, which routes to
    # the smart-home FastAPI backend.
    # Vaultwarden uses: /identity/ /notifications/ /icons/ /vw_static/
    # and the following /api/ sub-paths (Bitwarden client API).
    # The web-vault SPA is served from /passwords/.
    #
    # Bitwarden /api/ sub-paths used by clients:
    #   accounts, ciphers, folders, collections, sends, organizations,
    #   settings, two-factor, devices, sync, public
    # We route them individually so the rest of /api/ still goes to FastAPI.
    location /identity/ {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://vaultwarden:80/identity/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    location /notifications/ {
        proxy_pass http://vaultwarden:80/notifications/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /icons/ {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://vaultwarden:80/icons/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
    location /vw_static/ {
        proxy_pass http://vaultwarden:80/vw_static/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
    # Vaultwarden /api/* sub-paths used by Bitwarden clients
    # (listed explicitly so the generic /api/ block below still serves FastAPI)
    location /api/accounts/ {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://vaultwarden:80/api/accounts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    location /api/ciphers/ {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://vaultwarden:80/api/ciphers/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    location /api/folders/ {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://vaultwarden:80/api/folders/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    location /api/collections/ {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://vaultwarden:80/api/collections/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    location /api/sends/ {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://vaultwarden:80/api/sends/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    location /api/organizations/ {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://vaultwarden:80/api/organizations/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    location /api/settings/ {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://vaultwarden:80/api/settings/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    location /api/two-factor/ {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://vaultwarden:80/api/two-factor/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    location /api/devices/ {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://vaultwarden:80/api/devices/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    location /api/sync {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://vaultwarden:80/api/sync;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    location /api/config {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://vaultwarden:80/api/config;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    # ── Smart-home FastAPI backend API (general) ──────────────────────────────
    # Catches all /api/* not matched above (status, health/*, proxy/*, etc.)
    location /api/ {
        limit_req zone=general burst=30 nodelay;
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    # Main app: general rate limit
    location / {
        limit_req zone=general burst=20 nodelay;
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /zigbee/ {
        limit_req zone=general burst=20 nodelay;
        # rewrite strips /zigbee prefix before proxying to Zigbee2MQTT
        rewrite ^/zigbee/(.*)$ /$1 break;
        proxy_pass http://zigbee2mqtt:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Larger buffers for Zigbee2MQTT SPA assets
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    location = /zigbee {
        return 301 /zigbee/;
    }
    # Immich photo backup (PHO-1)
    # Immich is served at https://raspberrypi.tailaa37cd.ts.net:8444/ via Tailscale Serve
    # (Immich does not support sub-paths, so it cannot share the nginx /api/ namespace)
    location = /photos {
        return 301 https://raspberrypi.tailaa37cd.ts.net:10000/;
    }
    # 🔐 Vaultwarden web-vault SPA (PWD-1)
    # The web UI lives at /passwords/ — proxied directly to the container root.
    # All Bitwarden client API calls (/identity/, /api/accounts/, etc.) are
    # handled by the explicit location blocks above.
    location /passwords/ {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://vaultwarden:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location = /passwords {
        return 301 /passwords/;
    }
    location /health {
        limit_req zone=general burst=5 nodelay;
        return 200 "OK\n";
    }
}
