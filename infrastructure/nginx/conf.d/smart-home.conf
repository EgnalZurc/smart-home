server {
    listen 80;
    server_name _;
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # AUTH: HTTP Basic Auth removed — authentication is now handled by
    # the FastAPI backend via JWT session cookies (see src/backend/auth.py).
    # All protected routes redirect to /auth/login if no valid cookie is found.

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # PWA manifest and favicon: no auth (browser fetches these automatically)
    location = /static/manifest.json {
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
    location = /favicon.ico {
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080/static/favicon.ico;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # Auth routes: public (login page, token endpoint, logout, trust callbacks)
    # Extra rate limiting here as first line of brute-force defence.
    location /auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req zone=general burst=20 nodelay;
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Static files: NO rate limiting
    # ES modules load ~15 files in parallel on page load — never throttle them
    location /static/ {
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # API endpoints: general rate limit only (polling every 5s)
    location /api/ {
        limit_req zone=general burst=30 nodelay;
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Main app: general rate limit
    location / {
        limit_req zone=general burst=20 nodelay;
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /zigbee/ {
        limit_req zone=general burst=20 nodelay;
        # rewrite strips /zigbee prefix before proxying to Zigbee2MQTT
        rewrite ^/zigbee/(.*)$ /$1 break;
        proxy_pass http://zigbee2mqtt:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Larger buffers for Zigbee2MQTT SPA assets
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    location = /zigbee {
        return 301 /zigbee/;
    }

    # Immich photo backup (PHO-1)
    # Immich is served at https://raspberrypi.tailaa37cd.ts.net:8444/ via Tailscale Serve
    # (Immich does not support sub-paths, so it cannot share the nginx /api/ namespace)
    location = /photos {
        return 301 https://raspberrypi.tailaa37cd.ts.net:8444/;
    }

    location /health {
        limit_req zone=general burst=5 nodelay;
        return 200 "OK\n";
    }
}
