server {
    listen 80;
    server_name _;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    auth_basic "Smart Home";
    auth_basic_user_file /etc/nginx/.htpasswd;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # PWA manifest and favicon: no auth (browser fetches these automatically)
    location = /static/manifest.json {
        auth_basic off;
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    location = /favicon.ico {
        auth_basic off;
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080/static/favicon.ico;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # Static files: NO rate limiting
    # ES modules load ~15 files in parallel on page load - never throttle them
    location /static/ {
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # API endpoints: general rate limit only (polling every 5s)
    location /api/ {
        limit_req zone=general burst=30 nodelay;
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Main app: auth zone (brute force protection) + general zone
    location / {
        limit_req zone=auth burst=30 nodelay;
        limit_req zone=general burst=20 nodelay;
        set $backend_host "backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /zigbee/ {
        limit_req zone=general burst=20 nodelay;
        # rewrite strips /zigbee prefix before proxying to Zigbee2MQTT
        rewrite ^/zigbee/(.*)$ /$1 break;
        proxy_pass http://zigbee2mqtt:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Larger buffers for Zigbee2MQTT SPA assets
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location = /zigbee {
        return 301 /zigbee/;
    }

    # Immich photo backup (PHO-1)
    # Note: Immich does not officially support sub-paths.
    # Access via Tailnet directly: http://raspberrypi:2283
    # This nginx block provides web access with sub_filter rewriting.
    location /photos/ {
        limit_req zone=general burst=30 nodelay;
        rewrite ^/photos/(.*)$ /$1 break;
        proxy_pass http://immich-server:2283;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Large uploads (videos, photos)
        client_max_body_size 0;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        # Rewrite base path in HTML/JS responses
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html application/javascript;
        sub_filter 'base: ""' 'base: "/photos"';
        sub_filter 'baseURL = ""' 'baseURL = "/photos"';
    }

    location = /photos {
        return 301 /photos/;
    }

    location /health {
        auth_basic off;
        limit_req zone=general burst=5 nodelay;
        return 200 "OK\n";
    }
}
