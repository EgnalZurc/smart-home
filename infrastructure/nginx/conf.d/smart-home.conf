# ═══════════════════════════════════════════════════════════════════════════════
# Cuchi Casa nginx Server Configuration
# See infrastructure/nginx/README.md for security documentation
#
# CSP STRATEGY:
# - Dashboard routes (/, /api/, /static/): Backend sets CSP with nonce, nginx passes through
# - Other services (Vaultwarden, Zigbee2MQTT, etc.): nginx adds static CSP with unsafe-inline
# - security-headers.conf includes all headers EXCEPT CSP (handled per-route)
# ═══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    # Main dashboard server block
    # Listens on 8443 because Tailscale Funnel proxies :443 -> localhost:8443
    listen 8443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers from shared snippet
    include /etc/nginx/snippets/security-headers.conf;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── nginx auth_request guard ─────────────────────────────────────────────
    # Called by auth_request before proxying to external microservices.
    # Returns 200 (authenticated) or 401 (redirect to login).
    location = /_auth_check {
        internal;
        client_max_body_size 650M;
        set $backend_host "smart-home-backend";
        proxy_pass http://$backend_host:8080/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }


    # PWA manifest and favicon
    location = /static/manifest.json {
        set $backend_host "smart-home-backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location = /favicon.ico {
        set $backend_host "smart-home-backend";
        proxy_pass http://$backend_host:8080/static/favicon.ico;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Auth routes - redirect legacy /auth/* to /api/auth/*
    location /auth/ {
        return 301 /api/auth/$1;
    }

    # API Auth routes
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req zone=general burst=20 nodelay;
        set $backend_host "smart-home-backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Static files - AC service specific (must be before general /static/)
    # CSP: static assets from microservice, use fallback with unsafe-inline
    location /static/ac/ {
        set $ac_host "ac-service";
        proxy_pass http://$ac_host:8002;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }

    # Static files - Vacaciones service
    # CSP: static assets from microservice, use fallback with unsafe-inline
    location /static/vacaciones/ {
        set $vac_host "vacaciones-service";
        proxy_pass http://$vac_host:8003;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }

    # Static files - Baby Gifts service
    # CSP: static assets from microservice, use fallback with unsafe-inline
    location /static/baby-gifts/ {
        set $bg_host "baby-gifts-service";
        proxy_pass http://$bg_host:8004$request_uri;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }

    # Static files
    location /static/ {
        set $backend_host "smart-home-backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Vaultwarden (PWD-1) ───────────────────────────────────────────────────
    # All Vaultwarden routes are under /passwords/ to match DOMAIN setting.
    # When DOMAIN=.../passwords, vaultwarden expects all paths with that prefix.
    #
    # Paths routed here (all under /passwords/):
    #   /passwords/                    web-vault SPA
    #   /passwords/identity/           authentication (login, token refresh)
    #   /passwords/api/                Bitwarden API
    #   /passwords/notifications/      WebSocket push notifications
    #   /passwords/icons/              website favicons
    #   /passwords/admin/              admin panel

    location = /passwords { return 301 /passwords/; }

    # Vaultwarden admin panel - protected by auth_request (PWD-ADMIN)
    # The admin panel exposes server configuration and user management, so it
    # must sit behind the dashboard session guard like other protected routes.
    # Longest-prefix match ensures /passwords/admin* hits this block instead of
    # the generic /passwords/ proxy below.
    # CSP: Vaultwarden, use fallback with unsafe-inline
    location /passwords/admin {
        auth_request /_auth_check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;
        limit_req zone=general burst=30 nodelay;
        set $vaultwarden_host "vaultwarden";
        proxy_pass http://$vaultwarden_host:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }

    # Vaultwarden identity (login/token) - rate limited for brute-force protection
    # CSP: Vaultwarden, use fallback with unsafe-inline
    location /passwords/identity/ {
        limit_req zone=auth burst=10 nodelay;
        set $vaultwarden_host "vaultwarden";
        proxy_pass http://$vaultwarden_host:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }

    # Main vaultwarden proxy - handles all /passwords/* requests
    # WebSocket support for notifications - use longer timeouts
    # CSP: Vaultwarden, use fallback with unsafe-inline
    location /passwords/ {
        limit_req zone=general burst=30 nodelay;
        set $vaultwarden_host "vaultwarden";
        proxy_pass http://$vaultwarden_host:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Disable buffering for WebSocket notifications
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        include /etc/nginx/snippets/csp-static.conf;
    }

    # Legacy routes - proxy to /passwords/* for backwards compatibility
    # These ensure old bookmarks and browser extensions still work
    # IMPORTANT: Use rewrite+proxy instead of 301 redirect because
    # HTTP 301 converts POST to GET, breaking Bitwarden auth endpoints.
    #
    # See: docs/VAULTWARDEN_PROXY.md for full documentation
    # CSP: Vaultwarden legacy routes, use fallback with unsafe-inline
    location /identity/ {
        limit_req zone=auth burst=10 nodelay;
        set $vaultwarden_host "vaultwarden";
        rewrite ^/identity/(.*)$ /passwords/identity/$1 break;
        proxy_pass http://$vaultwarden_host:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }
    # Bitwarden API endpoints - comprehensive list from official API
    # Matches: /api/sync, /api/accounts/*, /api/ciphers/*, /api/folders/*, etc.
    # CSP: Vaultwarden API, use fallback with unsafe-inline
    location ~ ^/api/(sync|accounts|ciphers|folders|collections|organizations|sends|settings|devices|two-factor|auth-requests|emergency-access|events|groups|hibp|import|notifications|policies|push|reports|users|web-authn)(/|$) {
        set $vaultwarden_host "vaultwarden";
        rewrite ^/api/(.*)$ /passwords/api/$1 break;
        proxy_pass http://$vaultwarden_host:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }
    location /vw_static/ {
        set $vaultwarden_host "vaultwarden";
        rewrite ^/vw_static/(.*)$ /passwords/vw_static/$1 break;
        proxy_pass http://$vaultwarden_host:80;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }
    location /notifications/ {
        set $vaultwarden_host "vaultwarden";
        rewrite ^/notifications/(.*)$ /passwords/notifications/$1 break;
        proxy_pass http://$vaultwarden_host:80;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        include /etc/nginx/snippets/csp-static.conf;
    }
    # Icons endpoint for website favicons
    location /icons/ {
        set $vaultwarden_host "vaultwarden";
        rewrite ^/icons/(.*)$ /passwords/icons/$1 break;
        proxy_pass http://$vaultwarden_host:80;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }
    # Mobile app connector - proxy-cookie-redirect for session sync
    # Bitwarden mobile apps request /proxy-cookie-redirect-connector.html at root
    # when syncing auth between the embedded browser and the app.
    # Use regex to match both the HTML file and any query params.
    location ~ ^/proxy-cookie-redirect {
        set $vaultwarden_host "vaultwarden";
        rewrite ^(/proxy-cookie-redirect.*)$ /passwords$1 break;
        proxy_pass http://$vaultwarden_host:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }
    # Connector static assets (JS files for mobile auth flow)
    location /connectors/ {
        set $vaultwarden_host "vaultwarden";
        rewrite ^/connectors/(.*)$ /passwords/connectors/$1 break;
        proxy_pass http://$vaultwarden_host:80;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }
    # SSO cookie vendor endpoint for mobile app sync completion
    # Bitwarden mobile apps redirect here after proxy-cookie-redirect flow.
    # Since we don't have SSO enabled, serve a static page that completes
    # the auth handshake and tells the user to close the browser.
    location = /api/sso-cookie-vendor {
        default_type text/html;
        alias /etc/nginx/html/sso-cookie-vendor.html;
        include /etc/nginx/snippets/csp-static.conf;
    }

    # ── Public health checks (no auth_request) ─────────────────────────────
    # These are polled by the dashboard without a session cookie.
    # They proxy to the backend which in turn proxies to each service.
    # Baby Gifts health check (direct to service, must be before the generic health regex)
    location = /api/health/baby-gifts {
        set $babygifts_host "baby-gifts-service";
        proxy_pass http://$babygifts_host:8004;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location ~ ^/api/health/ {
        set $backend_host "smart-home-backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }


    # ── /api/config: Vaultwarden server config ──────────────────────────────────
    # GET  /api/config was previously used by Bitwarden clients.
    # Now all Vaultwarden routes are under /passwords/* so clients should use
    # /passwords/api/config instead. This redirect ensures compatibility.
    location = /api/config {
        return 301 /passwords/api/config;
    }

    # ── AC Service (AC-1) — port 8002 ────────────────────────────────────────
    # WebSocket support for real-time AC status updates
    # CSP: microservice, use fallback with unsafe-inline
    location /smart-home/ac {
        auth_request /_auth_check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;
        set $ac_host "ac-service";
        proxy_pass http://$ac_host:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        include /etc/nginx/snippets/csp-static.conf;
    }
    # AC API routes — all under /api/ac/* proxied to ac-service:8002
    # CSP: microservice API, use fallback with unsafe-inline
    location /api/ac/ {
        auth_request /_auth_check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;
        set $ac_host "ac-service";
        proxy_pass http://$ac_host:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }
    # AC health check (public, no auth)
    location = /api/health/ac {
        set $ac_host "ac-service";
        proxy_pass http://$ac_host:8002;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Valheim Admin (VLH-ADM-1) — port 8080 ───────────────────────────────
    # CSP: microservice, use fallback with unsafe-inline
    location /valheim-admin {
        return 301 /valheim-admin/;
    }
    location /valheim-admin/ {
        auth_request /_auth_check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;
        set $vadmin_host "valheim-admin";
        rewrite ^/valheim-admin/(.*)$ /$1 break;
        proxy_pass http://$vadmin_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        client_max_body_size 650M;
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;
        include /etc/nginx/snippets/csp-static.conf;
    }

    # ── Vacaciones Service (VAC-1) — port 8003 ───────────────────────────────
    # CSP: microservice, use fallback with unsafe-inline
    location /smart-home/vacaciones {
        auth_request /_auth_check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;
        set $vac_host "vacaciones-service";
        proxy_pass http://$vac_host:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-User $auth_user;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }
    location /api/vacaciones {
        auth_request /_auth_check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;
        set $vac_host "vacaciones-service";
        proxy_pass http://$vac_host:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }
    location /api/health/vacaciones {
        set $vac_host "vacaciones-service";
        proxy_pass http://$vac_host:8003;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Baby Gifts Service — port 8004 ───────────────────────────────────────
    # Admin routes (protected by auth_request)
    # CSP: microservice, use fallback with unsafe-inline
    location /smart-home/baby-gifts {
        auth_request /_auth_check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;
        set $babygifts_host "baby-gifts-service";
        proxy_pass http://$babygifts_host:8004$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-User $auth_user;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }
    # Admin API (protected)
    location /api/baby-gifts {
        auth_request /_auth_check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;
        set $babygifts_host "baby-gifts-service";
        proxy_pass http://$babygifts_host:8004$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-User $auth_user;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }
    # Guest routes (PUBLIC - no auth_request, token-based access)
    location /guest/baby-gifts/ {
        limit_req zone=auth burst=10 nodelay;
        set $babygifts_host "baby-gifts-service";
        proxy_pass http://$babygifts_host:8004$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }
    # Guest API (PUBLIC - token validated by service)
    location ~ ^/api/baby-gifts/guest/ {
        limit_req zone=auth burst=10 nodelay;
        set $babygifts_host "baby-gifts-service";
        proxy_pass http://$babygifts_host:8004$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }

    # ── Casita Sueños Service — port 8001 ────────────────────────────────────
    # Frontend SPA (protected)
    # CSP: microservice, use fallback with unsafe-inline
    location /smart-home/casita {
        auth_request /_auth_check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;
        set $casita_host "casita-suenos";
        proxy_pass http://$casita_host:8001$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-User $auth_user;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }
    # Casita API (protected)
    location /api/casita {
        auth_request /_auth_check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;
        set $casita_host "casita-suenos";
        proxy_pass http://$casita_host:8001$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-User $auth_user;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }
    # Casita static files
    location /static/casita/ {
        set $casita_host "casita-suenos";
        proxy_pass http://$casita_host:8001$request_uri;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }
    # Casita health check (public)
    location = /api/health/casita {
        set $casita_host "casita-suenos";
        proxy_pass http://$casita_host:8001/health;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Portfolio Monitor Service — port 8010 ────────────────────────────────
    # Dashboard SPA (protected)
    # CSP: microservice, use fallback with unsafe-inline
    location /smart-home/portfolio {
        auth_request /_auth_check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;
        set $portfolio_host "portfolio-monitor";
        proxy_pass http://$portfolio_host:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-User $auth_user;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }
    # Portfolio API (protected)
    location /api/portfolio {
        auth_request /_auth_check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;
        set $portfolio_host "portfolio-monitor";
        proxy_pass http://$portfolio_host:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-User $auth_user;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }
    # Portfolio static files
    location /static/portfolio/ {
        set $portfolio_host "portfolio-monitor";
        proxy_pass http://$portfolio_host:8010;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/csp-static.conf;
    }
    # Portfolio health check (public)
    location = /api/health/portfolio {
        set $portfolio_host "portfolio-monitor";
        proxy_pass http://$portfolio_host:8010;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Smart-home FastAPI backend ────────────────────────────────────────────
    # WebSocket support for real-time updates
    location /api/ {
        limit_req zone=general burst=30 nodelay;
        set $backend_host "smart-home-backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Main app - WebSocket support for real-time updates
    location / {
        limit_req zone=general burst=20 nodelay;
        set $backend_host "smart-home-backend";
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Zigbee2MQTT (PROTECTED) ──────────────────────────────────────────────
    # Web interface for Zigbee device management - requires authentication
    # Control of Zigbee devices (locks, sensors, plugs) must be protected
    # WebSocket support for real-time device updates
    # CSP: external service, use fallback with unsafe-inline
    location /zigbee/ {
        auth_request /_auth_check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;

        limit_req zone=general burst=20 nodelay;
        set $zigbee_host "zigbee2mqtt";
        rewrite ^/zigbee/(.*)$ /$1 break;
        proxy_pass http://$zigbee_host:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        include /etc/nginx/snippets/csp-static.conf;
    }

    location = /zigbee { return 301 /zigbee/; }

    location = /photos {
        return 301 https://raspberrypi.tailaa37cd.ts.net:10000/;
    }

    location /health {
        limit_req zone=general burst=5 nodelay;
        return 200 "OK\n";
    }

    location @login_redirect {
        return 302 /api/auth/login?next=$request_uri;
    }

}

# ══════════════════════════════════════════════════════════════════════════════
# Local AI (Open WebUI) — port 8444 internal, exposed via Tailscale Funnel :8443
# ══════════════════════════════════════════════════════════════════════════════
# Open WebUI does NOT support subpaths (official WONTFIX), so it needs root path.
# 
# Architecture:
#   Internet -> Tailscale Funnel :8443 -> localhost:8444 -> nginx -> 192.168.1.164:3000
#
# URL: https://raspberrypi.tailaa37cd.ts.net:8443/
# Backend: http://192.168.1.164:3000 (EgnalPC running Open WebUI)
#
# Tailscale Funnel config (manual, not in CI):
#   tailscale funnel --bg --https=8443 https+insecure://localhost:8444
#
# Authentication: Uses auth_request to validate session cookie from main dashboard.
# If not authenticated, redirects to main dashboard login page.
#
# CSP: Open WebUI is external, use fallback CSP with unsafe-inline
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 8444 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers from shared snippet (all headers EXCEPT CSP)
    include /etc/nginx/snippets/security-headers.conf;
    # Static CSP for Open WebUI (no nonce support)
    include /etc/nginx/snippets/csp-static.conf;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # Auth check against main dashboard backend
    location = /_auth_check {
        internal;
        set $backend_host "smart-home-backend";
        proxy_pass http://$backend_host:8080/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        auth_request /_auth_check;
        error_page 401 = @login_redirect;

        proxy_pass http://192.168.1.164:3000;
        proxy_http_version 1.1;

        # Headers for Open WebUI
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (required for streaming responses)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # CRITICAL: Disable buffering for LLM streaming
        proxy_buffering off;
        proxy_cache off;

        # Extended timeouts for long completions (30 minutes)
        proxy_read_timeout    1800s;
        proxy_send_timeout    1800s;
        proxy_connect_timeout 60s;

        # Allow large file uploads (models, documents)
        client_max_body_size 100M;
    }

    location @login_redirect {
        # Redirect to main dashboard login, then back to AI on port 8443
        return 302 https://$host/api/auth/login?next=https://$host:8443/;
    }
}
