<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cuchi Casa</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="/static/tailwind.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .app-card {
            background: linear-gradient(145deg, rgba(30,41,59,0.8), rgba(15,23,42,0.9));
            border: 1px solid rgba(51,65,85,0.5);
            backdrop-filter: blur(10px);
            transition: transform 0.15s ease, border-color 0.2s ease;
            text-decoration: none; display: block;
        }
        .app-card:active { transform: scale(0.97); }
        @media (hover:hover) { .app-card:hover { border-color: rgba(99,102,241,0.4); transform: translateY(-1px); } }
        .status-dot { animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .fade-in { animation: fadeIn 0.35s ease; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
        .lang-dropdown { position: relative; }
        .flag-img { width: 24px; height: 16px; object-fit: cover; border-radius: 2px; display: block; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
        .lang-current { padding:4px; border-radius:6px; cursor:pointer; border:2px solid rgba(100,116,139,.3); background:rgba(30,41,59,.4); transition:all .2s; display:flex; align-items:center; justify-content:center; }
        .lang-current:hover { border-color:rgba(59,130,246,.5); background:rgba(59,130,246,.1); transform:scale(1.05); }
        .lang-menu { position:absolute; top:calc(100% + 8px); right:0; background:rgba(30,41,59,.95); border:1px solid rgba(100,116,139,.4); border-radius:8px; padding:4px; display:none; flex-direction:column; gap:4px; box-shadow:0 4px 12px rgba(0,0,0,.3); backdrop-filter:blur(10px); z-index:1000; min-width:50px; }
        .lang-menu.open { display:flex; }
        .lang-option { padding:4px; border-radius:4px; cursor:pointer; transition:all .2s; display:flex; align-items:center; justify-content:center; border:2px solid transparent; }
        .lang-option:hover { background:rgba(59,130,246,.2); border-color:rgba(59,130,246,.4); }
        .lang-option.active { background:rgba(59,130,246,.15); border-color:rgba(59,130,246,.5); }
        /* Spinner */
        #loading-overlay { position:fixed; inset:0; z-index:99999; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0f172a; transition:opacity .35s ease; }
        #loading-overlay.done { opacity:0; pointer-events:none; }
        #dash-content { opacity:0; transition:opacity .35s ease; }
        #dash-content.visible { opacity:1; }
        .spinner { width:32px; height:32px; border:3px solid rgba(255,255,255,.1); border-top-color:rgba(255,255,255,.7); border-radius:50%; animation:spin .8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        /* User dropdown */
        .user-dropdown { position:relative; }
        .user-chip {
            display:flex; align-items:center; gap:6px;
            background:rgba(30,41,59,.6);
            border:1px solid rgba(51,65,85,.5);
            border-radius:20px;
            padding:3px 10px 3px 4px;
            font-size:0.75rem;
            color:#94a3b8;
            line-height:1;
            cursor:pointer;
            user-select:none;
            transition:border-color .2s, background .2s;
        }
        .user-chip:hover { border-color:rgba(99,102,241,.4); background:rgba(30,41,59,.9); }
        .user-avatar {
            width:22px; height:22px;
            background:linear-gradient(135deg,rgba(79,70,229,.5),rgba(99,102,241,.3));
            border:1px solid rgba(99,102,241,.4);
            border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-size:0.6875rem;
            font-weight:700;
            color:#a5b4fc;
            text-transform:uppercase;
            flex-shrink:0;
        }
        .user-menu {
            position:absolute; top:calc(100% + 8px); right:0;
            background:rgba(15,23,42,.97);
            border:1px solid rgba(51,65,85,.6);
            border-radius:10px;
            padding:4px;
            min-width:130px;
            box-shadow:0 8px 24px rgba(0,0,0,.4);
            backdrop-filter:blur(12px);
            display:none;
            z-index:1000;
        }
        .user-menu.open { display:block; }
        .user-menu-item {
            display:flex; align-items:center; gap:8px;
            padding:8px 12px;
            border-radius:7px;
            font-size:0.8125rem;
            color:#94a3b8;
            cursor:pointer;
            transition:background .15s, color .15s;
            border:none; background:none; width:100%; text-align:left;
        }
        .user-menu-item:hover { background:rgba(239,68,68,.1); color:#f87171; }
    </style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen overscroll-none">
<div id="dash-content">
<div class="max-w-md mx-auto px-4 pt-7 pb-12 fade-in">
    <header class="flex items-center justify-between mb-8">
        <h1 id="title" class="text-xl font-bold tracking-tight">Cuchi Casa</h1>
        <div class="flex items-center gap-2">
            <!-- User dropdown -->
            <div class="user-dropdown" id="user-dropdown" style="display:none">
                <div class="user-chip" id="user-chip" onclick="toggleUserMenu()">
                    <div class="user-avatar" id="user-avatar">?</div>
                    <span id="user-name">—</span>
                </div>
                <div class="user-menu" id="user-menu">
                    <form method="post" action="/auth/logout">
                        <button type="submit" class="user-menu-item">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                            Logout
                        </button>
                    </form>
                </div>
            </div>
            <!-- Language selector -->
            <div class="lang-dropdown">
                <div class="lang-current" onclick="toggleLang()" id="lang-btn">
                    <img id="current-flag" src="/static/flags/es.svg" alt="Language" class="flag-img">
                </div>
                <div class="lang-menu" id="lang-menu">
                    <div class="lang-option" onclick="setLang('en')" data-lang="en" title="English">
                        <img src="/static/flags/gb.svg" alt="English" class="flag-img">
                    </div>
                    <div class="lang-option" onclick="setLang('es')" data-lang="es" title="Español">
                        <img src="/static/flags/es.svg" alt="Español" class="flag-img">
                    </div>
                </div>
            </div>
        </div>
    </header>
    <section>
        <p id="apps-label" class="text-[10px] text-slate-500 uppercase tracking-widest mb-3 px-1"></p>
        <div id="apps-list" class="space-y-2"></div>
    </section>
</div>
</div>
<div id="loading-overlay"><div class="spinner"></div></div>
<script>
// ── Translations ──────────────────────────────────────────────────────────────
const T = {
    es: {
        title:        'Cuchi Casa',
        applications: 'Aplicaciones',
        connected:    'Conectado',
        offline:      'Sin conexión',
        ac_name:      'Control AC',
        ac_desc:      'Control de temperatura, sensores Zigbee, MELCloud',
        zigbee_name:  'Zigbee2MQTT',
        zigbee_desc:  'Dispositivos Zigbee, sensores, coordinador',
        photos_name:  'Fotos',
        photos_desc:  'Copia de seguridad de fotos y vídeos',
        vacaciones_name: 'Cuchi Vacaciones',
        vacaciones_desc: 'Planificador de cuchi vacaciones',
        casita_name: 'Casita Sueños',
        casita_desc: 'Monitor de precios inmobiliarios',
        logout_label: 'Salir',
    },
    en: {
        title:        'Cuchi Casa',
        applications: 'Applications',
        connected:    'Connected',
        offline:      'Offline',
        ac_name:      'AC Control',
        ac_desc:      'Temperature control, Zigbee sensors, MELCloud',
        zigbee_name:  'Zigbee2MQTT',
        zigbee_desc:  'Zigbee devices, sensors, coordinator',
        photos_name:  'Photos',
        photos_desc:  'Photo and video backup',
        vacaciones_name: 'Cuchi Vacaciones',
        vacaciones_desc: 'Holiday planner',
        casita_name: 'Casita Sueños',
        casita_desc: 'Real estate price monitor',
        logout_label: 'Sign out',
    },
};
// ── App Registry ──────────────────────────────────────────────────────────────
const APPS = [
    { key: 'ac',         url: '/smart-home/ac',                                    nameKey: 'ac_name',         descKey: 'ac_desc',         statusUrl: '/api/status',           getStatus: d => d?.mqtt_connected     },
    { key: 'casita',     url: '/smart-home/casita?' + Date.now(),                  nameKey: 'casita_name',     descKey: 'casita_desc',     statusUrl: '/api/health/casita',    getStatus: d => d?.online === true    },
    { key: 'vacaciones', url: '/smart-home/vacaciones',                             nameKey: 'vacaciones_name', descKey: 'vacaciones_desc', statusUrl: '/api/health/vacaciones', getStatus: d => d?.online === true   },
    { key: 'photos',     url: 'https://raspberrypi.tailaa37cd.ts.net:10000/',       nameKey: 'photos_name',     descKey: 'photos_desc',     statusUrl: '/api/health/immich',    getStatus: d => d?.online === true    },
    { key: 'zigbee',     url: '/zigbee/',                                           nameKey: 'zigbee_name',     descKey: 'zigbee_desc',     statusUrl: '/api/health/zigbee',    getStatus: d => d?.online === true    },
];
// ── Language ──────────────────────────────────────────────────────────────────
const COOKIE = 'locale';
function getLang() {
    const m = document.cookie.match(/(?:^|;\s*)locale=([^;]+)/);
    return (m && T[m[1]]) ? m[1] : 'es';
}
function saveLang(l) {
    const exp = new Date(); exp.setFullYear(exp.getFullYear() + 1);
    document.cookie = `${COOKIE}=${l};expires=${exp.toUTCString()};path=/;SameSite=Lax`;
}
let currentLang = getLang();
function t(key) { return T[currentLang][key] || T.en[key] || key; }
function applyLang() {
    const flags = { en: '/static/flags/gb.svg', es: '/static/flags/es.svg' };
    document.getElementById('current-flag').src = flags[currentLang];
    document.querySelectorAll('.lang-option').forEach(o => {
        o.classList.toggle('active', o.dataset.lang === currentLang);
    });
    document.getElementById('title').textContent        = t('title');
    document.getElementById('apps-label').textContent   = t('applications');
    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) logoutBtn.title = t('logout_label');
    saveLang(currentLang);
    if (window.i18n && i18n.switchLocale && i18n.currentLocale !== currentLang) {
        i18n.switchLocale(currentLang).catch(() => {});
    }
}
function setLang(l) {
    document.getElementById('lang-menu').classList.remove('open');
    currentLang = l;
    applyLang();
    render();
    loadStatus();
}
function toggleLang() { document.getElementById('lang-menu').classList.toggle('open'); }
document.addEventListener('click', e => {
    const dd = document.querySelector('.lang-dropdown');
    if (dd && !dd.contains(e.target)) document.getElementById('lang-menu').classList.remove('open');
});
// ── Render ────────────────────────────────────────────────────────────────────
function render() {
    const list = document.getElementById('apps-list');
    list.innerHTML = APPS.map(app => `
        <a href="${app.url}" class="app-card rounded-2xl px-4 py-3.5">
            <div class="flex items-center justify-between">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-0.5">
                        <span class="text-sm font-semibold">${t(app.nameKey)}</span>
                        <span id="status-${app.key}" class="flex items-center gap-1 text-[10px] text-slate-500">
                            <span class="w-1.5 h-1.5 rounded-full bg-slate-600 inline-block"></span>
                            <span>—</span>
                        </span>
                    </div>
                    <p class="text-[11px] text-slate-400 truncate">${t(app.descKey)}</p>
                </div>
                <span class="text-slate-600 ml-3">&rsaquo;</span>
            </div>
        </a>
    `).join('');
}
// ── Status ────────────────────────────────────────────────────────────────────
async function loadStatus() {
    for (const app of APPS) {
        if (!app.statusUrl || !app.getStatus) continue;
        try {
            const data = await fetch(app.statusUrl).then(r => r.json());
            const online = app.getStatus(data);
            const el = document.getElementById('status-' + app.key);
            if (!el) continue;
            el.querySelector('span:first-child').className =
                `status-dot w-1.5 h-1.5 rounded-full inline-block ${online ? 'bg-green-500' : 'bg-red-400'}`;
            el.querySelector('span:last-child').textContent = t(online ? 'connected' : 'offline');
        } catch { /* offline */ }
    }
}
// ── User info ─────────────────────────────────────────────────────────────────
function toggleUserMenu() {
    document.getElementById('user-menu').classList.toggle('open');
}
document.addEventListener('click', e => {
    const dd = document.getElementById('user-dropdown');
    if (dd && !dd.contains(e.target)) {
        document.getElementById('user-menu').classList.remove('open');
    }
});
async function loadUser() {
    try {
        const res = await fetch('/auth/me');
        if (!res.ok) return;
        const data = await res.json();
        const username = data.username || '';
        if (!username) return;
        document.getElementById('user-name').textContent  = username;
        document.getElementById('user-avatar').textContent = username.charAt(0).toUpperCase();
        document.getElementById('user-dropdown').style.display = 'block';
    } catch { /* ignore */ }
}
// ── Init ──────────────────────────────────────────────────────────────────────
(async function init() {
    applyLang();
    render();
    try {
        await Promise.race([
            Promise.all([loadStatus(), loadUser()]),
            new Promise(r => setTimeout(r, 5000))
        ]);
    } catch {}
    // Reveal
    const overlay = document.getElementById('loading-overlay');
    const content = document.getElementById('dash-content');
    content.classList.add('visible');
    overlay.classList.add('done');
    setTimeout(() => { overlay.style.display = 'none'; }, 400);
    setInterval(loadStatus, 10000);
})();
</script>
</body>
</html>
