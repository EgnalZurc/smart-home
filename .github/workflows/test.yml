# ═══════════════════════════════════════════════════════════════════════════════
# Smart Home - Automated Tests
# Runs tests only for services that changed
# ═══════════════════════════════════════════════════════════════════════════════

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Detect which services changed
  # ─────────────────────────────────────────────────────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      dashboard: ${{ steps.filter.outputs.dashboard }}
      ac-service: ${{ steps.filter.outputs.ac-service }}
      baby-gifts: ${{ steps.filter.outputs.baby-gifts }}
      vacaciones: ${{ steps.filter.outputs.vacaciones }}
      casita: ${{ steps.filter.outputs.casita }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dashboard:
              - 'dashboard/**'
            ac-service:
              - 'services/ac-service/**'
            baby-gifts:
              - 'services/baby-gifts-service/**'
            vacaciones:
              - 'services/vacaciones-service/**'
            casita:
              - 'services/casita-suenos/**'

  # ─────────────────────────────────────────────────────────────────────────────
  # Test Dashboard
  # ─────────────────────────────────────────────────────────────────────────────
  test-dashboard:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.dashboard == 'true' }}
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'dashboard/requirements.txt'
      
      - name: Install dependencies
        run: |
          pip install -r dashboard/requirements.txt
          pip install pytest pytest-asyncio
      
      - name: Run tests
        run: |
          cd dashboard
          python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: src

  # ─────────────────────────────────────────────────────────────────────────────
  # Test AC Service
  # ─────────────────────────────────────────────────────────────────────────────
  test-ac-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.ac-service == 'true' }}
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'services/ac-service/requirements.txt'
      
      - name: Install dependencies
        run: |
          pip install -r services/ac-service/requirements.txt
          pip install pytest pytest-asyncio
      
      - name: Run tests
        run: |
          cd services/ac-service
          python -m pytest tests/ -v --tb=short || echo "No tests found or tests skipped"
        env:
          PYTHONPATH: src

  # ─────────────────────────────────────────────────────────────────────────────
  # Test Casita Sueños
  # ─────────────────────────────────────────────────────────────────────────────
  test-casita:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.casita == 'true' }}
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'services/casita-suenos/fase3-app/requirements.txt'
      
      - name: Install dependencies
        run: |
          pip install -r services/casita-suenos/fase3-app/requirements.txt
          pip install pytest pytest-asyncio
      
      - name: Run tests
        run: |
          cd services/casita-suenos/fase3-app
          python -m pytest tests/ -v --tb=short || echo "No tests found or tests skipped"
        env:
          PYTHONPATH: src

  # ─────────────────────────────────────────────────────────────────────────────
  # Summary - Always runs to report status
  # ─────────────────────────────────────────────────────────────────────────────
  summary:
    needs: [detect-changes, test-dashboard, test-ac-service, test-casita]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Check results
        run: |
          echo "=== Test Summary ==="
          echo "Dashboard changed: ${{ needs.detect-changes.outputs.dashboard }}"
          echo "AC Service changed: ${{ needs.detect-changes.outputs.ac-service }}"
          echo "Baby Gifts changed: ${{ needs.detect-changes.outputs.baby-gifts }}"
          echo "Vacaciones changed: ${{ needs.detect-changes.outputs.vacaciones }}"
          echo "Casita changed: ${{ needs.detect-changes.outputs.casita }}"
          echo ""
          echo "Dashboard tests: ${{ needs.test-dashboard.result }}"
          echo "AC Service tests: ${{ needs.test-ac-service.result }}"
          echo "Casita tests: ${{ needs.test-casita.result }}"
          
      - name: Fail if any test failed
        if: |
          needs.test-dashboard.result == 'failure' ||
          needs.test-ac-service.result == 'failure' ||
          needs.test-casita.result == 'failure'
        run: exit 1
