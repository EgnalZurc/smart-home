# ═══════════════════════════════════════════════════════════════════════════════
# Smart Home - Test and Deploy Pipeline
# 
# Flow:
#   1. Tests run automatically on push/PR to main (only changed services)
#   2. If tests pass → deploy job becomes available (requires manual approval)
#   3. Approve via GitHub UI or CLI: gh run review --approve
#
# Manual trigger:
#   gh workflow run ci.yml --repo EgnalZurc/smart-home                           # normal (detect changes)
#   gh workflow run ci.yml -f force_all_tests=true --repo EgnalZurc/smart-home   # run ALL tests
#   gh workflow run ci.yml -f service=dashboard --repo EgnalZurc/smart-home      # test ONE service
#
# To deploy from CLI after tests pass:
#   gh run view <run-id> --repo EgnalZurc/smart-home
#   gh run review <run-id> --approve --repo EgnalZurc/smart-home
# ═══════════════════════════════════════════════════════════════════════════════

name: Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to test (or "all" to test everything)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - all
          - dashboard
          - ac-service
          - baby-gifts
          - vacaciones
          - casita
      force_deploy:
        description: 'Enable deploy even without detected changes'
        required: false
        default: false
        type: boolean

env:
  DOCKERHUB_USERNAME: egnal

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Detect which services changed (or force all if manual trigger)
  # ─────────────────────────────────────────────────────────────────────────────
  detect-changes:
    runs-on: ubuntu-24.04
    outputs:
      dashboard: ${{ steps.result.outputs.dashboard }}
      ac-service: ${{ steps.result.outputs.ac-service }}
      baby-gifts: ${{ steps.result.outputs.baby-gifts }}
      vacaciones: ${{ steps.result.outputs.vacaciones }}
      casita: ${{ steps.result.outputs.casita }}
      any-service: ${{ steps.result.outputs.any-service }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v3
        id: filter
        if: ${{ github.event.inputs.service == 'auto' || github.event.inputs.service == '' }}
        with:
          filters: |
            dashboard:
              - 'dashboard/**'
            ac-service:
              - 'services/ac-service/**'
            baby-gifts:
              - 'services/baby-gifts-service/**'
            vacaciones:
              - 'services/vacaciones-service/**'
            casita:
              - 'services/casita-suenos/**'
            infrastructure:
              - 'infrastructure/**'
              - 'docker-compose*.yml'

      - name: Determine what to test
        id: result
        run: |
          SERVICE="${{ github.event.inputs.service }}"
          FORCE_DEPLOY="${{ github.event.inputs.force_deploy }}"
          
          # Initialize all to false
          DASHBOARD=false
          AC_SERVICE=false
          BABY_GIFTS=false
          VACACIONES=false
          CASITA=false
          
          if [[ "$SERVICE" == "all" ]]; then
            echo "🔄 Testing ALL services"
            DASHBOARD=true
            AC_SERVICE=true
            BABY_GIFTS=true
            VACACIONES=true
            CASITA=true
          elif [[ "$SERVICE" == "dashboard" ]]; then
            echo "🎯 Testing only: dashboard"
            DASHBOARD=true
          elif [[ "$SERVICE" == "ac-service" ]]; then
            echo "🎯 Testing only: ac-service"
            AC_SERVICE=true
          elif [[ "$SERVICE" == "baby-gifts" ]]; then
            echo "🎯 Testing only: baby-gifts"
            BABY_GIFTS=true
          elif [[ "$SERVICE" == "vacaciones" ]]; then
            echo "🎯 Testing only: vacaciones"
            VACACIONES=true
          elif [[ "$SERVICE" == "casita" ]]; then
            echo "🎯 Testing only: casita"
            CASITA=true
          else
            # Auto mode: use paths-filter results
            echo "🔍 Auto-detecting changed services"
            DASHBOARD=${{ steps.filter.outputs.dashboard }}
            AC_SERVICE=${{ steps.filter.outputs.ac-service }}
            BABY_GIFTS=${{ steps.filter.outputs.baby-gifts }}
            VACACIONES=${{ steps.filter.outputs.vacaciones }}
            CASITA=${{ steps.filter.outputs.casita }}
          fi
          
          echo "dashboard=$DASHBOARD" >> $GITHUB_OUTPUT
          echo "ac-service=$AC_SERVICE" >> $GITHUB_OUTPUT
          echo "baby-gifts=$BABY_GIFTS" >> $GITHUB_OUTPUT
          echo "vacaciones=$VACACIONES" >> $GITHUB_OUTPUT
          echo "casita=$CASITA" >> $GITHUB_OUTPUT
          
          if [[ "$DASHBOARD" == "true" ]] || \
             [[ "$AC_SERVICE" == "true" ]] || \
             [[ "$BABY_GIFTS" == "true" ]] || \
             [[ "$VACACIONES" == "true" ]] || \
             [[ "$CASITA" == "true" ]] || \
             [[ "${{ steps.filter.outputs.infrastructure }}" == "true" ]] || \
             [[ "$FORCE_DEPLOY" == "true" ]]; then
            echo "any-service=true" >> $GITHUB_OUTPUT
          else
            echo "any-service=false" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Test Dashboard
  # ─────────────────────────────────────────────────────────────────────────────
  test-dashboard:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.dashboard == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'dashboard/requirements.txt'
      - name: Install dependencies
        run: |
          pip install -r dashboard/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        run: |
          cd dashboard
          python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: src

  # ─────────────────────────────────────────────────────────────────────────────
  # Test AC Service
  # ─────────────────────────────────────────────────────────────────────────────
  test-ac-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.ac-service == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'services/ac-service/requirements.txt'
      - name: Install dependencies
        run: |
          pip install -r services/ac-service/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        run: |
          cd services/ac-service
          python -m pytest tests/ -v --tb=short || echo "No tests found or tests skipped"
        env:
          PYTHONPATH: src

  # ─────────────────────────────────────────────────────────────────────────────
  # Test Baby Gifts Service
  # ─────────────────────────────────────────────────────────────────────────────
  test-baby-gifts:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.baby-gifts == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'services/baby-gifts-service/requirements.txt'
      - name: Install dependencies
        run: |
          pip install -r services/baby-gifts-service/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        run: |
          cd services/baby-gifts-service
          python -m pytest tests/ -v --tb=short || echo "No tests found or tests skipped"
        env:
          PYTHONPATH: src

  # ─────────────────────────────────────────────────────────────────────────────
  # Test Vacaciones Service
  # ─────────────────────────────────────────────────────────────────────────────
  test-vacaciones:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.vacaciones == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'services/vacaciones-service/requirements.txt'
      - name: Install dependencies
        run: |
          pip install -r services/vacaciones-service/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        run: |
          cd services/vacaciones-service
          python -m pytest tests/ -v --tb=short || echo "No tests found or tests skipped"
        env:
          PYTHONPATH: src

  # ─────────────────────────────────────────────────────────────────────────────
  # Test Casita Sueños
  # ─────────────────────────────────────────────────────────────────────────────
  test-casita:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.casita == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'services/casita-suenos/fase3-app/requirements.txt'
      - name: Install dependencies
        run: |
          pip install -r services/casita-suenos/fase3-app/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        run: |
          cd services/casita-suenos/fase3-app
          python -m pytest tests/ -v --tb=short || echo "No tests found or tests skipped"
        env:
          PYTHONPATH: src

  # ─────────────────────────────────────────────────────────────────────────────
  # Test Summary - gate for deploy
  # ─────────────────────────────────────────────────────────────────────────────
  test-summary:
    needs: [detect-changes, test-dashboard, test-ac-service, test-baby-gifts, test-vacaciones, test-casita]
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      tests-passed: ${{ steps.result.outputs.passed }}
    steps:
      - name: Check test results
        id: result
        run: |
          echo "=== Test Summary ==="
          echo "Dashboard: ${{ needs.test-dashboard.result }}"
          echo "AC Service: ${{ needs.test-ac-service.result }}"
          echo "Baby Gifts: ${{ needs.test-baby-gifts.result }}"
          echo "Vacaciones: ${{ needs.test-vacaciones.result }}"
          echo "Casita: ${{ needs.test-casita.result }}"
          
          # A test is considered passed if it succeeded OR was skipped (no changes)
          DASHBOARD="${{ needs.test-dashboard.result }}"
          AC="${{ needs.test-ac-service.result }}"
          BABYGIFTS="${{ needs.test-baby-gifts.result }}"
          VACACIONES="${{ needs.test-vacaciones.result }}"
          CASITA="${{ needs.test-casita.result }}"
          
          FAILED=false
          for result in "$DASHBOARD" "$AC" "$BABYGIFTS" "$VACACIONES" "$CASITA"; do
            if [[ "$result" == "failure" ]]; then
              FAILED=true
              break
            fi
          done
          
          if [[ "$FAILED" == "true" ]]; then
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "❌ Some tests failed"
            exit 1
          else
            echo "passed=true" >> $GITHUB_OUTPUT
            echo "✅ All tests passed (or skipped)"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy - requires manual approval via environment protection
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    needs: [detect-changes, test-summary]
    if: |
      always() &&
      needs.test-summary.result == 'success' &&
      needs.detect-changes.outputs.any-service == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production  # ← Requires manual approval in GitHub settings
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: egnal
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build changed services in parallel
      - name: Build and push Dashboard
        if: ${{ needs.detect-changes.outputs.dashboard == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          push: true
          tags: |
            egnal/smart-home-dashboard:latest
            egnal/smart-home-dashboard:${{ github.sha }}
          platforms: linux/arm64

      - name: Build and push AC Service
        if: ${{ needs.detect-changes.outputs.ac-service == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/ac-service
          push: true
          tags: |
            egnal/smart-home-ac-service:latest
            egnal/smart-home-ac-service:${{ github.sha }}
          platforms: linux/arm64

      - name: Build and push Baby Gifts
        if: ${{ needs.detect-changes.outputs.baby-gifts == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/baby-gifts-service
          push: true
          tags: |
            egnal/smart-home-baby-gifts:latest
            egnal/smart-home-baby-gifts:${{ github.sha }}
          platforms: linux/arm64

      - name: Build and push Vacaciones
        if: ${{ needs.detect-changes.outputs.vacaciones == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/vacaciones-service
          push: true
          tags: |
            egnal/smart-home-vacaciones:latest
            egnal/smart-home-vacaciones:${{ github.sha }}
          platforms: linux/arm64

      - name: Build and push Casita Sueños
        if: ${{ needs.detect-changes.outputs.casita == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/casita-suenos/fase3-app
          push: true
          tags: |
            egnal/smart-home-casita-suenos:latest
            egnal/smart-home-casita-suenos:${{ github.sha }}
          platforms: linux/arm64

      # Deploy to Pi
      - name: Deploy to Raspberry Pi
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.PI_SSH_HOST }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          timeout: 120s
          script: |
            cd ~/smart-home-prod
            
            # Build list of services to update
            SERVICES=""
            [ "${{ needs.detect-changes.outputs.dashboard }}" == "true" ] && SERVICES="$SERVICES dashboard"
            [ "${{ needs.detect-changes.outputs.ac-service }}" == "true" ] && SERVICES="$SERVICES ac-service"
            [ "${{ needs.detect-changes.outputs.baby-gifts }}" == "true" ] && SERVICES="$SERVICES baby-gifts-service"
            [ "${{ needs.detect-changes.outputs.vacaciones }}" == "true" ] && SERVICES="$SERVICES vacaciones-service"
            [ "${{ needs.detect-changes.outputs.casita }}" == "true" ] && SERVICES="$SERVICES casita-suenos"
            
            if [ -n "$SERVICES" ]; then
              echo "=== Updating services:$SERVICES ==="
              docker compose pull $SERVICES
              docker compose up -d $SERVICES
            else
              echo "=== No services to update ==="
            fi
            
            echo "=== Deploy complete ==="
            docker ps --format "table {{.Names}}\t{{.Status}}" | head -15

      - name: Deploy Summary
        if: always()
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services deployed:" >> $GITHUB_STEP_SUMMARY
          echo "- Dashboard: ${{ needs.detect-changes.outputs.dashboard }}" >> $GITHUB_STEP_SUMMARY
          echo "- AC Service: ${{ needs.detect-changes.outputs.ac-service }}" >> $GITHUB_STEP_SUMMARY
          echo "- Baby Gifts: ${{ needs.detect-changes.outputs.baby-gifts }}" >> $GITHUB_STEP_SUMMARY
          echo "- Vacaciones: ${{ needs.detect-changes.outputs.vacaciones }}" >> $GITHUB_STEP_SUMMARY
          echo "- Casita: ${{ needs.detect-changes.outputs.casita }}" >> $GITHUB_STEP_SUMMARY
