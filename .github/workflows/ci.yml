        run: |
          if [[ -d "tools/pc-agent/tests" ]] && find tools/pc-agent/tests -name "test_*.py" | grep -q .; then
            pip install -r tools/pc-agent/requirements.txt --quiet 2>/dev/null || true
            cd tools/pc-agent && PYTHONPATH=src python -m pytest tests/ -v --tb=short
          else
            echo "⏭️ No tests found"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Lint & Test - async_http_client (shared library, no Dockerfile / no deploy)
  # ─────────────────────────────────────────────────────────────────────────────
  lint-and-test-async-http-client:
    needs: prepare
    if: ${{ needs.prepare.outputs.async-http-client == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tools
        run: pip install -r requirements-dev.txt

      - name: Ruff - Code Quality
        run: |
          ruff check libs/async_http_client --output-format=github
          ruff format libs/async_http_client --check --diff

      - name: Bandit - Security Check
        run: bandit -r libs/async_http_client -ll -ii --format txt

      - name: Run Tests
        run: |
          if [[ -d "libs/async_http_client/tests" ]] && find libs/async_http_client/tests -name "test_*.py" | grep -q .; then
            PYTHONPATH=. python -m pytest libs/async_http_client/tests -v --tb=short
          else
            echo "⏭️ No tests found"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Quality Gate: verify all lint-and-test-* jobs passed
  # ─────────────────────────────────────────────────────────────────────────────
  quality-gate:
    needs:
      - prepare
      - lint-and-test-dashboard
      - lint-and-test-ac-service
      - lint-and-test-baby-gifts
      - lint-and-test-portfolio-monitor
      - lint-and-test-vacaciones
      - lint-and-test-casita
      - lint-and-test-vaultwarden
      - lint-and-test-valheim-admin
      - lint-and-test-pc-agent
      - lint-and-test-async-http-client
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check Quality Results
        run: |
          echo "## 🚦 Quality Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          
          FAILED=false
          
          check_job() {
            local name=$1
            local result=$2
            local changed=$3
            
            if [[ "$changed" != "true" ]]; then
              echo "| $name | ⏭️ Skipped (no changes) |" >> $GITHUB_STEP_SUMMARY
            elif [[ "$result" == "success" ]]; then
              echo "| $name | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            elif [[ "$result" == "skipped" ]]; then
              echo "| $name | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $name | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
              FAILED=true
            fi
          }
          
          check_job "Dashboard" "${{ needs.lint-and-test-dashboard.result }}" "${{ needs.prepare.outputs.dashboard }}"
          check_job "AC Service" "${{ needs.lint-and-test-ac-service.result }}" "${{ needs.prepare.outputs.ac-service }}"
          check_job "Baby Gifts" "${{ needs.lint-and-test-baby-gifts.result }}" "${{ needs.prepare.outputs.baby-gifts }}"
          check_job "Portfolio Monitor" "${{ needs.lint-and-test-portfolio-monitor.result }}" "${{ needs.prepare.outputs.portfolio-monitor }}"
          check_job "Vacaciones" "${{ needs.lint-and-test-vacaciones.result }}" "${{ needs.prepare.outputs.vacaciones }}"
          check_job "Casita" "${{ needs.lint-and-test-casita.result }}" "${{ needs.prepare.outputs.casita }}"
          check_job "Vaultwarden" "${{ needs.lint-and-test-vaultwarden.result }}" "${{ needs.prepare.outputs.vaultwarden }}"
          check_job "Valheim Admin" "${{ needs.lint-and-test-valheim-admin.result }}" "${{ needs.prepare.outputs.valheim-admin }}"
          check_job "PC Agent" "${{ needs.lint-and-test-pc-agent.result }}" "${{ needs.prepare.outputs.pc-agent }}"
          check_job "Async HTTP Client" "${{ needs.lint-and-test-async-http-client.result }}" "${{ needs.prepare.outputs.async-http-client }}"
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "$FAILED" == "true" ]]; then
            echo "❌ **Quality gate failed** - fix issues before deploy" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **Quality gate passed** - ready for deploy" >> $GITHUB_STEP_SUMMARY
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy - matrix strategy with single approval
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    needs: [prepare, quality-gate]
    if: |
      always() &&
      needs.quality-gate.result == 'success' &&
      needs.prepare.outputs.any-service == 'true' &&
      needs.prepare.outputs.services-matrix != '[]' &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    strategy:
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services-matrix) }}
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: egnal
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ matrix.service.image }}:latest
            ${{ matrix.service.image }}:${{ github.sha }}
          platforms: linux/arm64

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy ${{ matrix.service.name }} to Pi
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PI_SSH_HOST }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          timeout: 120s
          script: |
            cd ~/smart-home-prod
            echo "=== Deploying ${{ matrix.service.name }} ==="
            docker compose pull ${{ matrix.service.name }}
            docker compose up -d --force-recreate ${{ matrix.service.name }}
            echo "✅ Service deployed with new image"
            docker ps --filter "name=${{ matrix.service.name }}" --format "table {{.Names}}\t{{.Status}}"

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy nginx config
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-nginx:
    needs: [prepare, quality-gate]
    if: |
      always() &&
      needs.quality-gate.result == 'success' &&
      needs.prepare.outputs.nginx == 'true' &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Sync nginx config to Pi
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.PI_SSH_HOST }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          source: "infrastructure/nginx/conf.d/*,infrastructure/nginx/nginx.conf"
          target: "~/smart-home-prod/"
          strip_components: 0

      - name: Reload nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PI_SSH_HOST }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          timeout: 30s
          script: |
            docker exec nginx-reverse-proxy nginx -t
            docker exec nginx-reverse-proxy nginx -s reload
            echo "✅ nginx config deployed and reloaded"

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy docker-compose.prod.yml
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-compose:
    needs: [prepare, quality-gate]
    if: |
      always() &&
      needs.quality-gate.result == 'success' &&
      needs.prepare.outputs.compose == 'true' &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Sync docker-compose.prod.yml to Pi
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.PI_SSH_HOST }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/smart-home-prod/"
          strip_components: 0

      - name: Apply compose changes on Pi
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PI_SSH_HOST }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          timeout: 60s
          script: |
            cd ~/smart-home-prod
            mv docker-compose.prod.yml docker-compose.yml
            docker compose config --quiet && echo "✅ Compose file valid"
            
            # Apply changes - Docker Compose will only recreate services whose config changed
            echo "🔄 Applying compose changes (only affected services will restart)..."
            docker compose up -d
            echo "✅ Compose changes applied"

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy pc-agent to Windows PC (self-hosted runner)
  # NOTE: This job is non-blocking. If the PC runner is offline, it will warn
  # but not fail the pipeline. The deploy will happen next time the runner comes online.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-pc-agent:
    needs: [prepare, quality-gate]
    if: |
      always() &&
      needs.quality-gate.result == 'success' &&
      needs.prepare.outputs.pc-agent == 'true' &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, gaming-pc]
    environment: gaming-pc
    continue-on-error: true
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - name: Runner Available
        run: |
          Write-Host "✅ Gaming PC runner is online"
          Write-Host "Deploying pc-agent..."

      - uses: actions/checkout@v5

      - name: Deploy pc-agent
        run: |
          $ErrorActionPreference = "Continue"
          $DEPLOY_DIR = "E:\pc-agent"
          $SOURCE_DIR = "tools\pc-agent"
          
          Write-Host "=== Deploying pc-agent to $DEPLOY_DIR ==="
          
          # Create deploy dir if not exists
          if (-not (Test-Path $DEPLOY_DIR)) {
            New-Item -ItemType Directory -Path $DEPLOY_DIR -Force | Out-Null
          }
          if (-not (Test-Path "$DEPLOY_DIR\src")) {
            New-Item -ItemType Directory -Path "$DEPLOY_DIR\src" -Force | Out-Null
          }
          
          # Try to stop service (may fail if runner lacks permissions - that's OK)
          if (Test-Path "$DEPLOY_DIR\nssm\nssm.exe") {
            Write-Host "Attempting to stop pc-agent service..."
            $null = & "$DEPLOY_DIR\nssm\nssm.exe" stop pc-agent 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "⚠️ Could not stop service (runner may lack permissions) - continuing anyway"
            }
            Start-Sleep -Seconds 2
          }
          
          # Copy source files (required)
          Write-Host "Copying source files..."
          Copy-Item "$SOURCE_DIR\src\*" "$DEPLOY_DIR\src\" -Force -Recurse
          Copy-Item "$SOURCE_DIR\requirements.txt" "$DEPLOY_DIR\" -Force
          
          # Copy optional files (ignore if missing)
          Copy-Item "$SOURCE_DIR\run.bat" "$DEPLOY_DIR\" -Force -ErrorAction SilentlyContinue
          Copy-Item "$SOURCE_DIR\install-service.ps1" "$DEPLOY_DIR\" -Force -ErrorAction SilentlyContinue
          Copy-Item "$SOURCE_DIR\README.md" "$DEPLOY_DIR\" -Force -ErrorAction SilentlyContinue
          
          # Update dependencies using existing venv
          if (Test-Path "$DEPLOY_DIR\venv\Scripts\pip.exe") {
            Write-Host "Installing dependencies..."
            & "$DEPLOY_DIR\venv\Scripts\pip.exe" install -r "$DEPLOY_DIR\requirements.txt" --quiet 2>&1 | Out-Null
          } else {
            Write-Host "⚠️ venv not found - run install-service.ps1 to set up"
          }
          
          # Try to start service (may fail if runner lacks permissions)
          if (Test-Path "$DEPLOY_DIR\nssm\nssm.exe") {
            Write-Host "Attempting to restart pc-agent service..."
            $null = & "$DEPLOY_DIR\nssm\nssm.exe" restart pc-agent 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "⚠️ Could not restart service (runner may lack permissions)"
              Write-Host "   Restart manually: E:\pc-agent\nssm\nssm.exe restart pc-agent"
            }
            Start-Sleep -Seconds 3
          } else {
            Write-Host "⚠️ NSSM not found - service not started. Run install-service.ps1 first."
          }
          
          Write-Host "✅ pc-agent deployed to $DEPLOY_DIR"
          exit 0

      - name: Health Check
        run: |
          Start-Sleep -Seconds 5
          try {
            $response = Invoke-RestMethod -Uri "http://localhost:8090/health" -TimeoutSec 10
            if ($response.online -eq $true) {
              Write-Host "✅ pc-agent is healthy"
            } else {
              Write-Host "⚠️ pc-agent responded but not online"
            }
          } catch {
            Write-Host "⚠️ Could not reach pc-agent: $_"
            Write-Host "Service may need manual start: nssm start pc-agent"
          }

  # ─────────────────────────────────────────────────────────────────────────────
  # Check if PC deploy was skipped (runner offline)
  # ─────────────────────────────────────────────────────────────────────────────
  check-pc-deploy:
    needs: [prepare, deploy-pc-agent]
    if: |
      always() &&
      needs.prepare.outputs.pc-agent == 'true' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Report PC Deploy Status
        run: |
          if [[ "${{ needs.deploy-pc-agent.result }}" == "success" ]]; then
            echo "✅ pc-agent deployed successfully" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.deploy-pc-agent.result }}" == "skipped" ]]; then
            echo "⚠️ **pc-agent deploy skipped** - Gaming PC runner is offline" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The code is ready. Deploy will happen automatically when:" >> $GITHUB_STEP_SUMMARY
            echo "- The PC is turned on" >> $GITHUB_STEP_SUMMARY
            echo "- The GitHub Actions runner service is running" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Or trigger manually: \`gh workflow run ci.yml -f service=pc-agent\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **pc-agent deploy failed** - check runner logs" >> $GITHUB_STEP_SUMMARY
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Verify - check deployed services are healthy
  # ─────────────────────────────────────────────────────────────────────────────
  verify:
    needs: [prepare, deploy, deploy-nginx, deploy-compose, check-pc-deploy]
    if: always() && (needs.deploy.result == 'success' || needs.deploy-nginx.result == 'success' || needs.deploy-compose.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Health Check
        run: |
          set -euo pipefail
          
          echo "## 🏥 Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Use Tailscale hostname for HTTPS access
          BASE_URL="https://${{ secrets.PI_TAILSCALE_HOSTNAME }}"
          FAILED=0
          
          check_health() {
            local name=$1
            local endpoint=$2
            
            # Use --fail-with-body to get proper exit codes, capture both code and body
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --connect-timeout 10 "$BASE_URL$endpoint" 2>/dev/null) || HTTP_CODE="000"
            
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "| $name | ✅ HTTP $HTTP_CODE |" >> $GITHUB_STEP_SUMMARY
            elif [[ "$HTTP_CODE" == "000" ]]; then
              echo "| $name | ❌ Connection failed |" >> $GITHUB_STEP_SUMMARY
              FAILED=1
            else
              echo "| $name | ⚠️ HTTP $HTTP_CODE |" >> $GITHUB_STEP_SUMMARY
              FAILED=1
            fi
          }
          
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Wait a bit for services to fully start after deploy
          sleep 5
          
          check_health "Dashboard" "/api/health"
          check_health "AC Service" "/api/health/ac"
          check_health "Portfolio" "/api/health/portfolio"
          check_health "Vacaciones" "/api/health/vacaciones"
          check_health "Baby Gifts" "/api/health/baby-gifts"
          check_health "Casita" "/api/health/casita"
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "$FAILED" -eq 1 ]]; then
            echo "❌ **Health check failed** - some services are not responding" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **All services healthy**" >> $GITHUB_STEP_SUMMARY
          fi
