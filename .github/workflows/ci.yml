# ═══════════════════════════════════════════════════════════════════════════════
# Smart Home - Build, Test and Deploy Pipeline
# 
# Flow:
#   1. Build: detect changes, lint, build Docker images
#   2. Test: run unit tests for changed services
#   3. Deploy: manual approval, then deploy changed services to Pi
#
# Manual trigger:
#   gh workflow run ci.yml --repo EgnalZurc/smart-home                        # auto-detect changes
#   gh workflow run ci.yml -f service=all --repo EgnalZurc/smart-home         # all services
#   gh workflow run ci.yml -f service=dashboard --repo EgnalZurc/smart-home   # single service
#
# Deploy approval:
#   gh run review <run-id> --approve --repo EgnalZurc/smart-home
# ═══════════════════════════════════════════════════════════════════════════════

name: Build, Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build/test'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - all
          - dashboard
          - ac-service
          - baby-gifts
          - portfolio-monitor
          - vacaciones
          - casita
          - vaultwarden
          - valheim-admin
      force_deploy:
        description: 'Enable deploy even without detected changes'
        required: false
        default: false
        type: boolean

env:
  DOCKERHUB_USERNAME: egnal

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build: detect changes, lint, build Docker images
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-24.04
    outputs:
      dashboard: ${{ steps.changes.outputs.dashboard }}
      ac-service: ${{ steps.changes.outputs.ac-service }}
      baby-gifts: ${{ steps.changes.outputs.baby-gifts }}
      portfolio-monitor: ${{ steps.changes.outputs.portfolio-monitor }}
      vacaciones: ${{ steps.changes.outputs.vacaciones }}
      casita: ${{ steps.changes.outputs.casita }}
      vaultwarden: ${{ steps.changes.outputs.vaultwarden }}
      valheim-admin: ${{ steps.changes.outputs.valheim-admin }}
      nginx: ${{ steps.changes.outputs.nginx }}
      compose: ${{ steps.changes.outputs.compose }}
      any-service: ${{ steps.changes.outputs.any-service }}
      services-matrix: ${{ steps.matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v7

      # ── Detect changes ──
      - uses: dorny/paths-filter@v4
        id: filter
        if: ${{ github.event.inputs.service == 'auto' || github.event.inputs.service == '' }}
        with:
          filters: |
            dashboard:
              - 'dashboard/**'
            ac-service:
              - 'services/ac-service/**'
            baby-gifts:
              - 'services/baby-gifts-service/**'
            portfolio-monitor:
              - 'services/portfolio-monitor/**'
            vacaciones:
              - 'services/vacaciones-service/**'
            casita:
              - 'services/casita-suenos/**'
            vaultwarden:
              - 'services/vaultwarden/**'
            valheim-admin:
              - 'services/valheim-admin/**'
            nginx:
              - 'infrastructure/nginx/**'
            compose:
              - 'docker-compose.prod.yml'
            infrastructure:
              - 'infrastructure/**'
              - 'docker-compose*.yml'

      - name: Determine services to build
        id: changes
        run: |
          SERVICE="${{ github.event.inputs.service }}"
          FORCE_DEPLOY="${{ github.event.inputs.force_deploy }}"
          
          DASHBOARD=false; AC_SERVICE=false; BABY_GIFTS=false; PORTFOLIO_MONITOR=false; VACACIONES=false; CASITA=false; VAULTWARDEN=false; VALHEIM_ADMIN=false; NGINX=false; COMPOSE=false
          
          case "$SERVICE" in
            all)
              echo "🔄 Building ALL services"
              DASHBOARD=true; AC_SERVICE=true; BABY_GIFTS=true; PORTFOLIO_MONITOR=true; VACACIONES=true; CASITA=true; VAULTWARDEN=true; VALHEIM_ADMIN=true; NGINX=true; COMPOSE=true
              ;;
            dashboard)         echo "🎯 Building: dashboard";         DASHBOARD=true ;;
            ac-service)        echo "🎯 Building: ac-service";        AC_SERVICE=true ;;
            baby-gifts)        echo "🎯 Building: baby-gifts";        BABY_GIFTS=true ;;
            portfolio-monitor) echo "🎯 Building: portfolio-monitor"; PORTFOLIO_MONITOR=true ;;
            vacaciones)        echo "🎯 Building: vacaciones";        VACACIONES=true ;;
            casita)            echo "🎯 Building: casita";            CASITA=true ;;
            vaultwarden)       echo "🎯 Building: vaultwarden";       VAULTWARDEN=true ;;
            valheim-admin)     echo "🎯 Building: valheim-admin";     VALHEIM_ADMIN=true ;;
            *)
              echo "🔍 Auto-detecting changed services"
              DASHBOARD=${{ steps.filter.outputs.dashboard }}
              AC_SERVICE=${{ steps.filter.outputs.ac-service }}
              BABY_GIFTS=${{ steps.filter.outputs.baby-gifts }}
              PORTFOLIO_MONITOR=${{ steps.filter.outputs.portfolio-monitor }}
              VACACIONES=${{ steps.filter.outputs.vacaciones }}
              CASITA=${{ steps.filter.outputs.casita }}
              VAULTWARDEN=${{ steps.filter.outputs.vaultwarden }}
              VALHEIM_ADMIN=${{ steps.filter.outputs.valheim-admin }}
              NGINX=${{ steps.filter.outputs.nginx }}
              COMPOSE=${{ steps.filter.outputs.compose }}
              ;;
          esac
          
          echo "dashboard=$DASHBOARD" >> $GITHUB_OUTPUT
          echo "ac-service=$AC_SERVICE" >> $GITHUB_OUTPUT
          echo "baby-gifts=$BABY_GIFTS" >> $GITHUB_OUTPUT
          echo "portfolio-monitor=$PORTFOLIO_MONITOR" >> $GITHUB_OUTPUT
          echo "vacaciones=$VACACIONES" >> $GITHUB_OUTPUT
          echo "casita=$CASITA" >> $GITHUB_OUTPUT
          echo "vaultwarden=$VAULTWARDEN" >> $GITHUB_OUTPUT
          echo "valheim-admin=$VALHEIM_ADMIN" >> $GITHUB_OUTPUT
          echo "nginx=$NGINX" >> $GITHUB_OUTPUT
          echo "compose=$COMPOSE" >> $GITHUB_OUTPUT
          
          if [[ "$DASHBOARD" == "true" ]] || [[ "$AC_SERVICE" == "true" ]] || \
             [[ "$BABY_GIFTS" == "true" ]] || [[ "$PORTFOLIO_MONITOR" == "true" ]] || \
             [[ "$VACACIONES" == "true" ]] || \
             [[ "$CASITA" == "true" ]] || [[ "$VAULTWARDEN" == "true" ]] || \
             [[ "$VALHEIM_ADMIN" == "true" ]] || [[ "$NGINX" == "true" ]] || \
             [[ "$COMPOSE" == "true" ]] || \
             [[ "${{ steps.filter.outputs.infrastructure }}" == "true" ]] || \
             [[ "$FORCE_DEPLOY" == "true" ]]; then
            echo "any-service=true" >> $GITHUB_OUTPUT
          else
            echo "any-service=false" >> $GITHUB_OUTPUT
          fi

      # ── Build matrix for deploy ──
      - name: Build deploy matrix
        id: matrix
        run: |
          SERVICES="["
          FIRST=true
          
          add_service() {
            if [[ "$FIRST" == "true" ]]; then FIRST=false; else SERVICES="$SERVICES,"; fi
            SERVICES="$SERVICES{\"name\":\"$1\",\"image\":\"$2\",\"context\":\"$3\"}"
          }
          
          [[ "${{ steps.changes.outputs.dashboard }}" == "true" ]] && \
            add_service "smart-home-backend" "egnal/smart-home-dashboard" "./dashboard"
          [[ "${{ steps.changes.outputs.ac-service }}" == "true" ]] && \
            add_service "ac-service" "egnal/smart-home-ac-service" "./services/ac-service"
          [[ "${{ steps.changes.outputs.baby-gifts }}" == "true" ]] && \
            add_service "baby-gifts-service" "egnal/smart-home-baby-gifts" "./services/baby-gifts-service"
          [[ "${{ steps.changes.outputs.portfolio-monitor }}" == "true" ]] && \
            add_service "portfolio-monitor" "egnal/smart-home-portfolio-monitor" "./services/portfolio-monitor"
          [[ "${{ steps.changes.outputs.vacaciones }}" == "true" ]] && \
            add_service "vacaciones-service" "egnal/smart-home-vacaciones" "./services/vacaciones-service"
          [[ "${{ steps.changes.outputs.casita }}" == "true" ]] && \
            add_service "casita-suenos" "egnal/smart-home-casita-suenos" "./services/casita-suenos/fase3-app"
          [[ "${{ steps.changes.outputs.vaultwarden }}" == "true" ]] && \
            add_service "vaultwarden" "egnal/smart-home-vaultwarden" "./services/vaultwarden"
          [[ "${{ steps.changes.outputs.valheim-admin }}" == "true" ]] && \
            add_service "valheim-admin" "egnal/smart-home-valheim-admin" "./services/valheim-admin"
          
          SERVICES="$SERVICES]"
          echo "services=$SERVICES" >> $GITHUB_OUTPUT
          echo "Deploy matrix: $SERVICES"

      # ── Setup Python for linting ──
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      # ── Lint changed services ──
      - name: Lint dashboard
        if: ${{ steps.changes.outputs.dashboard == 'true' }}
        run: |
          echo "::group::Lint dashboard"
          ruff check dashboard/src --output-format=github || true
          ruff format dashboard/src --check --diff || true
          echo "::endgroup::"

      - name: Lint ac-service
        if: ${{ steps.changes.outputs.ac-service == 'true' }}
        run: |
          echo "::group::Lint ac-service"
          ruff check services/ac-service/src --output-format=github || true
          ruff format services/ac-service/src --check --diff || true
          echo "::endgroup::"

      - name: Lint baby-gifts-service
        if: ${{ steps.changes.outputs.baby-gifts == 'true' }}
        run: |
          echo "::group::Lint baby-gifts-service"
          ruff check services/baby-gifts-service/src --output-format=github || true
          ruff format services/baby-gifts-service/src --check --diff || true
          echo "::endgroup::"

      - name: Lint portfolio-monitor
        if: ${{ steps.changes.outputs.portfolio-monitor == 'true' }}
        run: |
          echo "::group::Lint portfolio-monitor"
          ruff check services/portfolio-monitor/src --output-format=github || true
          ruff format services/portfolio-monitor/src --check --diff || true
          echo "::endgroup::"

      - name: Lint vacaciones-service
        if: ${{ steps.changes.outputs.vacaciones == 'true' }}
        run: |
          echo "::group::Lint vacaciones-service"
          ruff check services/vacaciones-service/src --output-format=github || true
          ruff format services/vacaciones-service/src --check --diff || true
          echo "::endgroup::"

      - name: Lint casita-suenos
        if: ${{ steps.changes.outputs.casita == 'true' }}
        run: |
          echo "::group::Lint casita-suenos"
          ruff check services/casita-suenos/fase3-app/src --output-format=github || true
          ruff format services/casita-suenos/fase3-app/src --check --diff || true
          echo "::endgroup::"

      # ── Build summary ──
      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard | ${{ steps.changes.outputs.dashboard }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AC Service | ${{ steps.changes.outputs.ac-service }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Baby Gifts | ${{ steps.changes.outputs.baby-gifts }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Portfolio Monitor | ${{ steps.changes.outputs.portfolio-monitor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Vacaciones | ${{ steps.changes.outputs.vacaciones }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Casita | ${{ steps.changes.outputs.casita }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Vaultwarden | ${{ steps.changes.outputs.vaultwarden }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Valheim Admin | ${{ steps.changes.outputs.valheim-admin }} |" >> $GITHUB_STEP_SUMMARY
          echo "| nginx | ${{ steps.changes.outputs.nginx }} |" >> $GITHUB_STEP_SUMMARY
          echo "| compose | ${{ steps.changes.outputs.compose }} |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  # Test Dashboard
  # ─────────────────────────────────────────────────────────────────────────────
  test-dashboard:
    needs: build
    if: ${{ needs.build.outputs.dashboard == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'dashboard/requirements.txt'
      - name: Install dependencies
        run: |
          pip install -r dashboard/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        run: cd dashboard && python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: src

  # ─────────────────────────────────────────────────────────────────────────────
  # Test AC Service
  # ─────────────────────────────────────────────────────────────────────────────
  test-ac-service:
    needs: build
    if: ${{ needs.build.outputs.ac-service == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'services/ac-service/requirements.txt'
      - name: Install dependencies
        run: |
          pip install -r services/ac-service/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        run: cd services/ac-service && python -m pytest tests/ -v --tb=short || echo "No tests found"
        env:
          PYTHONPATH: src

  # ─────────────────────────────────────────────────────────────────────────────
  # Test Baby Gifts Service
  # ─────────────────────────────────────────────────────────────────────────────
  test-baby-gifts:
    needs: build
    if: ${{ needs.build.outputs.baby-gifts == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'services/baby-gifts-service/requirements.txt'
      - name: Install dependencies
        run: |
          pip install -r services/baby-gifts-service/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        run: cd services/baby-gifts-service && python -m pytest tests/ -v --tb=short || echo "No tests found"
        env:
          PYTHONPATH: src

  # ─────────────────────────────────────────────────────────────────────────────
  # Test Portfolio Monitor Service
  # ─────────────────────────────────────────────────────────────────────────────
  test-portfolio-monitor:
    needs: build
    if: ${{ needs.build.outputs.portfolio-monitor == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'services/portfolio-monitor/requirements.txt'
      - name: Install dependencies
        run: |
          pip install -r services/portfolio-monitor/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        run: cd services/portfolio-monitor && python -m pytest tests/ -v --tb=short || echo "No tests found"
        env:
          PYTHONPATH: src

  # ─────────────────────────────────────────────────────────────────────────────
  # Test Vacaciones Service
  # ─────────────────────────────────────────────────────────────────────────────
  test-vacaciones:
    needs: build
    if: ${{ needs.build.outputs.vacaciones == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'services/vacaciones-service/requirements.txt'
      - name: Install dependencies
        run: |
          pip install -r services/vacaciones-service/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        run: cd services/vacaciones-service && python -m pytest tests/ -v --tb=short || echo "No tests found"
        env:
          PYTHONPATH: src

  # ─────────────────────────────────────────────────────────────────────────────
  # Test Casita Sueños
  # ─────────────────────────────────────────────────────────────────────────────
  test-casita:
    needs: build
    if: ${{ needs.build.outputs.casita == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'services/casita-suenos/fase3-app/requirements.txt'
      - name: Install dependencies
        run: |
          pip install -r services/casita-suenos/fase3-app/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        run: cd services/casita-suenos/fase3-app && python -m pytest tests/ -v --tb=short || echo "No tests found"
        env:
          PYTHONPATH: src

  # ─────────────────────────────────────────────────────────────────────────────
  # Test Vaultwarden (Dockerfile config tests only - no runtime tests)
  # ─────────────────────────────────────────────────────────────────────────────
  test-vaultwarden:
    needs: build
    if: ${{ needs.build.outputs.vaultwarden == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install pytest
      - name: Run Dockerfile tests
        run: cd services/vaultwarden && python -m pytest tests/test_dockerfile.py -v --tb=short

  # ─────────────────────────────────────────────────────────────────────────────
  # Test Valheim Admin
  # ─────────────────────────────────────────────────────────────────────────────
  test-valheim-admin:
    needs: build
    if: ${{ needs.build.outputs.valheim-admin == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'services/valheim-admin/requirements.txt'
      - name: Install dependencies
        run: |
          pip install -r services/valheim-admin/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        run: cd services/valheim-admin && python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: src

  # ─────────────────────────────────────────────────────────────────────────────
  # Test Summary - gate for deploy
  # ─────────────────────────────────────────────────────────────────────────────
  test-summary:
    needs: [build, test-dashboard, test-ac-service, test-baby-gifts, test-portfolio-monitor, test-vacaciones, test-casita, test-vaultwarden, test-valheim-admin]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check test results
        run: |
          echo "=== Test Summary ==="
          FAILED=false
          for result in "${{ needs.test-dashboard.result }}" "${{ needs.test-ac-service.result }}" \
                        "${{ needs.test-baby-gifts.result }}" "${{ needs.test-portfolio-monitor.result }}" \
                        "${{ needs.test-vacaciones.result }}" \
                        "${{ needs.test-casita.result }}" "${{ needs.test-vaultwarden.result }}" \
                        "${{ needs.test-valheim-admin.result }}"; do
            [[ "$result" == "failure" ]] && FAILED=true
          done
          
          if [[ "$FAILED" == "true" ]]; then
            echo "❌ Some tests failed"
            exit 1
          else
            echo "✅ All tests passed (or skipped)"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy - matrix strategy with single approval
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    needs: [build, test-summary]
    if: |
      always() &&
      needs.test-summary.result == 'success' &&
      needs.build.outputs.any-service == 'true' &&
      needs.build.outputs.services-matrix != '[]' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    strategy:
      matrix:
        service: ${{ fromJson(needs.build.outputs.services-matrix) }}
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: egnal
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ matrix.service.image }}:latest
            ${{ matrix.service.image }}:${{ github.sha }}
          platforms: linux/arm64

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy ${{ matrix.service.name }} to Pi
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_SSH_HOST }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          timeout: 120s
          script: |
            cd ~/smart-home-prod
            echo "=== Deploying ${{ matrix.service.name }} ==="
            docker compose pull ${{ matrix.service.name }}
            
            # Always force-recreate to ensure new image is used
            # Even if digest matches, container might be running old cached layers
            if docker compose ps ${{ matrix.service.name }} --status running -q | grep -q .; then
              docker compose up -d --force-recreate ${{ matrix.service.name }}
              echo "✅ Service recreated with new image"
            else
              echo "⏸️ Service was stopped - image updated but not started"
            fi
            
            echo "=== Done ==="
            docker ps --filter "name=${{ matrix.service.name }}" --format "table {{.Names}}\t{{.Status}}"

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy nginx config - sync infrastructure files to Pi
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-nginx:
    needs: [build, test-summary]
    if: |
      always() &&
      needs.test-summary.result == 'success' &&
      needs.build.outputs.nginx == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Sync nginx config to Pi
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PI_SSH_HOST }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          source: "infrastructure/nginx/conf.d/*,infrastructure/nginx/nginx.conf"
          target: "~/smart-home-prod/"
          strip_components: 0

      - name: Reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_SSH_HOST }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          timeout: 30s
          script: |
            echo "=== Testing nginx config ==="
            docker exec nginx-reverse-proxy nginx -t
            
            echo "=== Reloading nginx ==="
            docker exec nginx-reverse-proxy nginx -s reload
            
            echo "✅ nginx config deployed and reloaded"

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy docker-compose.prod.yml to Pi
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-compose:
    needs: [build, test-summary]
    if: |
      always() &&
      needs.test-summary.result == 'success' &&
      needs.build.outputs.compose == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Sync docker-compose.prod.yml to Pi
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PI_SSH_HOST }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/smart-home-prod/"
          strip_components: 0

      - name: Rename to docker-compose.yml on Pi
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_SSH_HOST }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          timeout: 30s
          script: |
            cd ~/smart-home-prod
            echo "=== Updating docker-compose.yml ==="
            mv docker-compose.prod.yml docker-compose.yml
            echo "✅ docker-compose.yml updated"
            
            # Validate the new compose file
            docker compose config --quiet && echo "✅ Compose file valid" || echo "⚠️ Compose file has warnings"

  # ─────────────────────────────────────────────────────────────────────────────
  # Verify - check all deployed services are healthy (via SSH to Pi)
  # ─────────────────────────────────────────────────────────────────────────────
  verify:
    needs: [build, deploy, deploy-nginx, deploy-compose]
    if: always() && (needs.deploy.result == 'success' || needs.deploy-nginx.result == 'success' || needs.deploy-compose.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Wait for services to start
        run: sleep 20

      - name: Verify deployed services via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DASHBOARD_CHANGED: ${{ needs.build.outputs.dashboard }}
          AC_CHANGED: ${{ needs.build.outputs.ac-service }}
          BABYGIFTS_CHANGED: ${{ needs.build.outputs.baby-gifts }}
          PORTFOLIO_CHANGED: ${{ needs.build.outputs.portfolio-monitor }}
          VACACIONES_CHANGED: ${{ needs.build.outputs.vacaciones }}
          CASITA_CHANGED: ${{ needs.build.outputs.casita }}
          VAULTWARDEN_CHANGED: ${{ needs.build.outputs.vaultwarden }}
          VALHEIM_ADMIN_CHANGED: ${{ needs.build.outputs.valheim-admin }}
        with:
          host: ${{ secrets.PI_SSH_HOST }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          timeout: 60s
          envs: DASHBOARD_CHANGED,AC_CHANGED,BABYGIFTS_CHANGED,PORTFOLIO_CHANGED,VACACIONES_CHANGED,CASITA_CHANGED,VAULTWARDEN_CHANGED,VALHEIM_ADMIN_CHANGED
          script: |
            BASE_URL="https://localhost"
            FAILED=false
            
            check_health() {
              local name=$1
              local endpoint=$2
              local changed=$3
              
              if [[ "$changed" != "true" ]]; then
                echo "⏭️  $name (not deployed)"
                return
              fi
              
              # Retry up to 3 times with 5s delay for transient failures
              for attempt in 1 2 3; do
                HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 10 "$BASE_URL$endpoint" || echo "000")
                if [[ "$HTTP_CODE" == "200" ]]; then
                  echo "✅ $name ($endpoint) - OK"
                  return
                elif [[ "$HTTP_CODE" =~ ^0+$ ]] || [[ "$HTTP_CODE" == "502" ]] || [[ "$HTTP_CODE" == "503" ]]; then
                  if [[ $attempt -lt 3 ]]; then
                    echo "⏳ $name ($endpoint) - HTTP $HTTP_CODE, retrying in 5s..."
                    sleep 5
                  else
                    echo "⚠️  $name ($endpoint) - Service not responding after 3 attempts"
                  fi
                else
                  echo "❌ $name ($endpoint) - HTTP $HTTP_CODE"
                  FAILED=true
                  return
                fi
              done
            }
            
            echo "=== Health Check Results (from Pi) ==="
            # All health checks go through dashboard proxy at /api/health/*
            check_health "Dashboard" "/api/health" "$DASHBOARD_CHANGED"
            check_health "AC Service" "/api/health/ac" "$AC_CHANGED"
            check_health "Baby Gifts" "/api/health/baby-gifts" "$BABYGIFTS_CHANGED"
            check_health "Portfolio Monitor" "/api/health/portfolio" "$PORTFOLIO_CHANGED"
            check_health "Vacaciones" "/api/health/vacaciones" "$VACACIONES_CHANGED"
            check_health "Casita" "/api/health/casita" "$CASITA_CHANGED"
            check_health "Vaultwarden" "/passwords/" "$VAULTWARDEN_CHANGED"
            check_health "Valheim Admin" "/valheim-admin/health" "$VALHEIM_ADMIN_CHANGED"
            echo "======================================="
            
            if [[ "$FAILED" == "true" ]]; then
              echo "❌ Some services failed health check with unexpected errors"
              exit 1
            fi
            echo "✅ Health check complete!"

      - name: Deploy Summary
        if: always()
        run: |
          echo "## 🚀 Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard | ${{ needs.build.outputs.dashboard }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AC Service | ${{ needs.build.outputs.ac-service }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Baby Gifts | ${{ needs.build.outputs.baby-gifts }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Portfolio Monitor | ${{ needs.build.outputs.portfolio-monitor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Vacaciones | ${{ needs.build.outputs.vacaciones }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Casita | ${{ needs.build.outputs.casita }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Vaultwarden | ${{ needs.build.outputs.vaultwarden }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Valheim Admin | ${{ needs.build.outputs.valheim-admin }} |" >> $GITHUB_STEP_SUMMARY
          echo "| nginx | ${{ needs.build.outputs.nginx }} |" >> $GITHUB_STEP_SUMMARY
          echo "| compose | ${{ needs.build.outputs.compose }} |" >> $GITHUB_STEP_SUMMARY
