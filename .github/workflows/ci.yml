# ═══════════════════════════════════════════════════════════════════════════════
# Smart Home - CI/CD Pipeline
# 
# Flow:
#   1. Prepare: detect changes, build service matrix
#   2. Lint & Test: ruff, bandit, hadolint, then pytest if all pass
#   3. Quality Gate: verify all checks passed
#   4. Deploy: build Docker images and deploy to Pi
#
# Manual trigger:
#   gh workflow run ci.yml --repo EgnalZurc/smart-home                        # auto-detect changes
#   gh workflow run ci.yml -f service=all --repo EgnalZurc/smart-home         # all services
#   gh workflow run ci.yml -f service=dashboard --repo EgnalZurc/smart-home   # single service
# ═══════════════════════════════════════════════════════════════════════════════

name: Build, Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build/test'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - all
          - dashboard
          - ac-service
          - baby-gifts
          - portfolio-monitor
          - vacaciones
          - casita
          - vaultwarden
          - valheim-admin
      force_deploy:
        description: 'Enable deploy even without detected changes'
        required: false
        default: false
        type: boolean

env:
  DOCKERHUB_USERNAME: egnal

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Prepare: detect changes, build service matrix
  # ─────────────────────────────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      dashboard: ${{ steps.changes.outputs.dashboard }}
      ac-service: ${{ steps.changes.outputs.ac-service }}
      baby-gifts: ${{ steps.changes.outputs.baby-gifts }}
      portfolio-monitor: ${{ steps.changes.outputs.portfolio-monitor }}
      vacaciones: ${{ steps.changes.outputs.vacaciones }}
      casita: ${{ steps.changes.outputs.casita }}
      vaultwarden: ${{ steps.changes.outputs.vaultwarden }}
      valheim-admin: ${{ steps.changes.outputs.valheim-admin }}
      nginx: ${{ steps.changes.outputs.nginx }}
      compose: ${{ steps.changes.outputs.compose }}
      any-service: ${{ steps.changes.outputs.any-service }}
      any-python: ${{ steps.changes.outputs.any-python }}
      any-docker: ${{ steps.changes.outputs.any-docker }}
      services-matrix: ${{ steps.matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      # ── Detect changes ──
      - uses: dorny/paths-filter@v3
        id: filter
        if: ${{ github.event.inputs.service == 'auto' || github.event.inputs.service == '' }}
        with:
          filters: |
            dashboard:
              - 'dashboard/**'
            ac-service:
              - 'services/ac-service/**'
            baby-gifts:
              - 'services/baby-gifts-service/**'
            portfolio-monitor:
              - 'services/portfolio-monitor/**'
            vacaciones:
              - 'services/vacaciones-service/**'
            casita:
              - 'services/casita-suenos/**'
            vaultwarden:
              - 'services/vaultwarden/**'
            valheim-admin:
              - 'services/valheim-admin/**'
            nginx:
              - 'infrastructure/nginx/**'
            compose:
              - 'docker-compose.prod.yml'
            infrastructure:
              - 'infrastructure/**'
              - 'docker-compose*.yml'

      - name: Determine services to process
        id: changes
        run: |
          SERVICE="${{ github.event.inputs.service }}"
          FORCE_DEPLOY="${{ github.event.inputs.force_deploy }}"
          
          DASHBOARD=false; AC_SERVICE=false; BABY_GIFTS=false; PORTFOLIO_MONITOR=false
          VACACIONES=false; CASITA=false; VAULTWARDEN=false; VALHEIM_ADMIN=false
          NGINX=false; COMPOSE=false
          
          case "$SERVICE" in
            all)
              echo "🔄 Processing ALL services"
              DASHBOARD=true; AC_SERVICE=true; BABY_GIFTS=true; PORTFOLIO_MONITOR=true
              VACACIONES=true; CASITA=true; VAULTWARDEN=true; VALHEIM_ADMIN=true
              NGINX=true; COMPOSE=true
              ;;
            dashboard)         echo "🎯 Processing: dashboard";         DASHBOARD=true ;;
            ac-service)        echo "🎯 Processing: ac-service";        AC_SERVICE=true ;;
            baby-gifts)        echo "🎯 Processing: baby-gifts";        BABY_GIFTS=true ;;
            portfolio-monitor) echo "🎯 Processing: portfolio-monitor"; PORTFOLIO_MONITOR=true ;;
            vacaciones)        echo "🎯 Processing: vacaciones";        VACACIONES=true ;;
            casita)            echo "🎯 Processing: casita";            CASITA=true ;;
            vaultwarden)       echo "🎯 Processing: vaultwarden";       VAULTWARDEN=true ;;
            valheim-admin)     echo "🎯 Processing: valheim-admin";     VALHEIM_ADMIN=true ;;
            *)
              echo "🔍 Auto-detecting changed services"
              DASHBOARD=${{ steps.filter.outputs.dashboard }}
              AC_SERVICE=${{ steps.filter.outputs.ac-service }}
              BABY_GIFTS=${{ steps.filter.outputs.baby-gifts }}
              PORTFOLIO_MONITOR=${{ steps.filter.outputs.portfolio-monitor }}
              VACACIONES=${{ steps.filter.outputs.vacaciones }}
              CASITA=${{ steps.filter.outputs.casita }}
              VAULTWARDEN=${{ steps.filter.outputs.vaultwarden }}
              VALHEIM_ADMIN=${{ steps.filter.outputs.valheim-admin }}
              NGINX=${{ steps.filter.outputs.nginx }}
              COMPOSE=${{ steps.filter.outputs.compose }}
              ;;
          esac
          
          # Output individual service flags
          echo "dashboard=$DASHBOARD" >> $GITHUB_OUTPUT
          echo "ac-service=$AC_SERVICE" >> $GITHUB_OUTPUT
          echo "baby-gifts=$BABY_GIFTS" >> $GITHUB_OUTPUT
          echo "portfolio-monitor=$PORTFOLIO_MONITOR" >> $GITHUB_OUTPUT
          echo "vacaciones=$VACACIONES" >> $GITHUB_OUTPUT
          echo "casita=$CASITA" >> $GITHUB_OUTPUT
          echo "vaultwarden=$VAULTWARDEN" >> $GITHUB_OUTPUT
          echo "valheim-admin=$VALHEIM_ADMIN" >> $GITHUB_OUTPUT
          echo "nginx=$NGINX" >> $GITHUB_OUTPUT
          echo "compose=$COMPOSE" >> $GITHUB_OUTPUT
          
          # Check if any service changed
          if [[ "$DASHBOARD" == "true" ]] || [[ "$AC_SERVICE" == "true" ]] || \
             [[ "$BABY_GIFTS" == "true" ]] || [[ "$PORTFOLIO_MONITOR" == "true" ]] || \
             [[ "$VACACIONES" == "true" ]] || [[ "$CASITA" == "true" ]] || \
             [[ "$VAULTWARDEN" == "true" ]] || [[ "$VALHEIM_ADMIN" == "true" ]] || \
             [[ "$NGINX" == "true" ]] || [[ "$COMPOSE" == "true" ]] || \
             [[ "${{ steps.filter.outputs.infrastructure }}" == "true" ]] || \
             [[ "$FORCE_DEPLOY" == "true" ]]; then
            echo "any-service=true" >> $GITHUB_OUTPUT
          else
            echo "any-service=false" >> $GITHUB_OUTPUT
          fi
          
          # Check if any Python service changed (for ruff/bandit)
          if [[ "$DASHBOARD" == "true" ]] || [[ "$AC_SERVICE" == "true" ]] || \
             [[ "$BABY_GIFTS" == "true" ]] || [[ "$PORTFOLIO_MONITOR" == "true" ]] || \
             [[ "$VACACIONES" == "true" ]] || [[ "$CASITA" == "true" ]] || \
             [[ "$VALHEIM_ADMIN" == "true" ]]; then
            echo "any-python=true" >> $GITHUB_OUTPUT
          else
            echo "any-python=false" >> $GITHUB_OUTPUT
          fi
          
          # Check if any Dockerfile changed (for hadolint)
          if [[ "$DASHBOARD" == "true" ]] || [[ "$AC_SERVICE" == "true" ]] || \
             [[ "$BABY_GIFTS" == "true" ]] || [[ "$PORTFOLIO_MONITOR" == "true" ]] || \
             [[ "$VACACIONES" == "true" ]] || [[ "$CASITA" == "true" ]] || \
             [[ "$VAULTWARDEN" == "true" ]] || [[ "$VALHEIM_ADMIN" == "true" ]]; then
            echo "any-docker=true" >> $GITHUB_OUTPUT
          else
            echo "any-docker=false" >> $GITHUB_OUTPUT
          fi

      # ── Build matrix for deploy ──
      - name: Build deploy matrix
        id: matrix
        run: |
          SERVICES="["
          FIRST=true
          
          add_service() {
            if [[ "$FIRST" == "true" ]]; then FIRST=false; else SERVICES="$SERVICES,"; fi
            SERVICES="$SERVICES{\"name\":\"$1\",\"image\":\"$2\",\"context\":\"$3\"}"
          }
          
          [[ "${{ steps.changes.outputs.dashboard }}" == "true" ]] && \
            add_service "smart-home-backend" "egnal/smart-home-dashboard" "./dashboard"
          [[ "${{ steps.changes.outputs.ac-service }}" == "true" ]] && \
            add_service "ac-service" "egnal/smart-home-ac-service" "./services/ac-service"
          [[ "${{ steps.changes.outputs.baby-gifts }}" == "true" ]] && \
            add_service "baby-gifts-service" "egnal/smart-home-baby-gifts" "./services/baby-gifts-service"
          [[ "${{ steps.changes.outputs.portfolio-monitor }}" == "true" ]] && \
            add_service "portfolio-monitor" "egnal/smart-home-portfolio-monitor" "./services/portfolio-monitor"
          [[ "${{ steps.changes.outputs.vacaciones }}" == "true" ]] && \
            add_service "vacaciones-service" "egnal/smart-home-vacaciones" "./services/vacaciones-service"
          [[ "${{ steps.changes.outputs.casita }}" == "true" ]] && \
            add_service "casita-suenos" "egnal/smart-home-casita-suenos" "./services/casita-suenos/fase3-app"
          [[ "${{ steps.changes.outputs.vaultwarden }}" == "true" ]] && \
            add_service "vaultwarden" "egnal/smart-home-vaultwarden" "./services/vaultwarden"
          [[ "${{ steps.changes.outputs.valheim-admin }}" == "true" ]] && \
            add_service "valheim-admin" "egnal/smart-home-valheim-admin" "./services/valheim-admin"
          
          SERVICES="$SERVICES]"
          echo "services=$SERVICES" >> $GITHUB_OUTPUT
          echo "Deploy matrix: $SERVICES"

      # ── Prepare summary ──
      - name: Prepare Summary
        run: |
          echo "## 📋 Prepare Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard | ${{ steps.changes.outputs.dashboard }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AC Service | ${{ steps.changes.outputs.ac-service }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Baby Gifts | ${{ steps.changes.outputs.baby-gifts }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Portfolio Monitor | ${{ steps.changes.outputs.portfolio-monitor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Vacaciones | ${{ steps.changes.outputs.vacaciones }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Casita | ${{ steps.changes.outputs.casita }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Vaultwarden | ${{ steps.changes.outputs.vaultwarden }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Valheim Admin | ${{ steps.changes.outputs.valheim-admin }} |" >> $GITHUB_STEP_SUMMARY
          echo "| nginx | ${{ steps.changes.outputs.nginx }} |" >> $GITHUB_STEP_SUMMARY
          echo "| compose | ${{ steps.changes.outputs.compose }} |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  # Lint & Test: ruff + bandit + hadolint + pytest
  # ─────────────────────────────────────────────────────────────────────────────
  lint-and-test:
    needs: prepare
    if: ${{ needs.prepare.outputs.any-service == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      ruff-passed: ${{ steps.ruff.outputs.passed }}
      bandit-passed: ${{ steps.bandit.outputs.passed }}
      hadolint-passed: ${{ steps.hadolint.outputs.passed }}
      tests-passed: ${{ steps.tests.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: pip install ruff bandit

      - name: Install Hadolint
        run: |
          wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint

      # ── Ruff (linting + formatting) ──
      - name: Ruff - Code Quality
        id: ruff
        if: ${{ needs.prepare.outputs.any-python == 'true' }}
        run: |
          echo "::group::Ruff Lint & Format Check"
          FAILED=false
          
          check_ruff() {
            local name=$1
            local path=$2
            local changed=$3
            if [[ "$changed" != "true" ]]; then return; fi
            echo "=== $name ==="
            ruff check "$path" --output-format=github || FAILED=true
            ruff format "$path" --check --diff || FAILED=true
          }
          
          check_ruff "Dashboard" "dashboard/src" "${{ needs.prepare.outputs.dashboard }}"
          check_ruff "AC Service" "services/ac-service/src" "${{ needs.prepare.outputs.ac-service }}"
          check_ruff "Baby Gifts" "services/baby-gifts-service/src" "${{ needs.prepare.outputs.baby-gifts }}"
          check_ruff "Portfolio Monitor" "services/portfolio-monitor/src" "${{ needs.prepare.outputs.portfolio-monitor }}"
          check_ruff "Vacaciones" "services/vacaciones-service/src" "${{ needs.prepare.outputs.vacaciones }}"
          check_ruff "Casita" "services/casita-suenos/fase3-app/src" "${{ needs.prepare.outputs.casita }}"
          check_ruff "Valheim Admin" "services/valheim-admin/src" "${{ needs.prepare.outputs.valheim-admin }}"
          
          echo "::endgroup::"
          
          if [[ "$FAILED" == "true" ]]; then
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "passed=true" >> $GITHUB_OUTPUT
          fi

      # ── Bandit (security) ──
      - name: Bandit - Security Check
        id: bandit
        if: ${{ needs.prepare.outputs.any-python == 'true' && (success() || failure()) }}
        run: |
          echo "::group::Bandit Security Scan"
          FAILED=false
          
          check_bandit() {
            local name=$1
            local path=$2
            local changed=$3
            if [[ "$changed" != "true" ]]; then return; fi
            echo "=== $name ==="
            bandit -r "$path" -ll -ii --format txt || FAILED=true
          }
          
          check_bandit "Dashboard" "dashboard/src" "${{ needs.prepare.outputs.dashboard }}"
          check_bandit "AC Service" "services/ac-service/src" "${{ needs.prepare.outputs.ac-service }}"
          check_bandit "Baby Gifts" "services/baby-gifts-service/src" "${{ needs.prepare.outputs.baby-gifts }}"
          check_bandit "Portfolio Monitor" "services/portfolio-monitor/src" "${{ needs.prepare.outputs.portfolio-monitor }}"
          check_bandit "Vacaciones" "services/vacaciones-service/src" "${{ needs.prepare.outputs.vacaciones }}"
          check_bandit "Casita" "services/casita-suenos/fase3-app/src" "${{ needs.prepare.outputs.casita }}"
          check_bandit "Valheim Admin" "services/valheim-admin/src" "${{ needs.prepare.outputs.valheim-admin }}"
          
          echo "::endgroup::"
          
          if [[ "$FAILED" == "true" ]]; then
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "passed=true" >> $GITHUB_OUTPUT
          fi

      # ── Hadolint (Dockerfile best practices) ──
      - name: Hadolint - Dockerfile Check
        id: hadolint
        if: ${{ needs.prepare.outputs.any-docker == 'true' && (success() || failure()) }}
        run: |
          echo "::group::Hadolint Dockerfile Check"
          FAILED=false
          
          check_hadolint() {
            local name=$1
            local dockerfile=$2
            local changed=$3
            if [[ "$changed" != "true" ]]; then return; fi
            if [[ ! -f "$dockerfile" ]]; then return; fi
            echo "=== $name ==="
            hadolint "$dockerfile" || FAILED=true
          }
          
          check_hadolint "Dashboard" "dashboard/Dockerfile" "${{ needs.prepare.outputs.dashboard }}"
          check_hadolint "AC Service" "services/ac-service/Dockerfile" "${{ needs.prepare.outputs.ac-service }}"
          check_hadolint "Baby Gifts" "services/baby-gifts-service/Dockerfile" "${{ needs.prepare.outputs.baby-gifts }}"
          check_hadolint "Portfolio Monitor" "services/portfolio-monitor/Dockerfile" "${{ needs.prepare.outputs.portfolio-monitor }}"
          check_hadolint "Vacaciones" "services/vacaciones-service/Dockerfile" "${{ needs.prepare.outputs.vacaciones }}"
          check_hadolint "Casita" "services/casita-suenos/fase3-app/Dockerfile" "${{ needs.prepare.outputs.casita }}"
          check_hadolint "Vaultwarden" "services/vaultwarden/Dockerfile" "${{ needs.prepare.outputs.vaultwarden }}"
          check_hadolint "Valheim Admin" "services/valheim-admin/Dockerfile" "${{ needs.prepare.outputs.valheim-admin }}"
          
          echo "::endgroup::"
          
          if [[ "$FAILED" == "true" ]]; then
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "passed=true" >> $GITHUB_OUTPUT
          fi

      # ── Pytest (only if lint checks passed) ──
      - name: Install test dependencies
        if: ${{ steps.ruff.outputs.passed == 'true' && steps.bandit.outputs.passed == 'true' && steps.hadolint.outputs.passed == 'true' }}
        run: pip install pytest pytest-asyncio httpx

      - name: Run Tests
        id: tests
        if: ${{ steps.ruff.outputs.passed == 'true' && steps.bandit.outputs.passed == 'true' && steps.hadolint.outputs.passed == 'true' }}
        run: |
          echo "::group::Pytest"
          FAILED=false
          
          run_tests() {
            local name=$1
            local path=$2
            local changed=$3
            if [[ "$changed" != "true" ]]; then return; fi
            if [[ ! -d "$path/tests" ]]; then
              echo "⏭️  $name - no tests directory"
              return
            fi
            echo "=== $name ==="
            pip install -r "$path/requirements.txt" --quiet 2>/dev/null || true
            cd "$path" && PYTHONPATH=src python -m pytest tests/ -v --tb=short && cd - > /dev/null || FAILED=true
          }
          
          run_tests "Dashboard" "dashboard" "${{ needs.prepare.outputs.dashboard }}"
          run_tests "AC Service" "services/ac-service" "${{ needs.prepare.outputs.ac-service }}"
          run_tests "Baby Gifts" "services/baby-gifts-service" "${{ needs.prepare.outputs.baby-gifts }}"
          run_tests "Portfolio Monitor" "services/portfolio-monitor" "${{ needs.prepare.outputs.portfolio-monitor }}"
          run_tests "Vacaciones" "services/vacaciones-service" "${{ needs.prepare.outputs.vacaciones }}"
          run_tests "Casita" "services/casita-suenos/fase3-app" "${{ needs.prepare.outputs.casita }}"
          run_tests "Vaultwarden" "services/vaultwarden" "${{ needs.prepare.outputs.vaultwarden }}"
          run_tests "Valheim Admin" "services/valheim-admin" "${{ needs.prepare.outputs.valheim-admin }}"
          
          echo "::endgroup::"
          
          if [[ "$FAILED" == "true" ]]; then
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "passed=true" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Quality Gate: verify all checks passed
  # ─────────────────────────────────────────────────────────────────────────────
  quality-gate:
    needs: [prepare, lint-and-test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check Quality Results
        run: |
          echo "## 🚦 Quality Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          RUFF="${{ needs.lint-and-test.outputs.ruff-passed }}"
          BANDIT="${{ needs.lint-and-test.outputs.bandit-passed }}"
          HADOLINT="${{ needs.lint-and-test.outputs.hadolint-passed }}"
          TESTS="${{ needs.lint-and-test.outputs.tests-passed }}"
          JOB_RESULT="${{ needs.lint-and-test.result }}"
          
          # Handle skipped job (no changes)
          if [[ "$JOB_RESULT" == "skipped" ]]; then
            echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| All checks | ⏭️ Skipped (no changes) |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ No services changed - nothing to check" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          
          FAILED=false
          
          # Ruff
          if [[ "$RUFF" == "true" ]]; then
            echo "| Ruff (lint) | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          elif [[ "$RUFF" == "false" ]]; then
            echo "| Ruff (lint) | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            FAILED=true
          else
            echo "| Ruff (lint) | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Bandit
          if [[ "$BANDIT" == "true" ]]; then
            echo "| Bandit (security) | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          elif [[ "$BANDIT" == "false" ]]; then
            echo "| Bandit (security) | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            FAILED=true
          else
            echo "| Bandit (security) | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Hadolint
          if [[ "$HADOLINT" == "true" ]]; then
            echo "| Hadolint (Docker) | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          elif [[ "$HADOLINT" == "false" ]]; then
            echo "| Hadolint (Docker) | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            FAILED=true
          else
            echo "| Hadolint (Docker) | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Tests
          if [[ "$TESTS" == "true" ]]; then
            echo "| Pytest (tests) | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          elif [[ "$TESTS" == "false" ]]; then
            echo "| Pytest (tests) | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            FAILED=true
          else
            echo "| Pytest (tests) | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "$FAILED" == "true" ]]; then
            echo "❌ **Quality gate failed** - fix issues before deploy" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **Quality gate passed** - ready for deploy" >> $GITHUB_STEP_SUMMARY
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy - matrix strategy with single approval
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    needs: [prepare, quality-gate]
    if: |
      always() &&
      needs.quality-gate.result == 'success' &&
      needs.prepare.outputs.any-service == 'true' &&
      needs.prepare.outputs.services-matrix != '[]' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    strategy:
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services-matrix) }}
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: egnal
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ matrix.service.image }}:latest
            ${{ matrix.service.image }}:${{ github.sha }}
          platforms: linux/arm64

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy ${{ matrix.service.name }} to Pi
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_SSH_HOST }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          timeout: 120s
          script: |
            cd ~/smart-home-prod
            echo "=== Deploying ${{ matrix.service.name }} ==="
            docker compose pull ${{ matrix.service.name }}
            
            if docker compose ps ${{ matrix.service.name }} --status running -q | grep -q .; then
              docker compose up -d --force-recreate ${{ matrix.service.name }}
              echo "✅ Service recreated with new image"
            else
              echo "⏸️ Service was stopped - image updated but not started"
            fi
            
            docker ps --filter "name=${{ matrix.service.name }}" --format "table {{.Names}}\t{{.Status}}"

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy nginx config
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-nginx:
    needs: [prepare, quality-gate]
    if: |
      always() &&
      needs.quality-gate.result == 'success' &&
      needs.prepare.outputs.nginx == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Sync nginx config to Pi
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PI_SSH_HOST }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          source: "infrastructure/nginx/conf.d/*,infrastructure/nginx/nginx.conf"
          target: "~/smart-home-prod/"
          strip_components: 0

      - name: Reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_SSH_HOST }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          timeout: 30s
          script: |
            docker exec nginx-reverse-proxy nginx -t
            docker exec nginx-reverse-proxy nginx -s reload
            echo "✅ nginx config deployed and reloaded"

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy docker-compose.prod.yml
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-compose:
    needs: [prepare, quality-gate]
    if: |
      always() &&
      needs.quality-gate.result == 'success' &&
      needs.prepare.outputs.compose == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Sync docker-compose.prod.yml to Pi
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PI_SSH_HOST }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/smart-home-prod/"
          strip_components: 0

      - name: Rename to docker-compose.yml on Pi
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_SSH_HOST }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          timeout: 30s
          script: |
            cd ~/smart-home-prod
            mv docker-compose.prod.yml docker-compose.yml
            docker compose config --quiet && echo "✅ Compose file valid"

  # ─────────────────────────────────────────────────────────────────────────────
  # Verify - check deployed services are healthy
  # ─────────────────────────────────────────────────────────────────────────────
  verify:
    needs: [prepare, deploy, deploy-nginx, deploy-compose]
    if: always() && (needs.deploy.result == 'success' || needs.deploy-nginx.result == 'success' || needs.deploy-compose.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Wait for services to start
        run: sleep 20

      - name: Verify deployed services
        uses: appleboy/ssh-action@v1.0.3
        env:
          DASHBOARD_CHANGED: ${{ needs.prepare.outputs.dashboard }}
          AC_CHANGED: ${{ needs.prepare.outputs.ac-service }}
          BABYGIFTS_CHANGED: ${{ needs.prepare.outputs.baby-gifts }}
          PORTFOLIO_CHANGED: ${{ needs.prepare.outputs.portfolio-monitor }}
          VACACIONES_CHANGED: ${{ needs.prepare.outputs.vacaciones }}
          CASITA_CHANGED: ${{ needs.prepare.outputs.casita }}
          VAULTWARDEN_CHANGED: ${{ needs.prepare.outputs.vaultwarden }}
          VALHEIM_ADMIN_CHANGED: ${{ needs.prepare.outputs.valheim-admin }}
        with:
          host: ${{ secrets.PI_SSH_HOST }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          timeout: 60s
          envs: DASHBOARD_CHANGED,AC_CHANGED,BABYGIFTS_CHANGED,PORTFOLIO_CHANGED,VACACIONES_CHANGED,CASITA_CHANGED,VAULTWARDEN_CHANGED,VALHEIM_ADMIN_CHANGED
          script: |
            BASE_URL="https://localhost"
            FAILED=false
            
            check_health() {
              local name=$1
              local endpoint=$2
              local changed=$3
              
              if [[ "$changed" != "true" ]]; then
                echo "⏭️  $name (not deployed)"
                return
              fi
              
              for attempt in 1 2 3; do
                HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 10 "$BASE_URL$endpoint" || echo "000")
                if [[ "$HTTP_CODE" == "200" ]]; then
                  echo "✅ $name - OK"
                  return
                fi
                sleep 5
              done
              echo "❌ $name - HTTP $HTTP_CODE"
              FAILED=true
            }
            
            check_health "Dashboard" "/api/health/backend" "$DASHBOARD_CHANGED"
            check_health "AC Service" "/api/health/ac" "$AC_CHANGED"
            check_health "Baby Gifts" "/api/health/baby-gifts" "$BABYGIFTS_CHANGED"
            check_health "Portfolio" "/api/health/portfolio" "$PORTFOLIO_CHANGED"
            check_health "Vacaciones" "/api/health/vacaciones" "$VACACIONES_CHANGED"
            check_health "Casita" "/api/health/casita" "$CASITA_CHANGED"
            check_health "Vaultwarden" "/passwords/" "$VAULTWARDEN_CHANGED"
            check_health "Valheim Admin" "/api/health/valheim" "$VALHEIM_ADMIN_CHANGED"
            
            if [[ "$FAILED" == "true" ]]; then
              echo "⚠️ Some health checks failed"
              exit 1
            fi
            echo "✅ All deployed services healthy"
