# ═══════════════════════════════════════════════════════════════════════════════
# Smart Home - CI/CD Pipeline
# 
# Flow:
#   1. Prepare: detect changes, build service matrix
#   2. Lint & Test (parallel per service): ruff, bandit, hadolint, pytest
#   3. Quality Gate: verify all lint-and-test-* jobs passed
#   4. Deploy: build Docker images and deploy to Pi
#
# Manual trigger:
#   gh workflow run ci.yml --repo EgnalZurc/smart-home                        # auto-detect changes
#   gh workflow run ci.yml -f service=all --repo EgnalZurc/smart-home         # all services
#   gh workflow run ci.yml -f service=dashboard --repo EgnalZurc/smart-home   # single service
# ═══════════════════════════════════════════════════════════════════════════════

name: Build, Test and Deploy

# Serialize runs per branch so two pushes to main cannot deploy to the Pi
# at the same time. Never cancel a run mid-flight: cancelling a deploy halfway
# could leave a container in an inconsistent state.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build/test'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - all
          - dashboard
          - ac-service
          - baby-gifts
          - portfolio-monitor
          - vacaciones
          - casita
          - vaultwarden
          - valheim-admin
          - pc-agent
      force_deploy:
        description: 'Enable deploy even without detected changes'
        required: false
        default: false
        type: boolean

env:
  DOCKERHUB_USERNAME: egnal

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Prepare: detect changes, build service matrix
  # ─────────────────────────────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      dashboard: ${{ steps.changes.outputs.dashboard }}
      ac-service: ${{ steps.changes.outputs.ac-service }}
      baby-gifts: ${{ steps.changes.outputs.baby-gifts }}
      portfolio-monitor: ${{ steps.changes.outputs.portfolio-monitor }}
      vacaciones: ${{ steps.changes.outputs.vacaciones }}
      casita: ${{ steps.changes.outputs.casita }}
      vaultwarden: ${{ steps.changes.outputs.vaultwarden }}
      valheim-admin: ${{ steps.changes.outputs.valheim-admin }}
      pc-agent: ${{ steps.changes.outputs.pc-agent }}
      async-http-client: ${{ steps.changes.outputs.async-http-client }}
      nginx: ${{ steps.changes.outputs.nginx }}
      compose: ${{ steps.changes.outputs.compose }}
      any-service: ${{ steps.changes.outputs.any-service }}
      services-matrix: ${{ steps.matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v5

      # ── Detect changes ──
      - uses: dorny/paths-filter@v4
        id: filter
        if: ${{ github.event.inputs.service == 'auto' || github.event.inputs.service == '' }}
        with:
          filters: |
            dashboard:
              - 'dashboard/**'
              - 'libs/smart_home_common/**'
            ac-service:
              - 'services/ac-service/**'
              - 'libs/smart_home_common/**'
            baby-gifts:
              - 'services/baby-gifts-service/**'
              - 'libs/notifications/**'
            portfolio-monitor:
              - 'services/portfolio-monitor/**'
            vacaciones:
              - 'services/vacaciones-service/**'
            casita:
              - 'services/casita-suenos/**'
            vaultwarden:
              - 'services/vaultwarden/**'
            valheim-admin:
              - 'services/valheim-admin/**'
              - 'libs/async_http_client/**'
            pc-agent:
              - 'tools/pc-agent/**'
            async-http-client:
              - 'libs/async_http_client/**'
            nginx:
              - 'infrastructure/nginx/**'
            compose:
              - 'docker-compose.prod.yml'
            infrastructure:
              - 'infrastructure/**'
              - 'docker-compose*.yml'

      - name: Determine services to process
        id: changes
        run: |
          SERVICE="${{ github.event.inputs.service }}"
          FORCE_DEPLOY="${{ github.event.inputs.force_deploy }}"
          
          DASHBOARD=false; AC_SERVICE=false; BABY_GIFTS=false; PORTFOLIO_MONITOR=false
          VACACIONES=false; CASITA=false; VAULTWARDEN=false; VALHEIM_ADMIN=false
          PC_AGENT=false; NGINX=false; COMPOSE=false
          ASYNC_HTTP_CLIENT=false
          
          case "$SERVICE" in
            all)
              echo "🔄 Processing ALL services"
              DASHBOARD=true; AC_SERVICE=true; BABY_GIFTS=true; PORTFOLIO_MONITOR=true
              VACACIONES=true; CASITA=true; VAULTWARDEN=true; VALHEIM_ADMIN=true
              PC_AGENT=true; NGINX=true; COMPOSE=true
              ASYNC_HTTP_CLIENT=true
              ;;
            dashboard)         echo "🎯 Processing: dashboard";         DASHBOARD=true ;;
            ac-service)        echo "🎯 Processing: ac-service";        AC_SERVICE=true ;;
            baby-gifts)        echo "🎯 Processing: baby-gifts";        BABY_GIFTS=true ;;
            portfolio-monitor) echo "🎯 Processing: portfolio-monitor"; PORTFOLIO_MONITOR=true ;;
            vacaciones)        echo "🎯 Processing: vacaciones";        VACACIONES=true ;;
            casita)            echo "🎯 Processing: casita";            CASITA=true ;;
            vaultwarden)       echo "🎯 Processing: vaultwarden";       VAULTWARDEN=true ;;
            valheim-admin)     echo "🎯 Processing: valheim-admin";     VALHEIM_ADMIN=true ;;
            pc-agent)          echo "🎯 Processing: pc-agent";          PC_AGENT=true ;;
            *)
              echo "🔍 Auto-detecting changed services"
              DASHBOARD=${{ steps.filter.outputs.dashboard }}
              AC_SERVICE=${{ steps.filter.outputs.ac-service }}
              BABY_GIFTS=${{ steps.filter.outputs.baby-gifts }}
              PORTFOLIO_MONITOR=${{ steps.filter.outputs.portfolio-monitor }}
              VACACIONES=${{ steps.filter.outputs.vacaciones }}
              CASITA=${{ steps.filter.outputs.casita }}
              VAULTWARDEN=${{ steps.filter.outputs.vaultwarden }}
              VALHEIM_ADMIN=${{ steps.filter.outputs.valheim-admin }}
              PC_AGENT=${{ steps.filter.outputs.pc-agent }}
              NGINX=${{ steps.filter.outputs.nginx }}
              COMPOSE=${{ steps.filter.outputs.compose }}
              ASYNC_HTTP_CLIENT=${{ steps.filter.outputs.async-http-client }}
              ;;
          esac
          
          # Output individual service flags
          echo "dashboard=$DASHBOARD" >> $GITHUB_OUTPUT
          echo "ac-service=$AC_SERVICE" >> $GITHUB_OUTPUT
          echo "baby-gifts=$BABY_GIFTS" >> $GITHUB_OUTPUT
          echo "portfolio-monitor=$PORTFOLIO_MONITOR" >> $GITHUB_OUTPUT
          echo "vacaciones=$VACACIONES" >> $GITHUB_OUTPUT
          echo "casita=$CASITA" >> $GITHUB_OUTPUT
          echo "vaultwarden=$VAULTWARDEN" >> $GITHUB_OUTPUT
          echo "valheim-admin=$VALHEIM_ADMIN" >> $GITHUB_OUTPUT
          echo "pc-agent=$PC_AGENT" >> $GITHUB_OUTPUT
          echo "async-http-client=$ASYNC_HTTP_CLIENT" >> $GITHUB_OUTPUT
          echo "nginx=$NGINX" >> $GITHUB_OUTPUT
          echo "compose=$COMPOSE" >> $GITHUB_OUTPUT
          
          # Check if any service changed (pc-agent excluded from Pi deploys)
          if [[ "$DASHBOARD" == "true" ]] || [[ "$AC_SERVICE" == "true" ]] || \
             [[ "$BABY_GIFTS" == "true" ]] || [[ "$PORTFOLIO_MONITOR" == "true" ]] || \
             [[ "$VACACIONES" == "true" ]] || [[ "$CASITA" == "true" ]] || \
             [[ "$VAULTWARDEN" == "true" ]] || [[ "$VALHEIM_ADMIN" == "true" ]] || \
             [[ "$NGINX" == "true" ]] || [[ "$COMPOSE" == "true" ]] || \
             [[ "${{ steps.filter.outputs.infrastructure }}" == "true" ]] || \
             [[ "$FORCE_DEPLOY" == "true" ]]; then
            echo "any-service=true" >> $GITHUB_OUTPUT
          else
            echo "any-service=false" >> $GITHUB_OUTPUT
          fi

      # ── Build matrix for deploy ──
      - name: Build deploy matrix
        id: matrix
        run: |
          SERVICES="["
          FIRST=true
          
          add_service() {
            if [[ "$FIRST" == "true" ]]; then FIRST=false; else SERVICES="$SERVICES,"; fi
            SERVICES="$SERVICES{\"name\":\"$1\",\"image\":\"$2\",\"context\":\"$3\",\"dockerfile\":\"$4\"}"
          }
          
          [[ "${{ steps.changes.outputs.dashboard }}" == "true" ]] && \
            add_service "smart-home-backend" "egnal/smart-home-dashboard" "." "dashboard/Dockerfile"
          [[ "${{ steps.changes.outputs.ac-service }}" == "true" ]] && \
            add_service "ac-service" "egnal/smart-home-ac-service" "." "services/ac-service/Dockerfile"
          [[ "${{ steps.changes.outputs.baby-gifts }}" == "true" ]] && \
            add_service "baby-gifts-service" "egnal/smart-home-baby-gifts" "." "services/baby-gifts-service/Dockerfile"
          [[ "${{ steps.changes.outputs.portfolio-monitor }}" == "true" ]] && \
            add_service "portfolio-monitor" "egnal/smart-home-portfolio-monitor" "." "services/portfolio-monitor/Dockerfile"
          [[ "${{ steps.changes.outputs.vacaciones }}" == "true" ]] && \
            add_service "vacaciones-service" "egnal/smart-home-vacaciones" "./services/vacaciones-service" "Dockerfile"
          [[ "${{ steps.changes.outputs.casita }}" == "true" ]] && \
            add_service "casita-suenos" "egnal/smart-home-casita-suenos" "./services/casita-suenos/fase3-app" "Dockerfile"
          [[ "${{ steps.changes.outputs.vaultwarden }}" == "true" ]] && \
            add_service "vaultwarden" "egnal/smart-home-vaultwarden" "./services/vaultwarden" "Dockerfile"
          [[ "${{ steps.changes.outputs.valheim-admin }}" == "true" ]] && \
            add_service "valheim-admin" "egnal/smart-home-valheim-admin" "." "services/valheim-admin/Dockerfile"
          
          SERVICES="$SERVICES]"
          echo "services=$SERVICES" >> $GITHUB_OUTPUT
          echo "Deploy matrix: $SERVICES"

      # ── Prepare summary ──
      - name: Prepare Summary
        run: |
          echo "## 📋 Prepare Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard | ${{ steps.changes.outputs.dashboard }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AC Service | ${{ steps.changes.outputs.ac-service }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Baby Gifts | ${{ steps.changes.outputs.baby-gifts }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Portfolio Monitor | ${{ steps.changes.outputs.portfolio-monitor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Vacaciones | ${{ steps.changes.outputs.vacaciones }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Casita | ${{ steps.changes.outputs.casita }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Vaultwarden | ${{ steps.changes.outputs.vaultwarden }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Valheim Admin | ${{ steps.changes.outputs.valheim-admin }} |" >> $GITHUB_STEP_SUMMARY
          echo "| nginx | ${{ steps.changes.outputs.nginx }} |" >> $GITHUB_STEP_SUMMARY
          echo "| compose | ${{ steps.changes.outputs.compose }} |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  # Lint & Test - Dashboard
  # ─────────────────────────────────────────────────────────────────────────────
  lint-and-test-dashboard:
    needs: prepare
    if: ${{ needs.prepare.outputs.dashboard == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tools
        run: pip install -r requirements-dev.txt

      - name: Install Hadolint
        run: |
          wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint

      - name: Ruff - Code Quality
        run: |
          ruff check dashboard/src --output-format=github
          ruff format dashboard/src --check --diff

      - name: Bandit - Security Check
        run: bandit -r dashboard/src -ll -ii --format txt

      - name: Hadolint - Dockerfile Check
        run: hadolint dashboard/Dockerfile

      - name: Run Tests
        run: |
          if [[ -d "dashboard/tests" ]] && find dashboard/tests -name "test_*.py" | grep -q .; then
            pip install -r dashboard/requirements.txt --quiet 2>/dev/null || true
            pip install -e libs/smart_home_common --quiet 2>/dev/null || true
            cd dashboard && PYTHONPATH=src python -m pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-fail-under=80
          else
            echo "⏭️ No tests found"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
