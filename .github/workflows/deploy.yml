# ═══════════════════════════════════════════════════════════════════════════════
# Smart Home - Deploy to Raspberry Pi
# Manual deployment workflow - builds, pushes to Docker Hub, deploys to Pi
# ═══════════════════════════════════════════════════════════════════════════════

name: Deploy

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        options:
          - all
          - dashboard
          - ac-service
          - baby-gifts-service
          - vacaciones-service
          - casita-suenos

env:
  DOCKERHUB_USERNAME: egnal

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build and Push to Docker Hub
  # ─────────────────────────────────────────────────────────────────────────────
  build-dashboard:
    if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'dashboard' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: egnal
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          push: true
          tags: |
            egnal/smart-home-dashboard:latest
            egnal/smart-home-dashboard:${{ github.sha }}
          platforms: linux/arm64

  build-ac-service:
    if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'ac-service' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: egnal
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push ac-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/ac-service
          push: true
          tags: |
            egnal/smart-home-ac-service:latest
            egnal/smart-home-ac-service:${{ github.sha }}
          platforms: linux/arm64

  build-baby-gifts:
    if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'baby-gifts-service' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: egnal
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push baby-gifts
        uses: docker/build-push-action@v5
        with:
          context: ./services/baby-gifts-service
          push: true
          tags: |
            egnal/smart-home-baby-gifts:latest
            egnal/smart-home-baby-gifts:${{ github.sha }}
          platforms: linux/arm64

  build-vacaciones:
    if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'vacaciones-service' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: egnal
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push vacaciones
        uses: docker/build-push-action@v5
        with:
          context: ./services/vacaciones-service
          push: true
          tags: |
            egnal/smart-home-vacaciones:latest
            egnal/smart-home-vacaciones:${{ github.sha }}
          platforms: linux/arm64

  build-casita-suenos:
    if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'casita-suenos' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: egnal
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push casita-suenos
        uses: docker/build-push-action@v5
        with:
          context: ./services/casita-suenos/fase3-app
          push: true
          tags: |
            egnal/smart-home-casita-suenos:latest
            egnal/smart-home-casita-suenos:${{ github.sha }}
          platforms: linux/arm64

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy to Raspberry Pi
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    needs: [build-dashboard, build-ac-service, build-baby-gifts, build-vacaciones, build-casita-suenos]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Pi via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_SSH_HOST }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          script: |
            cd ~/smart-home-prod
            
            SERVICE="${{ github.event.inputs.service }}"
            
            echo "=== Deploying $SERVICE ==="
            
            if [ "$SERVICE" = "all" ]; then
              docker compose pull
              docker compose up -d
            else
              docker compose pull $SERVICE 2>/dev/null || docker pull egnal/smart-home-${SERVICE}:latest
              docker compose up -d
            fi
            
            echo "=== Deploy complete ==="
            docker ps --format "table {{.Names}}\t{{.Status}}" | head -15
