# ═══════════════════════════════════════════════════════════════════════════════
# Smart Home - Production Docker Compose (Raspberry Pi)
# Uses pre-built images from Docker Hub instead of local builds
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Core Infrastructure (unchanged - use official images)
  # ─────────────────────────────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    mem_limit: 16m
    memswap_limit: 16m
    ports:
      - 1883:1883
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log
    networks:
      - smart-home

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    depends_on:
      - mosquitto
    expose:
      - 8081
    volumes:
      - ./data/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    environment:
      - TZ=Europe/Madrid
    networks:
      - smart-home

  nginx:
    image: nginx:alpine
    container_name: nginx-reverse-proxy
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    depends_on:
      - smart-home-backend
      - zigbee2mqtt
    ports:
      - 80:80
      - 8443:443
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
      - ./data/nginx/logs:/var/log/nginx
    networks:
      - smart-home

  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    mem_limit: 32m
    memswap_limit: 32m
    environment:
      CONTAINERS: 1
      POST: 1
      IMAGES: 0
      INFO: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      SERVICES: 0
      SWARM: 0
      TASKS: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SESSION: 0
      SYSTEM: 0
      AUTH: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - 2375
    networks:
      - smart-home

  # ─────────────────────────────────────────────────────────────────────────────
  # Application Services (use Docker Hub images)
  # ─────────────────────────────────────────────────────────────────────────────
  smart-home-backend:
    image: egnal/smart-home-dashboard:latest
    container_name: smart-home-backend
    restart: unless-stopped
    mem_limit: 96m
    memswap_limit: 96m
    expose:
      - 8080
    volumes:
      - ./data/backend:/app/data
      - ./infrastructure/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    env_file:
      - .env
    environment:
      - TZ=Europe/Madrid
    networks:
      - smart-home

  ac-service:
    image: egnal/smart-home-ac-service:latest
    container_name: ac-service
    restart: unless-stopped
    mem_limit: 96m
    memswap_limit: 96m
    expose:
      - 8002
    volumes:
      - ./data/ac-service:/app/data
    env_file:
      - .env
    environment:
      - TZ=Europe/Madrid
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    networks:
      - smart-home
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

  baby-gifts-service:
    image: egnal/smart-home-baby-gifts:latest
    container_name: baby-gifts-service
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    expose:
      - 8004
    volumes:
      - ./data/baby-gifts-service:/app/data
    environment:
      - TZ=Europe/Madrid
    networks:
      - smart-home

  vacaciones-service:
    image: egnal/smart-home-vacaciones:latest
    container_name: vacaciones-service
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    expose:
      - 8003
    volumes:
      - ./data/vacaciones-service:/app/data
    environment:
      - TZ=Europe/Madrid
      - VACACIONES_DATA_FILE=/app/data/vacaciones.json
    networks:
      - smart-home
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  casita-suenos:
    image: egnal/smart-home-casita-suenos:latest
    container_name: casita-suenos
    restart: unless-stopped
    mem_limit: 96m
    memswap_limit: 96m
    expose:
      - 8001
    volumes:
      - ./data/casita-suenos:/app/data
    env_file:
      - .env
    environment:
      - TZ=Europe/Madrid
      - CASITA_DATA_DIR=/app/data
    networks:
      - smart-home
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────────────
  # Vaultwarden - Password Manager (wrapper around official image)
  # ─────────────────────────────────────────────────────────────────────────────
  vaultwarden:
    image: egnal/smart-home-vaultwarden:latest
    container_name: vaultwarden
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    expose:
      - 80
      - 3012
    volumes:
      - ./data/vaultwarden:/data
    environment:
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
    networks:
      - smart-home

networks:
  smart-home:
    driver: bridge
