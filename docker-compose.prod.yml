# ═══════════════════════════════════════════════════════════════════════════════
# Smart Home - Production Docker Compose (Raspberry Pi)
# Uses pre-built images from Docker Hub instead of local builds
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Core Infrastructure (unchanged - use official images)
  # ─────────────────────────────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: mosquitto
    restart: on-failure:5
    mem_limit: 16m
    memswap_limit: 16m
    expose:
      - 1883
      - 8883
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infrastructure/mosquitto/acl.conf:/mosquitto/config/acl.conf:ro
      - ./data/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log
      - ./data/mosquitto/certs:/mosquitto/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - smart-home

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: on-failure:5
    mem_limit: 64m
    memswap_limit: 64m
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru
    volumes:
      - ./data/redis:/data
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - smart-home

  zigbee2mqtt:
    # Pin to specific version to avoid unexpected breaking changes from :latest
    image: koenkk/zigbee2mqtt:1.40.2
    container_name: zigbee2mqtt
    restart: on-failure:5
    # Increased from 128m based on 73% usage (93MB)
    mem_limit: 192m
    memswap_limit: 192m
    depends_on:
      - mosquitto
    expose:
      - 8081
    volumes:
      - ./data/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    environment:
      - TZ=Europe/Madrid
    networks:
      - smart-home

  nginx:
    image: nginx:alpine
    container_name: nginx-reverse-proxy
    restart: on-failure:5
    mem_limit: 32m
    memswap_limit: 32m
    depends_on:
      - smart-home-backend
      - zigbee2mqtt
    ports:
      - 80:80
      # Dashboard - bind to localhost only, accessed via Tailscale Funnel
      # Tailscale proxies :443 -> localhost:8443
      - 127.0.0.1:8443:8443
      # AI proxy (Open WebUI) - Tailscale Funnel :8443 -> localhost:8444
      - 127.0.0.1:8444:8444
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/snippets:/etc/nginx/snippets:ro
      - ./infrastructure/nginx/html:/etc/nginx/html:ro
      - ./infrastructure/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
      - ./data/nginx/logs:/var/log/nginx
    networks:
      - smart-home

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker Socket Proxy - Secure access to Docker API for metrics-service
  #
  # WHY: metrics-service needs container stats but should NOT have full Docker
  # control. This proxy exposes only the minimal API surface required.
  #
  # PERMISSIONS (least-privilege):
  #   CONTAINERS=1, POST=1 → list containers + read stats stream
  #   Everything else = 0  → no exec, no delete, no build, no images
  #
  # SECURITY: Socket mounted read-only. Only reachable inside smart-home network.
  # See services/metrics-service/README.md for full documentation.
  # ─────────────────────────────────────────────────────────────────────────────
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: on-failure:5
    # Increased from 32m based on 61% usage (19MB)
    mem_limit: 48m
    memswap_limit: 48m
    environment:
      # metrics-service needs: list containers + stats endpoint
      CONTAINERS: 1
      POST: 1
      # Everything else denied for least-privilege security
      IMAGES: 0
      INFO: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      SERVICES: 0
      SWARM: 0
      TASKS: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SESSION: 0
      SYSTEM: 0
      AUTH: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - 2375
    networks:
      - smart-home

  # ─────────────────────────────────────────────────────────────────────────────
  # Application Services (use Docker Hub images)
  # ─────────────────────────────────────────────────────────────────────────────
  smart-home-backend:
    image: egnal/smart-home-dashboard:latest
    container_name: smart-home-backend
    restart: on-failure:5
    # Increased from 72m based on 65% usage (47MB) - added headroom
    mem_limit: 96m
    memswap_limit: 96m
    expose:
      - 8080
    volumes:
      - ./data/backend:/app/data
      - ./infrastructure/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    env_file:
      - .env
    environment:
      - TZ=Europe/Madrid
      # PC agent config for direct Valheim control (replaces valheim-admin service)
      - PC_AGENT_URL=${PC_AGENT_URL:-http://192.168.1.164:8090}
      - PC_AGENT_TOKEN=${PC_AGENT_TOKEN}
    networks:
      - smart-home

  ac-service:
    image: egnal/smart-home-ac-service:latest
    container_name: ac-service
    restart: on-failure:5
    mem_limit: 80m
    memswap_limit: 80m
    expose:
      - 8002
    volumes:
      - ./data/ac-service:/app/data
    env_file:
      - .env
    environment:
      - TZ=Europe/Madrid
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_TLS_ENABLED=${MQTT_TLS_ENABLED:-false}
      - MQTT_TLS_CA_CERTS=${MQTT_TLS_CA_CERTS:-}
      - MQTT_ALLOW_ANONYMOUS=true
    networks:
      - smart-home
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

  baby-gifts-service:
    image: egnal/smart-home-baby-gifts:latest
    container_name: baby-gifts-service
    restart: on-failure:5
    # Increased from 64m based on 77% usage (49MB)
    mem_limit: 96m
    memswap_limit: 96m
    expose:
      - 8004
    volumes:
      - ./data/baby-gifts-service:/app/data
    env_file:
      - .env
    environment:
      - TZ=Europe/Madrid
    networks:
      - smart-home

  portfolio-monitor:
    image: egnal/smart-home-portfolio-monitor:latest
    container_name: portfolio-monitor
    restart: on-failure:5
    # Increased from 160m: caches for CoinGecko data + OHLC charts need headroom
    mem_limit: 192m
    memswap_limit: 192m
    expose:
      - 8010
    volumes:
      - ./data/portfolio-monitor:/app/data
    env_file:
      - .env
    environment:
      - TZ=Europe/Madrid
      - MONITOR_LANG=es
    networks:
      - smart-home
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

  vacaciones-service:
    image: egnal/smart-home-vacaciones:latest
    container_name: vacaciones-service
    restart: on-failure:5
    # Increased from 64m based on 55% usage (35MB)
    mem_limit: 80m
    memswap_limit: 80m
    expose:
      - 8003
    volumes:
      - ./data/vacaciones-service:/app/data
    environment:
      - TZ=Europe/Madrid
      - VACACIONES_DATA_FILE=/app/data/vacaciones.json
    networks:
      - smart-home
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  casita-suenos:
    image: egnal/smart-home-casita-suenos:latest
    container_name: casita-suenos
    restart: on-failure:5
    # Increased from 128m: scraping + BeautifulSoup HTML parsing + telegram-bot
    # requires ~113MB baseline; 192MB gives 70% headroom for parsing spikes
    mem_limit: 192m
    memswap_limit: 192m
    expose:
      - 8001
    volumes:
      - ./data/casita-suenos:/app/data
    env_file:
      - .env
    environment:
      - TZ=Europe/Madrid
      - CASITA_DATA_DIR=/app/data
    networks:
      - smart-home
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────────────
  # Vaultwarden - Password Manager (wrapper around official image)
  # ─────────────────────────────────────────────────────────────────────────────
  vaultwarden:
    image: egnal/smart-home-vaultwarden:latest
    container_name: vaultwarden
    restart: on-failure:5
    # Increased from 64m based on 81% usage (51MB) - added headroom
    mem_limit: 96m
    memswap_limit: 96m
    expose:
      - 80
      - 3012
    volumes:
      - ./data/vaultwarden:/data
    environment:
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
    networks:
      - smart-home
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/passwords/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────────────
  # Valheim Admin - Web management UI for Valheim server
  # Proxies to pc-agent running on Windows PC (192.168.1.164:8090)
  # ─────────────────────────────────────────────────────────────────────────────
  valheim-admin:
    image: egnal/smart-home-valheim-admin:latest
    container_name: valheim-admin
    restart: on-failure:5
    mem_limit: 72m
    memswap_limit: 72m
    expose:
      - 8080
    env_file:
      - .env
    environment:
      - TZ=Europe/Madrid
      - PC_AGENT_URL=http://192.168.1.164:8090
      # PC_AGENT_TOKEN loaded from .env
    networks:
      - smart-home
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────────────────
  # Metrics Service - Pi host / container / health time-series collector
  # Infrastructure service: NOT in APP_CATALOGUE, NOT in CONTROLLABLE_CONTAINERS,
  # NOT exposed through nginx. Reached only via the backend proxy /api/metrics/*.
  # /proc and /sys are bind-mounted read-only so the host sampler reads the Pi
  # host, not the container cgroup.
  # ─────────────────────────────────────────────────────────────────────────────
  metrics-service:
    image: egnal/smart-home-metrics-service:latest
    container_name: metrics-service
    restart: on-failure:5
    mem_limit: 64m
    memswap_limit: 64m
    expose:
      - 8011
    volumes:
      - ./data/metrics-service:/app/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      - TZ=Europe/Madrid
      - METRICS_PROC_STAT=/host/proc/stat
      - METRICS_PROC_MEMINFO=/host/proc/meminfo
      - METRICS_PROC_LOADAVG=/host/proc/loadavg
      - METRICS_THERMAL_ZONE=/host/sys/class/thermal/thermal_zone0/temp
    # Telegram alerts (Wave 3.3): TelegramNotifier.from_env() reads
    # TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_IDS from .env (same pattern as
    # baby-gifts-service). If unset, alerts still fire + persist but send nothing.
    env_file:
      - .env
    depends_on:
      - smart-home-backend
      - docker-socket-proxy
    networks:
      - smart-home
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────────────
  # Energy Monitor - Shelly EM power/energy time-series collector
  # Infrastructure service: NOT in CONTROLLABLE_CONTAINERS, NOT exposed through
  # nginx. Reached only via the backend proxy /api/energy/*. Polls Shelly EM
  # devices on the LAN (ENERGY_DEVICES) for instantaneous power + cumulative kWh.
  # See docs/designs/energy-monitor-design.md.
  # NOTE: the deploy step must `mkdir -p` + `chown 1000:1000 data/energy-monitor`
  # BEFORE `docker compose up` so the non-root container can create its SQLite DB.
  # ─────────────────────────────────────────────────────────────────────────────
  energy-monitor:
    image: egnal/smart-home-energy-monitor:latest
    container_name: energy-monitor
    restart: on-failure:5
    mem_limit: 64m
    memswap_limit: 64m
    expose:
      - 8012
    volumes:
      - ./data/energy-monitor:/app/data
    environment:
      - TZ=Europe/Madrid
      - ENERGY_DEVICES=${ENERGY_DEVICES:-[]}
    # Telegram alerts: TelegramNotifier.from_env() reads TELEGRAM_BOT_TOKEN /
    # TELEGRAM_CHAT_IDS from .env (same pattern as metrics-service). If unset,
    # alerts still fire + persist but send nothing.
    env_file:
      - .env
    depends_on:
      - smart-home-backend
    networks:
      - smart-home
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8012/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────────────
  # Presence Service - multi-signal household presence detection
  # Fuses router/ARP + BLE (via MQTT) + Zigbee motion (via mosquitto) into a
  # per-person home/away/sleeping state, publishes presence/* to MQTT and drives
  # Telegram arrival/departure notifications. Infrastructure-style service with a
  # future config SPA: NOT exposed through nginx; reached only via the backend
  # proxy /api/presence/*. See docs/designs/presence-service-design.md.
  # NOTE: the deploy step must `mkdir -p` + `chown 1000:1000 data/presence-service`
  # BEFORE `docker compose up` so the non-root container can create its SQLite DB.
  # ─────────────────────────────────────────────────────────────────────────────
  presence-service:
    image: egnal/smart-home-presence-service:latest
    container_name: presence-service
    restart: on-failure:5
    mem_limit: 96m
    memswap_limit: 96m
    expose:
      - 8013
    volumes:
      - ./data/presence-service:/app/data
    environment:
      - TZ=Europe/Madrid
      - PRESENCE_MQTT_BROKER=mosquitto
      - PRESENCE_ROUTER_MODE=${PRESENCE_ROUTER_MODE:-arpsweep}
      - PRESENCE_ROUTER_HOST=${PRESENCE_ROUTER_HOST:-192.168.1.1}
      - PRESENCE_PEOPLE_SEED=${PRESENCE_PEOPLE_SEED:-}
    # Telegram arrival/departure notifications: TelegramNotifier.from_env() reads
    # TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_IDS from .env (same pattern as
    # metrics-service / energy-monitor). If unset, transitions still persist +
    # publish but send nothing.
    env_file:
      - .env
    depends_on:
      - smart-home-backend
      - mosquitto
    networks:
      - smart-home

  # ─────────────────────────────────────────────────────────────────────────────
  # Calendar Service — Google Calendar integration with Telegram reminders
  # NOTE: the deploy step must `mkdir -p` + `chown 1000:1000 data/calendar-service`
  # BEFORE `docker compose up` so the non-root container can create its SQLite DB.
  # ─────────────────────────────────────────────────────────────────────────────
  calendar-service:
    image: egnal/smart-home-calendar-service:latest
    container_name: calendar-service
    restart: on-failure:5
    mem_limit: 96m
    memswap_limit: 96m
    expose:
      - 8014
    volumes:
      - ./data/calendar-service:/app/data
    environment:
      - TZ=Europe/Madrid
      - CALENDAR_SYNC_INTERVAL=${CALENDAR_SYNC_INTERVAL:-300}
    # Google OAuth credentials and Telegram for reminders: GOOGLE_CLIENT_ID,
    # GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN, TELEGRAM_BOT_TOKEN,
    # TELEGRAM_CHAT_IDS from .env.
    env_file:
      - .env
    depends_on:
      - smart-home-backend
    networks:
      - smart-home
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8014/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  smart-home:
    driver: bridge
