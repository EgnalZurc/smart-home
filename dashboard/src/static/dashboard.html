<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cuchi Casa</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="/static/tailwind.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        /* Service card */
        .app-card {
            background: linear-gradient(145deg, rgba(30,41,59,0.8), rgba(15,23,42,0.9));
            border: 1px solid rgba(51,65,85,0.5);
            backdrop-filter: blur(10px);
            transition: transform 0.15s ease, border-color 0.2s ease, filter 0.3s ease, opacity 0.3s ease;
            text-decoration: none; display: block;
            border-radius: 16px;
        }
        .app-card.offline {
            filter: grayscale(1);
            opacity: 0.6;
        }
        .app-card.offline:hover {
            filter: grayscale(0.7);
            opacity: 0.75;
        }
        .app-card:active { transform: scale(0.97); }
        @media (hover:hover) { .app-card:hover { border-color: rgba(99,102,241,0.4); transform: translateY(-1px); } }

        /* Stop/start button */
        .svc-btn {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 10px; font-weight: 600;
            padding: 4px 9px; border-radius: 6px; border: 1px solid;
            cursor: pointer; transition: opacity 0.15s, background 0.15s;
            white-space: nowrap; user-select: none; flex-shrink: 0;
            background: none; line-height: 1;
        }
        .svc-btn:active { opacity: 0.7; }
        .svc-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .svc-btn.running  { color:#f87171; border-color:rgba(239,68,68,.4); background:rgba(239,68,68,.08); }
        .svc-btn.running:hover { background:rgba(239,68,68,.15); }
        .svc-btn.stopped  { color:#86efac; border-color:rgba(34,197,94,.4); background:rgba(34,197,94,.08); }
        .svc-btn.stopped:hover { background:rgba(34,197,94,.15); }
        .svc-btn.loading  { color:#94a3b8; border-color:rgba(148,163,184,.3); background:rgba(148,163,184,.05); }

        /* Header icon button */
        .hdr-btn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; border-radius: 8px;
            background: rgba(30,41,59,.5); border: 1px solid rgba(51,65,85,.5);
            cursor: pointer; transition: background .15s, border-color .15s;
            color: #64748b; flex-shrink: 0;
        }
        .hdr-btn:hover { background: rgba(99,102,241,.15); border-color: rgba(99,102,241,.4); color: #a5b4fc; }
        .hdr-btn:active { transform: scale(0.92); }

        /* Modal base */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 9000;
            display: flex; align-items: flex-end; justify-content: center;
            padding: 0 0 env(safe-area-inset-bottom, 0);
            background: rgba(0,0,0,.55);
            backdrop-filter: blur(4px);
            opacity: 0; pointer-events: none;
            transition: opacity .2s ease;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal-panel {
            background: #0f172a;
            border: 1px solid rgba(51,65,85,.6);
            border-bottom: none;
            border-radius: 20px 20px 0 0;
            width: 100%; max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0));
            transform: translateY(100%);
            transition: transform .25s cubic-bezier(.4,0,.2,1);
        }
        .modal-overlay.open .modal-panel { transform: translateY(0); }

        /* drag handle */
        .modal-handle { width: 36px; height: 4px; background: rgba(100,116,139,.4); border-radius: 2px; margin: 0 auto 16px; }

        /* resource rows */
        .res-row { margin-bottom: 14px; }
        .res-row:last-child { margin-bottom: 0; }
        .res-row-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 5px; }
        .res-label { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: .05em; }
        .res-value { font-size: 12px; color: #94a3b8; }
        .res-bar-bg { height: 6px; background: rgba(51,65,85,.5); border-radius: 3px; overflow: hidden; }
        .res-bar { height: 100%; border-radius: 3px; transition: width .5s ease; }
        .res-bar.green  { background: #22c55e; }
        .res-bar.yellow { background: #f59e0b; }
        .res-bar.red    { background: #ef4444; }

        /* temp pill */
        .temp-pill {
            display: inline-block; padding: 2px 10px; border-radius: 99px;
            font-size: 13px; font-weight: 700; letter-spacing: -.01em;
        }
        .temp-pill.green  { background: rgba(34,197,94,.15);  color: #86efac; }
        .temp-pill.yellow { background: rgba(245,158,11,.15); color: #fcd34d; }
        .temp-pill.red    { background: rgba(239,68,68,.15);  color: #fca5a5; }

        /* Core infrastructure bar */
        .core-bar { background: rgba(15,23,42,0.7); border: 1px solid rgba(51,65,85,0.35); border-radius: 14px; }
        .core-item { display: inline-flex; align-items: center; gap: 5px; text-decoration: none; }
        .core-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; vertical-align: middle; animation: pulse 2s infinite; }
        .core-label { font-size: 11px; color: #94a3b8; font-weight: 500; line-height: 1; margin-right: 6px; }
        .core-item:hover .core-label { color: #cbd5e1; }

        .section-label { font-size: 10px; color: #475569; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
        .status-dot { animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .fade-in { animation: fadeIn 0.35s ease; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

        /* Language selector */
        .lang-dropdown { position: relative; }
        .flag-img { width: 24px; height: 16px; object-fit: cover; border-radius: 2px; display: block; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
        .lang-current { padding:4px; border-radius:6px; cursor:pointer; border:2px solid rgba(100,116,139,.3); background:rgba(30,41,59,.4); transition:all .2s; display:flex; align-items:center; justify-content:center; }
        .lang-current:hover { border-color:rgba(59,130,246,.5); background:rgba(59,130,246,.1); transform:scale(1.05); }
        .lang-menu { position:absolute; top:calc(100% + 8px); right:0; background:rgba(30,41,59,.95); border:1px solid rgba(100,116,139,.4); border-radius:8px; padding:4px; display:none; flex-direction:column; gap:4px; box-shadow:0 4px 12px rgba(0,0,0,.3); backdrop-filter:blur(10px); z-index:1000; min-width:50px; }
        .lang-menu.open { display:flex; }
        .lang-option { padding:4px; border-radius:4px; cursor:pointer; transition:all .2s; display:flex; align-items:center; justify-content:center; border:2px solid transparent; }
        .lang-option:hover { background:rgba(59,130,246,.2); border-color:rgba(59,130,246,.4); }
        .lang-option.active { background:rgba(59,130,246,.15); border-color:rgba(59,130,246,.5); }

        /* Loading overlay */
        #loading-overlay { position:fixed; inset:0; z-index:99999; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0f172a; transition:opacity .35s ease; }
        #loading-overlay.done { opacity:0; pointer-events:none; }
        #dash-content { opacity:0; transition:opacity .35s ease; }
        #dash-content.visible { opacity:1; }
        .spinner { width:32px; height:32px; border:3px solid rgba(255,255,255,.1); border-top-color:rgba(255,255,255,.7); border-radius:50%; animation:spin .8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* User dropdown */
        .user-dropdown { position:relative; }
        .user-chip { display:flex; align-items:center; gap:6px; background:rgba(30,41,59,.6); border:1px solid rgba(51,65,85,.5); border-radius:20px; padding:3px 10px 3px 4px; font-size:0.75rem; color:#94a3b8; line-height:1; cursor:pointer; user-select:none; transition:border-color .2s, background .2s; }
        .user-chip:hover { border-color:rgba(99,102,241,.4); background:rgba(30,41,59,.9); }
        .user-avatar { width:22px; height:22px; background:linear-gradient(135deg,rgba(79,70,229,.5),rgba(99,102,241,.3)); border:1px solid rgba(99,102,241,.4); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.6875rem; font-weight:700; color:#a5b4fc; text-transform:uppercase; flex-shrink:0; }
        .user-menu { position:absolute; top:calc(100% + 8px); right:0; background:rgba(15,23,42,.97); border:1px solid rgba(51,65,85,.6); border-radius:10px; padding:4px; min-width:130px; box-shadow:0 8px 24px rgba(0,0,0,.4); backdrop-filter:blur(12px); display:none; z-index:1000; }
        .user-menu.open { display:block; }
        .user-menu-item { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:7px; font-size:0.8125rem; color:#94a3b8; cursor:pointer; transition:background .15s, color .15s; border:none; background:none; width:100%; text-align:left; }
        .user-menu-item:hover { background:rgba(239,68,68,.1); color:#f87171; }

        /* PC mode buttons */
        .pc-mode-btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 4px;
            font-size: 10px; font-weight: 600;
            padding: 6px 12px; border-radius: 8px;
            border: 2px solid rgba(51,65,85,.5);
            background: rgba(30,41,59,.5);
            color: #94a3b8; cursor: pointer;
            transition: all .15s ease;
            white-space: nowrap;
            min-width: 70px;
        }
        .pc-mode-btn:hover { background: rgba(99,102,241,.15); border-color: rgba(99,102,241,.4); color: #a5b4fc; }
        .pc-mode-btn:active { transform: scale(0.95); }
        .pc-mode-btn.active { background: rgba(34,197,94,.15); border-color: rgba(34,197,94,.6); color: #86efac; box-shadow: 0 0 8px rgba(34,197,94,.3); }
        .pc-mode-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* AI Section - subtle style matching core-bar */
        .ai-card {
            background: rgba(15,23,42,0.7);
            border: 1px solid rgba(51,65,85,0.35);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .ai-card:hover {
            border-color: rgba(124,58,237,0.4);
            background: rgba(15,23,42,0.85);
        }
        .ai-card:active { transform: scale(0.98); }
        .ai-card.offline {
            filter: grayscale(0.7);
            opacity: 0.55;
        }
        .ai-card.offline:hover {
            filter: grayscale(0.4);
            opacity: 0.7;
        }
        .ai-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, rgba(124,58,237,0.2), rgba(59,130,246,0.15));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .ai-icon svg {
            width: 18px;
            height: 18px;
            color: #a78bfa;
        }
        .ai-content { flex: 1; min-width: 0; }
        .ai-title {
            font-size: 0.8125rem;
            font-weight: 600;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ai-status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        .ai-desc {
            font-size: 0.6875rem;
            color: #64748b;
            margin-top: 2px;
        }
        .ai-arrow {
            color: #475569;
            font-size: 1.1rem;
            transition: transform 0.15s, color 0.15s;
        }
        .ai-card:hover .ai-arrow {
            transform: translateX(2px);
            color: #a78bfa;
        }

        /* Resource selector tabs */
        .res-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .res-tab {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(51,65,85,.5);
            background: rgba(30,41,59,.3);
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
        }
        .res-tab:hover { background: rgba(51,65,85,.5); color: #94a3b8; }
        .res-tab.active { background: rgba(99,102,241,.15); border-color: rgba(99,102,241,.5); color: #a5b4fc; }
        .res-tab .tab-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* Admin modal tabs */
        .admin-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(51,65,85,.4);
            padding-bottom: 8px;
        }
        .admin-tab {
            padding: 8px 16px;
            border-radius: 8px 8px 0 0;
            background: transparent;
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            border: none;
        }
        .admin-tab:hover { background: rgba(51,65,85,.3); color: #94a3b8; }
        .admin-tab.active { background: rgba(99,102,241,.15); color: #a5b4fc; }

        /* Admin table */
        .admin-table {
            width: 100%;
            font-size: 13px;
        }
        .admin-table th {
            text-align: left;
            padding: 8px 12px;
            color: #64748b;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .05em;
            border-bottom: 1px solid rgba(51,65,85,.4);
        }
        .admin-table td {
            padding: 10px 12px;
            color: #e2e8f0;
            border-bottom: 1px solid rgba(51,65,85,.2);
        }
        .admin-table tr:last-child td { border-bottom: none; }
        .admin-table tr:hover td { background: rgba(51,65,85,.15); }

        /* Profile select */
        .profile-select {
            background: rgba(30,41,59,.8);
            border: 1px solid rgba(51,65,85,.5);
            border-radius: 6px;
            color: #e2e8f0;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
        }
        .profile-select:focus { outline: none; border-color: rgba(99,102,241,.5); }

        /* Profile badge */
        .profile-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .profile-badge.super { background: rgba(239,68,68,.15); color: #fca5a5; }
        .profile-badge.familia-all { background: rgba(124,58,237,.15); color: #c4b5fd; }
        .profile-badge.familia-principal { background: rgba(34,197,94,.15); color: #86efac; }
        .profile-badge.gamer { background: rgba(59,130,246,.15); color: #93c5fd; }

        /* Profile info cards */
        .profile-card {
            background: rgba(30,41,59,.5);
            border: 1px solid rgba(51,65,85,.4);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .profile-card:last-child { margin-bottom: 0; }
        .profile-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .profile-card-title {
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
        }
        .profile-card-desc {
            font-size: 11px;
            color: #64748b;
            line-height: 1.4;
        }
        .profile-card-perms {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .perm-chip {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(51,65,85,.5);
            color: #94a3b8;
        }
        .perm-chip.yes { background: rgba(34,197,94,.15); color: #86efac; }
        .perm-chip.no { background: rgba(239,68,68,.1); color: #fca5a5; }
    </style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen overscroll-none">

<!-- Resources modal -->
<div id="res-modal" class="modal-overlay" onclick="closeResModal(event)">
  <div class="modal-panel" id="res-panel">
    <div class="modal-handle"></div>
    <div class="flex items-center justify-between mb-4">
      <span id="res-title" class="text-sm font-semibold text-slate-200">Recursos del sistema</span>
      <span id="res-timestamp" class="text-[10px] text-slate-600">—</span>
    </div>
    <!-- Resource source tabs (Pi / EgnalPC) -->
    <div class="res-tabs" id="res-tabs">
      <button class="res-tab active" data-source="pi" onclick="switchResSource('pi')">
        <span class="tab-dot bg-slate-600" id="pi-tab-dot"></span>
        <span>Raspberry Pi</span>
      </button>
      <button class="res-tab" data-source="pc" onclick="switchResSource('pc')">
        <span class="tab-dot bg-slate-600" id="pc-tab-dot"></span>
        <span>Egnal PC</span>
      </button>
    </div>
    <div id="res-body">
      <div class="text-center text-slate-600 py-4 text-sm">Cargando…</div>
    </div>
  </div>
</div>

<!-- Admin modal (users & profiles) -->
<div id="admin-modal" class="modal-overlay" onclick="closeAdminModal(event)">
  <div class="modal-panel" id="admin-panel" style="max-width: 540px;">
    <div class="modal-handle"></div>
    <div class="flex items-center justify-between mb-4">
      <span class="text-sm font-semibold text-slate-200">Administración</span>
    </div>
    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="users" onclick="switchAdminTab('users')">Usuarios</button>
      <button class="admin-tab" data-tab="profiles" onclick="switchAdminTab('profiles')">Perfiles</button>
    </div>
    <div id="admin-body">
      <div class="text-center text-slate-600 py-4 text-sm">Cargando…</div>
    </div>
  </div>
</div>

<div id="dash-content">
<div class="max-w-md mx-auto px-4 pt-7 pb-12 fade-in">

    <!-- Header -->
    <header class="flex items-center justify-between mb-8">
        <h1 id="title" class="text-xl font-bold tracking-tight">Cuchi Casa</h1>
        <div class="flex items-center gap-2">
            <!-- Infrastructure button (SUPER only) -->
            <button id="infra-btn" class="hdr-btn" onclick="toggleInfraDropdown()" style="display:none" title="Infraestructura">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                </svg>
            </button>
            <!-- Infrastructure dropdown -->
            <div id="infra-dropdown" class="absolute top-14 right-4 bg-[rgba(15,23,42,.97)] border border-slate-700 rounded-xl p-3 shadow-xl z-50" style="display:none; min-width: 180px;">
                <p class="text-[10px] text-slate-500 uppercase tracking-wider mb-2 px-1">Infraestructura</p>
                <div id="infra-items" class="space-y-1"></div>
            </div>
            <!-- Resources button (SUPER only) -->
            <button id="res-btn" class="hdr-btn" onclick="openResModal()" style="display:none" title="Recursos del sistema">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/>
                    <line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/>
                    <line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/>
                    <line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/>
                    <line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/>
                </svg>
            </button>
            <!-- Admin button (SUPER only) -->
            <button id="admin-btn" class="hdr-btn" onclick="openAdminModal()" style="display:none" title="Administración">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
            </button>
            <!-- User dropdown -->
            <div class="user-dropdown" id="user-dropdown" style="display:none">
                <div class="user-chip" id="user-chip" onclick="toggleUserMenu()">
                    <div class="user-avatar" id="user-avatar">?</div>
                    <span id="user-name">—</span>
                </div>
                <div class="user-menu" id="user-menu">
                    <form method="post" action="/api/auth/logout">
                        <button type="submit" class="user-menu-item">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                            <span id="logout-text">Salir</span>
                        </button>
                    </form>
                </div>
            </div>
            <!-- Language selector -->
            <div class="lang-dropdown">
                <div class="lang-current" onclick="toggleLang()" id="lang-btn">
                    <img id="current-flag" src="/static/flags/es.svg" alt="Language" class="flag-img">
                </div>
                <div class="lang-menu" id="lang-menu">
                    <div class="lang-option" onclick="setLang('en')" data-lang="en" title="English">

// Language
const COOKIE = 'locale';
function getLang() { const m = document.cookie.match(/(?:^|;\s*)locale=([^;]+)/); return (m && T[m[1]]) ? m[1] : 'es'; }

function t(key) { return T[currentLang][key] || T.en[key] || key; }

// PC Control
let currentPcMode = null;
let pcOnline = false;

async function loadPcStatus() {
    try {
        const [statusRes, modeRes] = await Promise.all([
            fetch('/api/pc/status').then(r => r.json()),
            fetch('/api/pc/mode').then(r => r.json())
        ]);
        
        pcOnline = statusRes.online === true;
        
        // Update PC tab dot in resources modal
        const pcTabDot = document.getElementById('pc-tab-dot');
        if (pcTabDot) {
            pcTabDot.className = `tab-dot ${pcOnline ? 'bg-green-500' : 'bg-red-400'}`;
        }
        
        if (pcOnline && modeRes.mode) {
            // Check if mode is one of the known ones
            const knownModes = ['balanced', 'gaming', 'servidor'];
            currentPcMode = knownModes.includes(modeRes.mode) ? modeRes.mode : 'custom';
        } else {
            currentPcMode = null;
        }
    } catch {
        pcOnline = false;
        currentPcMode = null;
        const pcTabDot = document.getElementById('pc-tab-dot');
        if (pcTabDot) pcTabDot.className = 'tab-dot bg-red-400';
    }
}

// Resources modal
let _resInterval = null;
let currentResSource = 'pi';
let piOnline = true;

function _barColor(pct) {
    if (pct < 70) return 'green';
    if (pct < 85) return 'yellow';
    return 'red';
}

function _tempColor(c) {
    if (c < 60) return 'green';
    if (c < 75) return 'yellow';
    return 'red';
}

function _bar(pct, color) {
    return `<div class="res-bar-bg"><div class="res-bar ${color}" style="width:${Math.min(pct,100)}%"></div></div>`;
}

function switchResSource(source) {
    currentResSource = source;
    document.querySelectorAll('.res-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.source === source);
    });
    fetchAndRenderResources();
}

function renderPiResources(d) {
    if (!d) return;
    const body = document.getElementById('res-body');
    const ts   = document.getElementById('res-timestamp');
    ts.textContent = new Date().toLocaleTimeString();

    const ramPct  = d.ram?.percent  ?? 0;
    const swapPct = d.swap?.percent ?? 0;
    const cpuPct  = d.cpu?.percent  ?? 0;
    const diskPct = d.disk?.percent ?? 0;
    const tempC   = d.temp?.celsius ?? 0;

    body.innerHTML = `
      <div class="res-row">
        <div class="res-row-header">
          <span class="res-label">${t('res_ram')}</span>
          <span class="res-value">${d.ram?.used_mb ?? '—'} / ${d.ram?.total_mb ?? '—'} MB · <b>${ramPct}%</b>${d.ram?.cache_mb ? ` <span style="opacity:.5;font-size:.85em">+${d.ram.cache_mb}MB cache</span>` : ''}</span>
        </div>
        ${_bar(ramPct, _barColor(ramPct))}
      </div>
      <div class="res-row">
        <div class="res-row-header">
          <span class="res-label">${t('res_swap')}</span>
          <span class="res-value">${d.swap?.used_mb ?? '—'} / ${d.swap?.total_mb ?? '—'} MB · <b>${swapPct}%</b></span>
        </div>
        ${_bar(swapPct, _barColor(swapPct))}
      </div>
      <div class="res-row">
        <div class="res-row-header">
          <span class="res-label">${t('res_cpu')}</span>
          <span class="res-value"><b>${cpuPct}%</b></span>
        </div>
        ${_bar(cpuPct, _barColor(cpuPct))}
      </div>
      <div class="res-row">
        <div class="res-row-header">
          <span class="res-label">${t('res_disk')} (/)</span>
          <span class="res-value">${d.disk?.used_gb ?? '—'} / ${d.disk?.total_gb ?? '—'} GB · <b>${diskPct}%</b></span>
        </div>
        ${_bar(diskPct, _barColor(diskPct))}
      </div>
      <div class="res-row" style="margin-bottom:0">
        <div class="res-row-header">
          <span class="res-label">${t('res_temp')}</span>
          <span class="temp-pill ${_tempColor(tempC)}">${tempC} °C</span>
        </div>
      </div>
    `;
    
    piOnline = true;
    const piTabDot = document.getElementById('pi-tab-dot');
    if (piTabDot) piTabDot.className = 'tab-dot bg-green-500';
}

function renderPcResources() {
    const body = document.getElementById('res-body');
    const ts   = document.getElementById('res-timestamp');
    ts.textContent = new Date().toLocaleTimeString();

    if (!pcOnline) {
        body.innerHTML = `
            <div class="text-center py-8">
                <div class="w-12 h-12 rounded-full bg-red-500/20 flex items-center justify-center mx-auto mb-3">
                    <span class="w-3 h-3 rounded-full bg-red-400"></span>
                </div>
                <p class="text-slate-400 text-sm mb-1">Egnal PC</p>
                <p class="text-red-400 font-semibold">${t('pc_offline')}</p>
            </div>
        `;
        return;
    }

    // PC online - show mode selector with visual indicators
    const modes = ['balanced', 'gaming', 'servidor'];
    const modeIcons = { balanced: '⚡', gaming: '🎮', servidor: '🖥️' };
    
    body.innerHTML = `
        <div class="text-center py-4">
            <div class="flex items-center justify-center gap-2 mb-6">
                <span class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></span>
                <span class="text-green-400 font-semibold">${t('pc_online')}</span>
            </div>
            <p class="text-xs text-slate-500 uppercase tracking-wider mb-4">Perfil de energía</p>
            <div class="flex justify-center gap-3" id="pc-mode-btns">
                ${modes.map(mode => `
                    <button class="pc-mode-btn ${currentPcMode === mode ? 'active' : ''}" 
                            data-mode="${mode}" 
                            onclick="setPcMode('${mode}')">
                        <span>${modeIcons[mode]}</span>
                        <span>${mode.charAt(0).toUpperCase() + mode.slice(1)}</span>
                    </button>
                `).join('')}
            </div>
            ${currentPcMode === 'custom' ? `
                <p class="text-xs text-amber-400 mt-4">⚠️ Perfil personalizado activo</p>
            ` : ''}
        </div>
    `;
}

async function fetchAndRenderResources() {
    if (currentResSource === 'pi') {
        try {
            const r = await fetch('/api/system/stats');
            if (!r.ok) throw new Error('HTTP ' + r.status);
            renderPiResources(await r.json());
        } catch (e) {
            piOnline = false;
            const piTabDot = document.getElementById('pi-tab-dot');
            if (piTabDot) piTabDot.className = 'tab-dot bg-red-400';
            document.getElementById('res-body').innerHTML =
                `<p class="text-center text-red-400 text-sm py-4">Error: ${e.message}</p>`;
        }
    } else {
        renderPcResources();
    }
}

async function setPcMode(mode) {
    if (!isSuper()) return;
    
    // Disable all buttons during change
    document.querySelectorAll('.pc-mode-btn').forEach(btn => btn.disabled = true);
    
    try {
        const r = await fetch(`/api/pc/mode/${mode}`, { method: 'POST' });
        if (r.ok) {
            currentPcMode = mode;
        }
    } catch {}
    
    // Re-render PC resources to update button states
    await loadPcStatus();
    if (currentResSource === 'pc') {
        renderPcResources();
    }
}

function openResModal() {
    document.getElementById('res-modal').classList.add('open');
    currentResSource = 'pi'; // Always start with Pi
    document.querySelectorAll('.res-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.source === 'pi');
    });
    fetchAndRenderResources();
    _resInterval = setInterval(fetchAndRenderResources, 5000);
}

function closeResModal(e) {
    if (e && document.getElementById('res-panel').contains(e.target)) return;
    document.getElementById('res-modal').classList.remove('open');
    clearInterval(_resInterval);
    _resInterval = null;
}

// Admin modal
let adminUsers = [];
let adminProfiles = {};
let currentAdminTab = 'users';

async function loadAdminData() {
    try {
        const [usersRes, profilesRes] = await Promise.all([
            fetch('/api/auth/admin/users').then(r => r.json()),
            fetch('/api/auth/admin/profiles').then(r => r.json())
        ]);
        adminUsers = usersRes;
        adminProfiles = profilesRes;
    } catch (e) {
        console.error('Failed to load admin data:', e);
    }
}

function switchAdminTab(tab) {
    currentAdminTab = tab;
    document.querySelectorAll('.admin-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
    });
    renderAdminContent();
}

function getProfileBadgeClass(profile) {
    const map = {
        'SUPER': 'super',
        'FAMILIA_ALL': 'familia-all',
        'FAMILIA_PRINCIPAL': 'familia-principal',
        'GAMER': 'gamer'
    };
    return map[profile] || 'familia-principal';
}

function renderAdminContent() {
    const body = document.getElementById('admin-body');
    
    if (currentAdminTab === 'users') {
        const profileOptions = Object.keys(adminProfiles).map(k => 
            `<option value="${k}">${k}</option>`
        ).join('');
        
        body.innerHTML = `
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>Perfil</th>
                    </tr>
                </thead>
                <tbody>
                    ${adminUsers.map(u => `
                        <tr>
                            <td>
                                <div class="flex items-center gap-2">
                                    <div class="w-7 h-7 rounded-full bg-gradient-to-br from-indigo-500/30 to-purple-500/20 border border-indigo-500/30 flex items-center justify-center text-xs font-bold text-indigo-300">
                                        ${u.username.charAt(0).toUpperCase()}
                                    </div>
                                    <span>${u.username}</span>
                                </div>
                            </td>
                            <td>
                                <select class="profile-select" data-username="${u.username}" onchange="changeUserProfile(this)">
                                    ${Object.keys(adminProfiles).map(k => 
                                        `<option value="${k}" ${u.profile === k ? 'selected' : ''}>${k}</option>`
                                    ).join('')}
                                </select>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    } else {
        // Profiles tab
        const profileDescriptions = {
            'SUPER': t('profile_super'),
            'FAMILIA_ALL': t('profile_familia_all'),
            'FAMILIA_PRINCIPAL': t('profile_familia_principal'),
            'GAMER': t('profile_gamer')
        };
        
        body.innerHTML = Object.entries(adminProfiles).map(([key, profile]) => `
            <div class="profile-card">
                <div class="profile-card-header">
                    <span class="profile-card-title">${key}</span>
                    <span class="profile-badge ${getProfileBadgeClass(key)}">${key}</span>
                </div>
                <p class="profile-card-desc">${profileDescriptions[key] || ''}</p>
                <div class="profile-card-perms">
                    <span class="perm-chip">View level: ${profile.can_view_level}</span>
                    <span class="perm-chip">Edit level: ${profile.can_edit_level}</span>
                    <span class="perm-chip ${profile.show_config_apps ? 'yes' : 'no'}">
                        Config apps: ${profile.show_config_apps ? '✓' : '✗'}
                    </span>
                </div>
            </div>
        `).join('');
    }
}

async function changeUserProfile(select) {
    const username = select.dataset.username;
    const profile = select.value;
    
    try {
        const r = await fetch(`/api/auth/admin/users/${username}/profile`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ profile })
        });
        
        if (!r.ok) {
            const err = await r.json();
            alert(`Error: ${err.detail}`);
            // Revert selection
            await loadAdminData();
            renderAdminContent();
        } else {
            // Update local data
            const user = adminUsers.find(u => u.username === username);
            if (user) user.profile = profile;
        }
    } catch (e) {
        alert(`Error: ${e.message}`);
    }
}

async function openAdminModal() {
    document.getElementById('admin-modal').classList.add('open');
    document.getElementById('admin-body').innerHTML = '<div class="text-center text-slate-600 py-4 text-sm">Cargando…</div>';
    await loadAdminData();
    currentAdminTab = 'users';
    document.querySelectorAll('.admin-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === 'users');
    });
    renderAdminContent();
}

function closeAdminModal(e) {
    if (e && document.getElementById('admin-panel').contains(e.target)) return;
    document.getElementById('admin-modal').classList.remove('open');
}

// Close modals on Escape key
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        closeResModal();
        closeAdminModal();
    }
});

                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-0.5">
                        <span class="text-sm font-semibold">${t(app.nameKey)}</span>
                        <span id="status-${app.key}" class="flex items-center gap-1 text-[10px] text-slate-500">
                            <span class="w-1.5 h-1.5 rounded-full bg-slate-600 inline-block"></span><span>—</span>
                        </span>
                    </div>
                    <p class="text-[11px] text-slate-400 truncate">${t(app.descKey)}</p>
                </div>
                ${btnHtml}${(showBtn_ || !app.url) ? '' : '<span class="text-slate-600 ml-1">&rsaquo;</span>'}
            </div>
        </${tag}>`;
    }).join('');
    document.getElementById('services-section').style.display = 'block';
    if (isSuper()) loadContainerStates();
}

// Container control
async function loadContainerStates() {
    try {
        const r = await fetch('/api/system/containers');
        if (!r.ok) return;
        const data = await r.json();
        containerState = {};
        for (const [key, info] of Object.entries(data)) {
            containerState[key] = info.running;
            updateBtn(key, info.running);
        }
    } catch {}
}

function updateBtn(key, running) {
    const btn = document.getElementById('btn-' + key);
    if (!btn) return;
    btn.disabled = false;
    btn.className = running ? 'svc-btn running' : 'svc-btn stopped';
    btn.textContent = running ? '⏹ ' + t('svc_stop') : '▶ ' + t('svc_start');
}
async function toggleService(event, key) {
    event.preventDefault(); event.stopPropagation();
    const btn = document.getElementById('btn-' + key);
    if (!btn || btn.disabled) return;
    const wasRunning = containerState[key];
    btn.disabled = true; btn.className = 'svc-btn loading'; btn.textContent = t('svc_loading');
    try {
        const r = await fetch(`/api/system/containers/${key}/${wasRunning ? 'stop' : 'start'}`, { method: 'POST' });
        if (r.ok) {
            await new Promise(res => setTimeout(res, 1500));
            await loadContainerStates();
            const app = APPS.find(a => a.key === key);
            if (app?.statusUrl) delete statusCache[app.statusUrl];
            await loadStatus();
        } else { updateBtn(key, wasRunning); }
    } catch { updateBtn(key, wasRunning); }
}

// Status polling
const statusCache = {};
async function fetchStatus(url) {
    if (statusCache[url] && (Date.now() - statusCache[url].ts) < 8000) return statusCache[url].data;
    const data = await fetch(url).then(r => r.json());
    statusCache[url] = { data, ts: Date.now() };
    return data;
}
async function loadStatus() {
    // AI card status (if visible - SUPER or FAMILIA_ALL)
    if (currentProfileKey === 'FAMILIA_ALL' || currentProfileKey === 'SUPER') {
        try {
            const data = await fetchStatus('/api/health/ai');
            const dot = document.getElementById('ai-status-dot');
            const card = document.getElementById('ai-card');
            const online = data?.online === true;
            if (dot) dot.className = `ai-status-dot ${online ? 'bg-green-500' : 'bg-red-400'}`;
            if (card) card.classList.toggle('offline', !online);
        } catch {
            const dot = document.getElementById('ai-status-dot');
            const card = document.getElementById('ai-card');
            if (dot) dot.className = 'ai-status-dot bg-red-400';
            if (card) card.classList.add('offline');
        }
    }
    // Infrastructure status
    for (const svc of CORE_SERVICES) {
        const dot = document.getElementById('infra-dot-' + svc.key);
        if (!dot) continue;
        try {
            const data = await fetchStatus(svc.statusUrl);
            dot.className = `w-2 h-2 rounded-full ${svc.getStatus(data) ? 'bg-green-500' : 'bg-red-400'}`;
        } catch { dot.className = 'w-2 h-2 rounded-full bg-red-400'; }
    }
    // App status
    for (const app of APPS) {
        if (!app.statusUrl || !app.getStatus) continue;
        try {
            const data = await fetchStatus(app.statusUrl);
            const el = document.getElementById('status-' + app.key);
            if (!el) continue;
            const isOnline = app.getStatus(data);
            el.querySelector('span:first-child').className = `status-dot w-1.5 h-1.5 rounded-full inline-block ${isOnline ? 'bg-green-500' : 'bg-red-400'}`;
            el.querySelector('span:last-child').textContent = t(isOnline ? 'connected' : 'offline');
            const card = el.closest('.app-card');
            if (card) card.classList.toggle('offline', !isOnline);
        } catch {}
    }
}

// User info
function toggleUserMenu() { document.getElementById('user-menu').classList.toggle('open'); }
document.addEventListener('click', e => {
    const dd = document.getElementById('user-dropdown');
    if (dd && !dd.contains(e.target)) document.getElementById('user-menu')?.classList.remove('open');
});

async function loadUser() {
    try {
        const res = await fetch('/api/auth/me');
        if (!res.ok) return;
        const data = await res.json();
        const username = data.username || '';
        if (!username) return;
        currentProfile = data.profile_data || null;
        currentProfileKey = data.profile || null;
        document.getElementById('user-name').textContent   = username;
        document.getElementById('user-avatar').textContent = username.charAt(0).toUpperCase();
        document.getElementById('user-dropdown').style.display = 'block';
        
        // Show SUPER-only buttons
        if (isSuper()) {
            document.getElementById('res-btn').style.display = 'flex';
            document.getElementById('admin-btn').style.display = 'flex';
        }
        
        // Show AI section for SUPER or FAMILIA_ALL profiles
        if (currentProfileKey === 'FAMILIA_ALL' || currentProfileKey === 'SUPER') {
            document.getElementById('ai-section').style.display = 'block';
        }
        
        APPS = (data.apps || [])
            .filter(p => p.key !== 'zigbee')
            .map(p => ({ key: p.key, ...APP_CATALOGUE[p.key] }))
            .filter(a => a);
        
        renderInfra();
        renderApps();
        loadStatus();
    } catch {}
}

// Init
(async function init() {
    applyLang();
    try {
        await Promise.race([ loadUser(), new Promise(r => setTimeout(r, 5000)) ]);
    } catch {}
    const overlay = document.getElementById('loading-overlay');
    const content  = document.getElementById('dash-content');
    content.classList.add('visible');
    overlay.classList.add('done');
    setTimeout(() => { overlay.style.display = 'none'; }, 400);
    setInterval(loadStatus, 10000);
    setInterval(() => { if (isSuper()) loadContainerStates(); }, 30000);
    // PC status polling (for resources modal)
    loadPcStatus();
    setInterval(loadPcStatus, 30000);
})();
</script>
