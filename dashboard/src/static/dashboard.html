<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cuchi Casa</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="/static/tailwind.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        /* Service card */
        .app-card {
            background: linear-gradient(145deg, rgba(30,41,59,0.8), rgba(15,23,42,0.9));
            border: 1px solid rgba(51,65,85,0.5);
            backdrop-filter: blur(10px);
            transition: transform 0.15s ease, border-color 0.2s ease, filter 0.3s ease, opacity 0.3s ease;
            text-decoration: none; display: block;
            border-radius: 16px;
        }
        .app-card.offline { filter: grayscale(1); opacity: 0.6; }
        .app-card.offline:hover { filter: grayscale(0.7); opacity: 0.75; }
        .app-card:active { transform: scale(0.97); }
        @media (hover:hover) { .app-card:hover { border-color: rgba(99,102,241,0.4); transform: translateY(-1px); } }

        /* Stop/start button */
        .svc-btn {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 10px; font-weight: 600;
            padding: 4px 9px; border-radius: 6px; border: 1px solid;
            cursor: pointer; transition: opacity 0.15s, background 0.15s;
            white-space: nowrap; user-select: none; flex-shrink: 0;
            background: none; line-height: 1;
        }
        .svc-btn:active { opacity: 0.7; }
        .svc-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .svc-btn.running  { color:#f87171; border-color:rgba(239,68,68,.4); background:rgba(239,68,68,.08); }
        .svc-btn.running:hover { background:rgba(239,68,68,.15); }
        .svc-btn.stopped  { color:#86efac; border-color:rgba(34,197,94,.4); background:rgba(34,197,94,.08); }
        .svc-btn.stopped:hover { background:rgba(34,197,94,.15); }
        .svc-btn.loading  { color:#94a3b8; border-color:rgba(148,163,184,.3); background:rgba(148,163,184,.05); }

        /* Header icon button */
        .hdr-btn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; border-radius: 8px;
            background: rgba(30,41,59,.5); border: 1px solid rgba(51,65,85,.5);
            cursor: pointer; transition: background .15s, border-color .15s;
            color: #64748b; flex-shrink: 0;
        }
        .hdr-btn:hover { background: rgba(99,102,241,.15); border-color: rgba(99,102,241,.4); color: #a5b4fc; }
        .hdr-btn:active { transform: scale(0.92); }

        /* Modal base */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 9000;
            display: flex; align-items: flex-end; justify-content: center;
            padding: 0 0 env(safe-area-inset-bottom, 0);
            background: rgba(0,0,0,.55);
            backdrop-filter: blur(4px);
            opacity: 0; pointer-events: none;
            transition: opacity .2s ease;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal-panel {
            background: #0f172a;
            border: 1px solid rgba(51,65,85,.6);
            border-bottom: none;
            border-radius: 20px 20px 0 0;
            width: 100%; max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0));
            transform: translateY(100%);
            transition: transform .25s cubic-bezier(.4,0,.2,1);
        }
        .modal-overlay.open .modal-panel { transform: translateY(0); }
        .modal-handle { width: 36px; height: 4px; background: rgba(100,116,139,.4); border-radius: 2px; margin: 0 auto 16px; }

        /* resource rows */
        .res-row { margin-bottom: 14px; }
        .res-row:last-child { margin-bottom: 0; }
        .res-row-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 5px; }
        .res-label { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: .05em; }
        .res-value { font-size: 12px; color: #94a3b8; }
        .res-bar-bg { height: 6px; background: rgba(51,65,85,.5); border-radius: 3px; overflow: hidden; }
        .res-bar { height: 100%; border-radius: 3px; transition: width .5s ease; }
        .res-bar.green  { background: #22c55e; }
        .res-bar.yellow { background: #f59e0b; }
        .res-bar.red    { background: #ef4444; }

        /* temp pill */
        .temp-pill {
            display: inline-block; padding: 2px 10px; border-radius: 99px;
            font-size: 13px; font-weight: 700; letter-spacing: -.01em;
        }
        .temp-pill.green  { background: rgba(34,197,94,.15);  color: #86efac; }
        .temp-pill.yellow { background: rgba(245,158,11,.15); color: #fcd34d; }
        .temp-pill.red    { background: rgba(239,68,68,.15);  color: #fca5a5; }

        .section-label { font-size: 10px; color: #475569; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
        .status-dot { animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .fade-in { animation: fadeIn 0.35s ease; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

        /* Language selector */
        .lang-dropdown { position: relative; }
        .flag-img { width: 24px; height: 16px; object-fit: cover; border-radius: 2px; display: block; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
        .lang-current { padding:4px; border-radius:6px; cursor:pointer; border:2px solid rgba(100,116,139,.3); background:rgba(30,41,59,.4); transition:all .2s; display:flex; align-items:center; justify-content:center; }
        .lang-current:hover { border-color:rgba(59,130,246,.5); background:rgba(59,130,246,.1); transform:scale(1.05); }
        .lang-menu { position:absolute; top:calc(100% + 8px); right:0; background:rgba(30,41,59,.95); border:1px solid rgba(100,116,139,.4); border-radius:8px; padding:4px; display:none; flex-direction:column; gap:4px; box-shadow:0 4px 12px rgba(0,0,0,.3); backdrop-filter:blur(10px); z-index:1000; min-width:50px; }
        .lang-menu.open { display:flex; }
        .lang-option { padding:4px; border-radius:4px; cursor:pointer; transition:all .2s; display:flex; align-items:center; justify-content:center; border:2px solid transparent; }
        .lang-option:hover { background:rgba(59,130,246,.2); border-color:rgba(59,130,246,.4); }
        .lang-option.active { background:rgba(59,130,246,.15); border-color:rgba(59,130,246,.5); }

        /* Loading overlay */
        #loading-overlay { position:fixed; inset:0; z-index:99999; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0f172a; transition:opacity .35s ease; }
        #loading-overlay.done { opacity:0; pointer-events:none; }
        #dash-content { opacity:0; transition:opacity .35s ease; }
        #dash-content.visible { opacity:1; }
        .spinner { width:32px; height:32px; border:3px solid rgba(255,255,255,.1); border-top-color:rgba(255,255,255,.7); border-radius:50%; animation:spin .8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* User dropdown */
        .user-dropdown { position:relative; }
        .user-chip { display:flex; align-items:center; gap:6px; background:rgba(30,41,59,.6); border:1px solid rgba(51,65,85,.5); border-radius:20px; padding:3px 10px 3px 4px; font-size:0.75rem; color:#94a3b8; line-height:1; cursor:pointer; user-select:none; transition:border-color .2s, background .2s; }
        .user-chip:hover { border-color:rgba(99,102,241,.4); background:rgba(30,41,59,.9); }
        .user-avatar { width:22px; height:22px; background:linear-gradient(135deg,rgba(79,70,229,.5),rgba(99,102,241,.3)); border:1px solid rgba(99,102,241,.4); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.6875rem; font-weight:700; color:#a5b4fc; text-transform:uppercase; flex-shrink:0; }
        .user-menu { position:absolute; top:calc(100% + 8px); right:0; background:rgba(15,23,42,.97); border:1px solid rgba(51,65,85,.6); border-radius:10px; padding:4px; min-width:130px; box-shadow:0 8px 24px rgba(0,0,0,.4); backdrop-filter:blur(12px); display:none; z-index:1000; }
        .user-menu.open { display:block; }
        .user-menu-item { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:7px; font-size:0.8125rem; color:#94a3b8; cursor:pointer; transition:background .15s, color .15s; border:none; background:none; width:100%; text-align:left; }
        .user-menu-item:hover { background:rgba(239,68,68,.1); color:#f87171; }

        /* PC mode buttons */
        .pc-mode-btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 4px; font-size: 10px; font-weight: 600;
            padding: 6px 12px; border-radius: 8px;
            border: 2px solid rgba(51,65,85,.5);
            background: rgba(30,41,59,.5);
            color: #94a3b8; cursor: pointer;
            transition: all .15s ease;
            white-space: nowrap; min-width: 70px;
        }
        .pc-mode-btn:hover { background: rgba(99,102,241,.15); border-color: rgba(99,102,241,.4); color: #a5b4fc; }
        .pc-mode-btn:active { transform: scale(0.95); }
        .pc-mode-btn.active { background: rgba(34,197,94,.15); border-color: rgba(34,197,94,.6); color: #86efac; box-shadow: 0 0 8px rgba(34,197,94,.3); }
        .pc-mode-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Resource/Services tabs */
        .res-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .res-tab {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 14px; border-radius: 10px;
            border: 1px solid rgba(51,65,85,.5);
            background: rgba(30,41,59,.3);
            color: #64748b; font-size: 12px; font-weight: 600;
            cursor: pointer; transition: all .15s;
        }
        .res-tab:hover { background: rgba(51,65,85,.5); color: #94a3b8; }
        .res-tab.active { background: rgba(99,102,241,.15); border-color: rgba(99,102,241,.5); color: #a5b4fc; }
        .res-tab .tab-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

        /* Admin modal tabs */
        .admin-tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid rgba(51,65,85,.4); padding-bottom: 8px; }
        .admin-tab { padding: 8px 16px; border-radius: 8px 8px 0 0; background: transparent; color: #64748b; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; border: none; }
        .admin-tab:hover { background: rgba(51,65,85,.3); color: #94a3b8; }
        .admin-tab.active { background: rgba(99,102,241,.15); color: #a5b4fc; }

        /* Admin table */
        .admin-table { width: 100%; font-size: 13px; }
        .admin-table th { text-align: left; padding: 8px 12px; color: #64748b; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid rgba(51,65,85,.4); }
        .admin-table td { padding: 10px 12px; color: #e2e8f0; border-bottom: 1px solid rgba(51,65,85,.2); vertical-align: middle; }
        .admin-table tr:last-child td { border-bottom: none; }
        .admin-table tr:hover td { background: rgba(51,65,85,.15); }

        /* Profile chips */
        .profile-chip {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 8px; border-radius: 4px;
            font-size: 10px; font-weight: 600;
            background: rgba(51,65,85,.5); color: #94a3b8;
            margin: 2px;
        }
        .profile-chip.level-0 { background: rgba(239,68,68,.15); color: #fca5a5; }
        .profile-chip.level-1 { background: rgba(34,197,94,.15); color: #86efac; }
        .profile-chip.level-2 { background: rgba(245,158,11,.15); color: #fcd34d; }
        .profile-chip.level-3 { background: rgba(59,130,246,.15); color: #93c5fd; }
        .profile-chip .remove-btn { cursor: pointer; opacity: 0.6; margin-left: 2px; }
        .profile-chip .remove-btn:hover { opacity: 1; }

        /* Profile card */
        .profile-card {
            background: rgba(30,41,59,.5); border: 1px solid rgba(51,65,85,.4);
            border-radius: 10px; padding: 12px; margin-bottom: 10px;
        }
        .profile-card:last-child { margin-bottom: 0; }
        .profile-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .profile-card-title { font-size: 14px; font-weight: 600; color: #e2e8f0; }
        .profile-card-desc { font-size: 11px; color: #64748b; line-height: 1.4; }
        .profile-card-level { font-size: 12px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
        .profile-card-actions { display: flex; gap: 8px; margin-top: 8px; }

        /* User card */
        .user-card {
            background: rgba(30,41,59,.5); border: 1px solid rgba(51,65,85,.4);
            border-radius: 10px; padding: 12px;
        }
        .user-card-avatar {
            width: 40px; height: 40px; border-radius: 10px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 700; color: white;
            flex-shrink: 0; overflow: hidden;
        }
        .user-card-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-chip-sm {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600;
        }
        .profile-chip-sm .remove-btn {
            cursor: pointer; opacity: .6; font-size: 12px; line-height: 1;
        }
        .profile-chip-sm .remove-btn:hover { opacity: 1; }

        /* Service item in modal */
        .svc-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 10px;
            background: rgba(30,41,59,.4); border: 1px solid rgba(51,65,85,.3);
            margin-bottom: 8px; cursor: pointer; transition: all .15s;
            text-decoration: none; color: inherit;
        }
        .svc-item:hover { background: rgba(51,65,85,.4); border-color: rgba(99,102,241,.3); }
        .svc-item:last-child { margin-bottom: 0; }
        .svc-item .svc-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .svc-item .svc-name { font-size: 13px; font-weight: 500; color: #e2e8f0; }

        /* Buttons */
        .btn-xs {
            padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600;
            border: 1px solid rgba(51,65,85,.5); background: rgba(30,41,59,.5);
            color: #94a3b8; cursor: pointer; transition: all .15s;
        }
        .btn-xs:hover { background: rgba(99,102,241,.15); border-color: rgba(99,102,241,.4); color: #a5b4fc; }
        .btn-sm {
            padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600;
            border: 1px solid rgba(51,65,85,.5); background: rgba(30,41,59,.5);
            color: #94a3b8; cursor: pointer; transition: all .15s;
        }
        .btn-sm:hover { background: rgba(99,102,241,.15); border-color: rgba(99,102,241,.4); color: #a5b4fc; }
        .btn-sm.danger { color: #f87171; border-color: rgba(239,68,68,.3); }
        .btn-sm.danger:hover { background: rgba(239,68,68,.15); }
        .btn-sm.edit-btn { color: #fbbf24; border-color: rgba(251,191,36,.3); }
        .btn-sm.edit-btn:hover { background: rgba(251,191,36,.15); }

        /* Input */
        .admin-input {
            background: rgba(30,41,59,.8); border: 1px solid rgba(51,65,85,.5);
            border-radius: 6px; color: #e2e8f0; padding: 6px 10px; font-size: 13px; width: 100%;
        }
        .admin-input:focus { outline: none; border-color: rgba(99,102,241,.5); }
        .admin-select {
            background: rgba(30,41,59,.8); border: 1px solid rgba(51,65,85,.5);
            border-radius: 6px; color: #e2e8f0; padding: 6px 10px; font-size: 13px; cursor: pointer;
        }
        .admin-select:focus { outline: none; border-color: rgba(99,102,241,.5); }
        /* Responsive container - compact (focused UI: app grid) */
        .responsive-compact { width: 100%; max-width: 100%; }
        @media (min-width: 640px) { .responsive-compact { max-width: 540px; } }
        @media (min-width: 1024px) { .responsive-compact { max-width: 640px; } }
    </style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen overscroll-none">

<!-- Resources modal -->
<div id="res-modal" class="modal-overlay" onclick="closeResModal(event)">
  <div class="modal-panel" id="res-panel">
    <div class="modal-handle"></div>
    <div class="flex items-center justify-between mb-4">
      <span id="res-title" class="text-sm font-semibold text-slate-200">Recursos del sistema</span>
      <span id="res-timestamp" class="text-[10px] text-slate-600">—</span>
    </div>
    <div class="res-tabs" id="res-tabs">
      <button class="res-tab active" data-source="pi" onclick="switchResSource('pi')">
        <span class="tab-dot bg-slate-600" id="pi-tab-dot"></span>
        <span>Raspberry Pi</span>
      </button>
      <button class="res-tab" data-source="pc" onclick="switchResSource('pc')">
        <span class="tab-dot bg-slate-600" id="pc-tab-dot"></span>
        <span>Egnal PC</span>
      </button>
    </div>
    <div id="res-body">
      <div class="text-center text-slate-600 py-4 text-sm">Cargando…</div>
    </div>
  </div>
</div>

<!-- Services modal (external + infra) -->
<div id="svc-modal" class="modal-overlay" onclick="closeSvcModal(event)">
  <div class="modal-panel" id="svc-panel">
    <div class="modal-handle"></div>
    <div class="flex items-center justify-between mb-4">
      <span class="text-sm font-semibold text-slate-200">Servicios</span>
    </div>
    <div class="res-tabs" id="svc-tabs">
      <button class="res-tab active" data-tab="external" onclick="switchSvcTab('external')">Externos</button>
      <button class="res-tab" data-tab="infra" onclick="switchSvcTab('infra')">Infraestructura</button>
    </div>
    <div id="svc-body"></div>
  </div>
</div>

<!-- Admin modal -->
<div id="admin-modal" class="modal-overlay" onclick="closeAdminModal(event)">
  <div class="modal-panel" id="admin-panel" style="max-width: 560px;">
    <div class="modal-handle"></div>
    <div class="flex items-center justify-between mb-4">
      <span class="text-sm font-semibold text-slate-200">Administración</span>
    </div>
    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="users" onclick="switchAdminTab('users')">Usuarios</button>
      <button class="admin-tab" data-tab="profiles" onclick="switchAdminTab('profiles')">Perfiles</button>
    </div>
    <div id="admin-body">
      <div class="text-center text-slate-600 py-4 text-sm">Cargando…</div>
    </div>
  </div>
</div>

<!-- Profile Edit Modal -->
<div id="profile-edit-modal" class="modal-overlay" onclick="closeProfileEditModal(event)">
  <div class="modal-panel" style="max-width: 400px;">
    <div class="modal-handle"></div>
    <div class="flex items-center justify-between mb-4">
      <span class="text-sm font-semibold text-slate-200">Editar Perfil</span>
      <button class="text-slate-400 hover:text-white" onclick="closeProfileEditModal()">&times;</button>
    </div>
    <form id="profile-edit-form" onsubmit="submitProfileEdit(event)">
      <input type="hidden" id="profile-edit-id">
      <div class="mb-3">
        <label class="block text-xs text-slate-400 mb-1">Nombre</label>
        <input type="text" id="profile-edit-name" class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm text-white" required>
      </div>
      <div class="mb-3">
        <label class="block text-xs text-slate-400 mb-1">Nivel (0=Admin, 1=Familia, 3=Gamer)</label>
        <input type="number" id="profile-edit-level" min="0" max="3" class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm text-white" required>
      </div>
      <div class="mb-4">
        <label class="block text-xs text-slate-400 mb-1">Descripción</label>
        <input type="text" id="profile-edit-desc" class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm text-white">
      </div>
      <div class="flex gap-2">
        <button type="button" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white text-sm py-2 rounded" onclick="closeProfileEditModal()">Cancelar</button>
        <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-sm py-2 rounded">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- User Edit Modal -->
<div id="user-edit-modal" class="modal-overlay" onclick="closeUserEditModal(event)">
  <div class="modal-panel" style="max-width: 400px;">
    <div class="modal-handle"></div>
    <div class="flex items-center justify-between mb-4">
      <span class="text-sm font-semibold text-slate-200" id="user-edit-title">Editar Usuario</span>
      <button class="text-slate-400 hover:text-white" onclick="closeUserEditModal()">&times;</button>
    </div>
    <form id="user-edit-form" onsubmit="submitUserEdit(event)">
      <input type="hidden" id="user-edit-id">
      <div class="mb-3">
        <label class="block text-xs text-slate-400 mb-1">Username (no editable)</label>
        <input type="text" id="user-edit-username" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-500" readonly>
      </div>
      <div class="mb-3">
        <label class="block text-xs text-slate-400 mb-1">Nombre para mostrar</label>
        <input type="text" id="user-edit-displayname" class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm text-white" required>
      </div>
      <div class="mb-3">
        <label class="block text-xs text-slate-400 mb-1">Nueva contraseña (dejar vacío para no cambiar)</label>
        <input type="password" id="user-edit-password" class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm text-white" autocomplete="new-password">
      </div>
      <div class="mb-4">

// Language
const COOKIE = 'locale';
function getLang() { const m = document.cookie.match(/(?:^|;\s*)locale=([^;]+)/); return (m && T[m[1]]) ? m[1] : 'es'; }
function saveLang(l) { const exp = new Date(); exp.setFullYear(exp.getFullYear() + 1); document.cookie = `${COOKIE}=${l};expires=${exp.toUTCString()};path=/;SameSite=Lax`; }
let currentLang = getLang();
function t(key) { return T[currentLang][key] || T.en[key] || key; }
function applyLang() {
    const flags = { en: '/static/flags/gb.svg', es: '/static/flags/es.svg' };
    document.getElementById('current-flag').src = flags[currentLang];

    document.getElementById('title').textContent = t('title');
    document.getElementById('apps-label').textContent = t('services');
    document.getElementById('res-title').textContent = t('res_title');
    const logoutText = document.getElementById('logout-text');
    if (logoutText) logoutText.textContent = t('logout_label');
    saveLang(currentLang);
}
function setLang(l) {
    document.getElementById('lang-menu').classList.remove('open');
    currentLang = l; applyLang(); renderApps(); loadStatus();
}
function toggleLang() { document.getElementById('lang-menu').classList.toggle('open'); }
document.addEventListener('click', e => {
    const dd = document.querySelector('.lang-dropdown');
    if (dd && !dd.contains(e.target)) document.getElementById('lang-menu').classList.remove('open');
});

// Helper
function isAdmin() { return currentUserData?.is_admin === true; }
function getLevel() { return currentUserData?.effective_level ?? 99; }

// ═══════════════════════════════════════════════════════════════════════════
// PC Control
// ═══════════════════════════════════════════════════════════════════════════
let currentPcMode = null;
let pcOnline = false;

async function loadPcStatus() {
    try {
        const [statusRes, modeRes] = await Promise.all([
            fetch('/api/pc/status').then(r => r.json()),
            fetch('/api/pc/mode').then(r => r.json())
        ]);
        pcOnline = statusRes.online === true;
        const pcTabDot = document.getElementById('pc-tab-dot');
        if (pcTabDot) pcTabDot.className = `tab-dot ${pcOnline ? 'bg-green-500' : 'bg-red-400'}`;
        
        if (pcOnline && modeRes.mode) {
            // Mode from API - check against known modes
            const knownModes = ['balanced', 'gaming', 'servidor'];
            const modeLC = modeRes.mode.toLowerCase();
            // If mode matches known modes, use it; otherwise it's a custom profile
            currentPcMode = knownModes.includes(modeLC) ? modeLC : 'custom';
        } else {
            currentPcMode = null;
        }
    } catch {
        pcOnline = false;
        currentPcMode = null;
        const pcTabDot = document.getElementById('pc-tab-dot');
        if (pcTabDot) pcTabDot.className = 'tab-dot bg-red-400';
    }
}

// ═══════════════════════════════════════════════════════════════════════════
// Resources Modal
// ═══════════════════════════════════════════════════════════════════════════
let _resInterval = null;
let currentResSource = 'pi';

function _barColor(pct) { return pct < 70 ? 'green' : pct < 85 ? 'yellow' : 'red'; }
function _tempColor(c) { return c < 60 ? 'green' : c < 75 ? 'yellow' : 'red'; }
function _bar(pct, color) { return `<div class="res-bar-bg"><div class="res-bar ${color}" style="width:${Math.min(pct,100)}%"></div></div>`; }

async function switchResSource(source) {
    currentResSource = source;
    document.querySelectorAll('#res-tabs .res-tab').forEach(tab => tab.classList.toggle('active', tab.dataset.source === source));
    if (source === 'pc') await loadPcStatus(); // Refresh PC status before rendering
    fetchAndRenderResources();
}

function renderPiResources(d) {
    const body = document.getElementById('res-body');
    document.getElementById('res-timestamp').textContent = new Date().toLocaleTimeString();
    const ramPct = d.ram?.percent ?? 0, swapPct = d.swap?.percent ?? 0;
    const cpuPct = d.cpu?.percent ?? 0, diskPct = d.disk?.percent ?? 0;
    const tempC = d.temp?.celsius ?? 0;
    body.innerHTML = `
      <div class="res-row"><div class="res-row-header"><span class="res-label">${t('res_ram')}</span><span class="res-value">${d.ram?.used_mb ?? '—'} / ${d.ram?.total_mb ?? '—'} MB · <b>${ramPct}%</b></span></div>${_bar(ramPct, _barColor(ramPct))}</div>
      <div class="res-row"><div class="res-row-header"><span class="res-label">${t('res_swap')}</span><span class="res-value">${d.swap?.used_mb ?? '—'} / ${d.swap?.total_mb ?? '—'} MB · <b>${swapPct}%</b></span></div>${_bar(swapPct, _barColor(swapPct))}</div>
      <div class="res-row"><div class="res-row-header"><span class="res-label">${t('res_cpu')}</span><span class="res-value"><b>${cpuPct}%</b></span></div>${_bar(cpuPct, _barColor(cpuPct))}</div>
      <div class="res-row"><div class="res-row-header"><span class="res-label">${t('res_disk')} (/)</span><span class="res-value">${d.disk?.used_gb ?? '—'} / ${d.disk?.total_gb ?? '—'} GB · <b>${diskPct}%</b></span></div>${_bar(diskPct, _barColor(diskPct))}</div>
      <div class="res-row" style="margin-bottom:0"><div class="res-row-header"><span class="res-label">${t('res_temp')}</span><span class="temp-pill ${_tempColor(tempC)}">${tempC} °C</span></div></div>
    `;
    const piTabDot = document.getElementById('pi-tab-dot');
    if (piTabDot) piTabDot.className = 'tab-dot bg-green-500';
}

function renderPcResources() {
    const body = document.getElementById('res-body');
    document.getElementById('res-timestamp').textContent = new Date().toLocaleTimeString();
    if (!pcOnline) {
        body.innerHTML = `<div class="text-center py-8"><div class="w-12 h-12 rounded-full bg-red-500/20 flex items-center justify-center mx-auto mb-3"><span class="w-3 h-3 rounded-full bg-red-400"></span></div><p class="text-slate-400 text-sm mb-1">Egnal PC</p><p class="text-red-400 font-semibold">${t('pc_offline')}</p></div>`;
        return;
    }
    const modes = ['balanced', 'gaming', 'servidor'];
    const modeIcons = { balanced: '⚡', gaming: '🎮', servidor: '🖥️' };
    body.innerHTML = `
        <div class="text-center py-4">
            <div class="flex items-center justify-center gap-2 mb-6">
                <span class="w-3 h-3 rounded-full bg-green-500 status-dot"></span>
                <span class="text-green-400 font-semibold">${t('pc_online')}</span>
            </div>
            <p class="text-xs text-slate-500 uppercase tracking-wider mb-4">Perfil de energía</p>
            <div class="flex justify-center gap-3" id="pc-mode-btns">
                ${modes.map(mode => `<button class="pc-mode-btn ${currentPcMode === mode ? 'active' : ''}" data-mode="${mode}" onclick="setPcMode('${mode}')"><span>${modeIcons[mode]}</span><span>${mode.charAt(0).toUpperCase() + mode.slice(1)}</span></button>`).join('')}
            </div>
        </div>
    `;
}

async function fetchAndRenderResources() {
    if (currentResSource === 'pi') {
        try {
            const r = await fetch('/api/system/stats');
            if (!r.ok) throw new Error('HTTP ' + r.status);
            renderPiResources(await r.json());
        } catch (e) {
            document.getElementById('pi-tab-dot').className = 'tab-dot bg-red-400';
            document.getElementById('res-body').innerHTML = `<p class="text-center text-red-400 text-sm py-4">Error: ${e.message}</p>`;
        }
    } else {
        renderPcResources();
    }
}

async function setPcMode(mode) {
    if (!isAdmin()) return;
    document.querySelectorAll('.pc-mode-btn').forEach(btn => btn.disabled = true);
    try {
        const r = await fetch(`/api/pc/mode/${mode}`, { method: 'POST' });
        if (r.ok) currentPcMode = mode;
    } catch {}
    await loadPcStatus();
    if (currentResSource === 'pc') renderPcResources();
}

function openResModal() {
    document.getElementById('res-modal').classList.add('open');
    currentResSource = 'pi';
    document.querySelectorAll('#res-tabs .res-tab').forEach(tab => tab.classList.toggle('active', tab.dataset.source === 'pi'));
    fetchAndRenderResources();
    _resInterval = setInterval(fetchAndRenderResources, 5000);
}

function closeResModal(e) {
    if (e && document.getElementById('res-panel').contains(e.target)) return;
    document.getElementById('res-modal').classList.remove('open');
    clearInterval(_resInterval);
    _resInterval = null;
}

// ═══════════════════════════════════════════════════════════════════════════
// Services Modal (external + infra)
// ═══════════════════════════════════════════════════════════════════════════
let currentSvcTab = 'external';
let svcStatus = {};

function switchSvcTab(tab) {
    currentSvcTab = tab;
    document.querySelectorAll('#svc-tabs .res-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    renderSvcContent();
}

async function loadSvcStatus() {
    // Fire individual health checks in parallel - each updates UI independently as it resolves
    // This way fast services (immich, passwords) don't wait for slow ones (ai with 5s timeout)

    const checks = [
        // External services
        { key: 'ai', endpoint: '/api/health/ai', extract: r => r.online === true },
        { key: 'photos_ext', endpoint: '/api/health/immich', extract: r => r.online === true },
        { key: 'passwords_ext', endpoint: '/api/health/passwords', extract: r => r.online === true },
        // Core services
        { key: 'core_mqtt', endpoint: '/api/health/zigbee', extract: r => r.mqtt_connected === true },
        { key: 'core_zigbee', endpoint: '/api/health/zigbee', extract: r => r.online === true },
    ];

    // Fire all requests simultaneously, update UI as each completes
    checks.forEach(({ key, endpoint, extract }) => {
        fetch(endpoint)
            .then(r => r.json())
            .then(data => {
                svcStatus[key] = extract(data);
                renderSvcContent();  // Re-render immediately when this service responds
            })
            .catch(() => {
                svcStatus[key] = false;
                renderSvcContent();
            });
    });
}

function renderSvcContent() {
    const body = document.getElementById('svc-body');
    if (currentSvcTab === 'external') {
        if (!externalServices.length) {
            body.innerHTML = '<p class="text-center text-slate-500 py-4 text-sm">No hay servicios externos disponibles</p>';
            return;
        }
        body.innerHTML = externalServices.map(svc => {
            const info = EXT_SERVICES[svc.key];
            if (!info) return '';
            const online = svcStatus[svc.key] ?? false;
            return `<a href="${info.url}" target="_blank" rel="noopener" class="svc-item">
                <span class="svc-dot ${online ? 'bg-green-500 status-dot' : 'bg-red-400'}"></span>
                <span class="svc-name">${t(info.nameKey)}</span>
            </a>`;
        }).join('');
    } else {
        body.innerHTML = CORE_SERVICES.map(svc => {
            const online = svcStatus[svc.key] ?? false;
            const inner = `<span class="svc-dot ${online ? 'bg-green-500 status-dot' : 'bg-red-400'}"></span><span class="svc-name">${t(svc.labelKey)}</span>`;
            return svc.url 
                ? `<a href="${svc.url}" class="svc-item">${inner}</a>`
                : `<div class="svc-item" style="cursor:default">${inner}</div>`;
        }).join('');
    }
}

async function openSvcModal() {
    document.getElementById('svc-modal').classList.add('open');
    currentSvcTab = 'external';
    document.querySelectorAll('#svc-tabs .res-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'external'));
    // Initialize all services as offline (red) - instant feedback
    ['ai', 'photos_ext', 'passwords_ext', 'core_mqtt', 'core_zigbee'].forEach(k => svcStatus[k] = false);
    renderSvcContent();  // Show immediately with all red dots
    // Load actual status in background - will re-render when complete
    loadSvcStatus();
}

function closeSvcModal(e) {
    if (e && document.getElementById('svc-panel').contains(e.target)) return;
    document.getElementById('svc-modal').classList.remove('open');
}

// ═══════════════════════════════════════════════════════════════════════════
// Admin Modal
// ═══════════════════════════════════════════════════════════════════════════
let adminUsers = [];
let adminProfiles = {};
let currentAdminTab = 'users';

async function loadAdminData() {
    try {
        const [usersRes, profilesRes] = await Promise.all([
            fetch('/api/auth/admin/users').then(r => r.json()),
            fetch('/api/auth/admin/profiles').then(r => r.json())
        ]);
        adminUsers = usersRes;
        adminProfiles = profilesRes;
    } catch (e) { console.error('Failed to load admin data:', e); }
}

function switchAdminTab(tab) {
    currentAdminTab = tab;
    document.querySelectorAll('.admin-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    renderAdminContent();
}

function getLevelClass(level) { return `level-${level}`; }

function renderAdminContent() {
    const body = document.getElementById('admin-body');
    
    if (currentAdminTab === 'users') {
        body.innerHTML = `
            <div class="mb-4 flex items-center justify-between">
                <span class="text-xs text-slate-500 uppercase tracking-wider">Gestionar usuarios</span>
                <button class="btn-sm" onclick="showCreateUserDialog()">+ Nuevo usuario</button>
            </div>
            <div class="space-y-3">
                ${adminUsers.map(u => `
                    <div class="user-card" data-user-id="${u.id}">
                        <div class="flex items-center gap-3">
                            <div class="user-card-avatar">${u.icon ? `<img src="${u.icon}" alt="">` : u.display_name.charAt(0).toUpperCase()}</div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2">
                                    <span class="font-medium text-white">${u.display_name || u.username}</span>
                                    <span class="text-xs text-slate-500">@${u.username}</span>
                                </div>
                                <div class="flex flex-wrap gap-1 mt-1">
                                    ${u.profiles.map(p => `<span class="profile-chip-sm ${getLevelClass(p.level)}">${p.name}<span class="remove-btn" onclick="removeUserProfile('${u.username}','${p.id}')">×</span></span>`).join('')}
                                    <button class="btn-xs" onclick="showAddProfileDialog('${u.username}')" title="Añadir perfil">+</button>
                                </div>
                            </div>
                            <button class="btn-sm edit-btn" onclick="editUser('${u.id}')">✏️</button>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
    } else {
        // Profiles tab - adminProfiles is {id: {name, level, description, protected}}
        body.innerHTML = `
            <div class="mb-4 flex items-center justify-between">
                <span class="text-xs text-slate-500 uppercase tracking-wider">Gestionar perfiles de permiso</span>
                <button class="btn-sm" onclick="showCreateProfileDialog()">+ Nuevo perfil</button>
            </div>
            ${Object.entries(adminProfiles).map(([id, p]) => `
                <div class="profile-card ${p.protected ? 'protected' : 'editable'}">
                    <div class="profile-card-header">
                        <span class="profile-card-title">${p.name}</span>
                        <span class="profile-card-level ${getLevelClass(p.level)}">Nivel ${p.level}</span>
                    </div>
                    <p class="profile-card-desc">${p.description || '—'}</p>
                    ${p.protected 
                        ? '<p class="text-xs text-slate-600 mt-2 italic">Perfil protegido (no editable)</p>' 
                        : `<div class="profile-card-actions">
                            <button class="btn-sm edit-btn" onclick="editProfile('${id}')">✏️ Editar</button>
                            ${id.includes('-0000-') ? '' : `<button class="btn-sm danger" onclick="deleteProfile('${id}')">🗑️ Eliminar</button>`}
                           </div>`
                    }
                </div>
            `).join('')}
        `;
    }
}

async function removeUserProfile(username, profileId) {
    const user = adminUsers.find(u => u.username === username);
    if (user?.profiles.length <= 1) { alert('No se puede eliminar el último perfil'); return; }
    try {
        await fetch(`/api/auth/admin/users/${username}/profiles/${profileId}`, { method: 'DELETE' });
        await loadAdminData();
        renderAdminContent();
    } catch (e) { alert('Error: ' + e.message); }
}

function showAddProfileDialog(username) {
    const user = adminUsers.find(u => u.username === username);
    const userProfileIds = user?.profiles.map(p => p.id) || [];
    const available = Object.entries(adminProfiles).filter(([id]) => !userProfileIds.includes(id));
    if (!available.length) { alert('El usuario ya tiene todos los perfiles'); return; }
    
    const options = available.map(([id, p]) => `${p.name}`).join(', ');
    const selectedName = prompt(`Añadir perfil a ${username}.\nDisponibles: ${options}`);
    if (!selectedName) return;
    
    const match = available.find(([id, p]) => p.name.toLowerCase() === selectedName.toLowerCase());
    if (match) {
        addUserProfile(username, match[0]);
    } else {
        alert('Perfil no encontrado');
    }
}

async function addUserProfile(username, profileId) {
    try {
        await fetch(`/api/auth/admin/users/${username}/profiles/${profileId}`, { method: 'POST' });
        await loadAdminData();
        renderAdminContent();
    } catch (e) { alert('Error: ' + e.message); }
}

function showCreateProfileDialog() {
    const name = prompt('Nombre del nuevo perfil (mayúsculas):');
    if (!name) return;
    const level = parseInt(prompt('Nivel (0-3):', '1'));
    if (isNaN(level) || level < 0 || level > 3) { alert('Nivel inválido'); return; }
    const desc = prompt('Descripción:', '') || '';
    createProfile(name.toUpperCase(), level, desc);
}

async function createProfile(name, level, description) {
    try {
        const r = await fetch('/api/auth/admin/profiles', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, level, description })
        });
        if (!r.ok) { const e = await r.json(); alert('Error: ' + e.detail); return; }
        await loadAdminData();
        renderAdminContent();
    } catch (e) { alert('Error: ' + e.message); }
}

function editProfile(profileId) {
    const p = adminProfiles[profileId];
    if (!p || p.protected) return;
    
    // Populate modal fields
    document.getElementById('profile-edit-id').value = profileId;
    document.getElementById('profile-edit-name').value = p.name;
    document.getElementById('profile-edit-level').value = p.level;
    document.getElementById('profile-edit-desc').value = p.description || '';
    
    // Open modal
    document.getElementById('profile-edit-modal').classList.add('open');
}

function closeProfileEditModal(event) {
    if (event && event.target !== event.currentTarget) return;
    document.getElementById('profile-edit-modal').classList.remove('open');
}

async function submitProfileEdit(event) {
    event.preventDefault();
    const profileId = document.getElementById('profile-edit-id').value;
    const name = document.getElementById('profile-edit-name').value.toUpperCase();
    const level = parseInt(document.getElementById('profile-edit-level').value);
    const description = document.getElementById('profile-edit-desc').value;
    
    try {
        const r = await fetch(`/api/auth/admin/profiles/${profileId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, level, description })
        });
        if (!r.ok) { const e = await r.json(); alert('Error: ' + e.detail); return; }
        closeProfileEditModal();
        await loadAdminData();
        renderAdminContent();
    } catch (e) { alert('Error: ' + e.message); }
}

// ── User Management ─────────────────────────────────────────────────────────

    const user = adminUsers.find(u => u.id === userId);
    if (!user) return;
    
    document.getElementById('user-edit-id').value = userId;
    document.getElementById('user-edit-username').value = user.username;
    document.getElementById('user-edit-displayname').value = user.display_name || '';
    document.getElementById('user-edit-password').value = '';
    document.getElementById('user-edit-icon').value = user.icon || '';
    document.getElementById('user-edit-modal').classList.add('open');
}

function closeUserEditModal(event) {
    if (event && event.target !== event.currentTarget) return;
    document.getElementById('user-edit-modal').classList.remove('open');
}

async function submitUserEdit(event) {
    event.preventDefault();
    const userId = document.getElementById('user-edit-id').value;
    const display_name = document.getElementById('user-edit-displayname').value;

        });
        if (!r.ok) { const e = await r.json(); alert('Error: ' + e.detail); return; }
        closeUserEditModal();
        await loadAdminData();

}

async function deleteCurrentUser() {
    const userId = document.getElementById('user-edit-id').value;

        const r = await fetch(`/api/auth/admin/users/${userId}`, { method: 'DELETE' });
        if (!r.ok) { const e = await r.json(); alert('Error: ' + e.detail); return; }
        closeUserEditModal();
        await loadAdminData();
        renderAdminContent();
    } catch (e) { alert('Error: ' + e.message); }
}

function showCreateUserDialog() {
    document.getElementById('user-create-username').value = '';
    document.getElementById('user-create-password').value = '';
    document.getElementById('user-create-displayname').value = '';
    document.getElementById('user-create-modal').classList.add('open');
}

function closeUserCreateModal(event) {
    if (event && event.target !== event.currentTarget) return;
    document.getElementById('user-create-modal').classList.remove('open');
}

async function submitUserCreate(event) {
    event.preventDefault();
    const username = document.getElementById('user-create-username').value.toLowerCase();
    const password = document.getElementById('user-create-password').value;
    const display_name = document.getElementById('user-create-displayname').value;

        renderAdminContent();

}

async function openAdminModal() {
    document.getElementById('admin-modal').classList.add('open');
    document.getElementById('admin-body').innerHTML = '<div class="text-center text-slate-600 py-4 text-sm">Cargando…</div>';

    currentAdminTab = 'users';

function closeAdminModal(e) {

// Close modals on Escape
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeResModal(); closeSvcModal(); closeAdminModal(); } });

// ═══════════════════════════════════════════════════════════════════════════
// Service Cards
// ═══════════════════════════════════════════════════════════════════════════
function renderApps() {
    if (!APPS.length) return;
    const showBtn = isAdmin();
    document.getElementById('apps-list').innerHTML = APPS.map(app => {
        const btnHtml = showBtn ? `<button class="svc-btn loading" id="btn-${app.key}" onclick="toggleService(event,'${app.key}')">${t('svc_loading')}</button>` : '';
        const tag = app.url ? 'a' : 'div';
        const href = app.url ? `href="${app.url}"` : '';
        return `<${tag} ${href} class="app-card px-4 py-3.5">
            <div class="flex items-center justify-between gap-2">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-0.5">
                        <span class="text-sm font-semibold">${t(app.nameKey)}</span>
                        <span id="status-${app.key}" class="flex items-center gap-1 text-[10px] text-slate-500">
                            <span class="w-1.5 h-1.5 rounded-full bg-slate-600 inline-block"></span><span>—</span>
                        </span>
                    </div>
                    <p class="text-[11px] text-slate-400 truncate">${t(app.descKey)}</p>
                </div>
                ${btnHtml}${(showBtn || !app.url) ? '' : '<span class="text-slate-600 ml-1">›</span>'}
            </div>
        </${tag}>`;
    }).join('');
    document.getElementById('services-section').style.display = 'block';
    if (isAdmin()) loadContainerStates();
}

// Container control
async function loadContainerStates() {
    try {
        const r = await fetch('/api/system/containers');
        if (!r.ok) return;
        const data = await r.json();
        containerState = {};
        for (const [key, info] of Object.entries(data)) {
            containerState[key] = info.running;
            updateBtn(key, info.running);
        }
    } catch {}
}

function updateBtn(key, running) {
    const btn = document.getElementById('btn-' + key);
    if (!btn) return;
    btn.disabled = false;
    btn.className = running ? 'svc-btn running' : 'svc-btn stopped';
    btn.textContent = running ? '⏹ ' + t('svc_stop') : '▶ ' + t('svc_start');
}

async function toggleService(event, key) {
    event.preventDefault(); event.stopPropagation();
    const btn = document.getElementById('btn-' + key);
    if (!btn || btn.disabled) return;
    const wasRunning = containerState[key];
    btn.disabled = true; btn.className = 'svc-btn loading'; btn.textContent = t('svc_loading');
    try {
        const r = await fetch(`/api/system/containers/${key}/${wasRunning ? 'stop' : 'start'}`, { method: 'POST' });
        if (r.ok) {
            await new Promise(res => setTimeout(res, 1500));
            await loadContainerStates();
            const app = APPS.find(a => a.key === key);
            if (app?.statusUrl) delete statusCache[app.statusUrl];
            await loadStatus();
        } else { updateBtn(key, wasRunning); }
    } catch { updateBtn(key, wasRunning); }
}

// Status polling
const statusCache = {};
async function fetchStatus(url) {
    if (statusCache[url] && (Date.now() - statusCache[url].ts) < 8000) return statusCache[url].data;
    const data = await fetch(url).then(r => r.json());
    statusCache[url] = { data, ts: Date.now() };
    return data;
}

async function loadStatus() {
    for (const app of APPS) {
        if (!app.statusUrl || !app.getStatus) continue;
        try {
            const data = await fetchStatus(app.statusUrl);
            const el = document.getElementById('status-' + app.key);
            if (!el) continue;
            const isOnline = app.getStatus(data);
            el.querySelector('span:first-child').className = `status-dot w-1.5 h-1.5 rounded-full inline-block ${isOnline ? 'bg-green-500' : 'bg-red-400'}`;
            el.querySelector('span:last-child').textContent = t(isOnline ? 'connected' : 'offline');
            const card = el.closest('.app-card');
            if (card) card.classList.toggle('offline', !isOnline);
        } catch {}
    }
}

// User menu
function toggleUserMenu() { document.getElementById('user-menu').classList.toggle('open'); }
document.addEventListener('click', e => {
    const dd = document.getElementById('user-dropdown');
    if (dd && !dd.contains(e.target)) document.getElementById('user-menu')?.classList.remove('open');
});

// Load user
async function loadUser() {
    try {
        const res = await fetch('/api/auth/me');
        if (!res.ok) return;
        currentUserData = await res.json();
        const username = currentUserData.username || '';
        if (!username) return;
        
        document.getElementById('user-name').textContent = username;
        document.getElementById('user-avatar').textContent = username.charAt(0).toUpperCase();
        document.getElementById('user-dropdown').style.display = 'block';
        
        // Show buttons based on level (SUPER = level 0)
        if (isAdmin()) {
            document.getElementById('svc-btn').style.display = 'flex';
            document.getElementById('res-btn').style.display = 'flex';
            document.getElementById('admin-btn').style.display = 'flex';
        }
        
        // Build app list from permissions
        // photos and passwords go in external services modal, not main list
        APPS = (currentUserData.apps || [])
            .filter(p => !['zigbee', 'photos', 'passwords'].includes(p.key))
            .map(p => ({ key: p.key, ...APP_CATALOGUE[p.key] }))
            .filter(a => a);
        
        // External services
        externalServices = currentUserData.external_services || [];
        
        renderApps();
        loadStatus();
    } catch {}
}

// Init
(async function init() {
    applyLang();
    try { await Promise.race([ loadUser(), new Promise(r => setTimeout(r, 5000)) ]); } catch {}
    const overlay = document.getElementById('loading-overlay');
    const content = document.getElementById('dash-content');
    content.classList.add('visible');
    overlay.classList.add('done');
    setTimeout(() => { overlay.style.display = 'none'; }, 400);
    setInterval(loadStatus, 10000);
    setInterval(() => { if (isAdmin()) loadContainerStates(); }, 30000);
    loadPcStatus();
    setInterval(loadPcStatus, 30000);
})();
</script>
