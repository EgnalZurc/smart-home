<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cuchi Casa</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="/static/tailwind.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        /* Service card */
        .app-card {
            background: linear-gradient(145deg, rgba(30,41,59,0.8), rgba(15,23,42,0.9));
            border: 1px solid rgba(51,65,85,0.5);
            backdrop-filter: blur(10px);
            transition: transform 0.15s ease, border-color 0.2s ease, filter 0.3s ease, opacity 0.3s ease;
            text-decoration: none; display: block;
            border-radius: 16px;
        }
        .app-card.offline { filter: grayscale(1); opacity: 0.6; }
        .app-card.offline:hover { filter: grayscale(0.7); opacity: 0.75; }
        .app-card:active { transform: scale(0.97); }
        @media (hover:hover) { .app-card:hover { border-color: rgba(99,102,241,0.4); transform: translateY(-1px); } }

        /* Stop/start button */
        .svc-btn {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 10px; font-weight: 600;
            padding: 4px 9px; border-radius: 6px; border: 1px solid;
            cursor: pointer; transition: opacity 0.15s, background 0.15s;
            white-space: nowrap; user-select: none; flex-shrink: 0;
            background: none; line-height: 1;
        }
        .svc-btn:active { opacity: 0.7; }
        .svc-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .svc-btn.running  { color:#f87171; border-color:rgba(239,68,68,.4); background:rgba(239,68,68,.08); }
        .svc-btn.running:hover { background:rgba(239,68,68,.15); }
        .svc-btn.stopped  { color:#86efac; border-color:rgba(34,197,94,.4); background:rgba(34,197,94,.08); }
        .svc-btn.stopped:hover { background:rgba(34,197,94,.15); }
        .svc-btn.loading  { color:#94a3b8; border-color:rgba(148,163,184,.3); background:rgba(148,163,184,.05); }

        /* Restart button (shown next to stop when a service is running) */
        .svc-restart {
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 11px; padding: 4px 7px; border-radius: 6px;
            border: 1px solid rgba(96,165,250,.4); color:#60a5fa;
            background: rgba(59,130,246,.08);
            cursor: pointer; transition: background 0.15s, opacity 0.15s;
            flex-shrink: 0; line-height: 1; user-select: none;
        }
        .svc-restart:hover { background: rgba(59,130,246,.15); }
        .svc-restart:active { opacity: 0.7; }
        .svc-restart:disabled { opacity: 0.4; cursor: not-allowed; }
        .svc-restart.spinning { animation: svc-spin 0.8s linear infinite; }
        @keyframes svc-spin { to { transform: rotate(360deg); } }

        /* Deploy button (shown next to restart; SUPER only) */
        .svc-deploy {
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 11px; padding: 4px 7px; border-radius: 6px;
            border: 1px solid rgba(192,132,252,.4); color:#c084fc;
            background: rgba(168,85,247,.08);
            cursor: pointer; transition: background 0.15s, opacity 0.15s;
            flex-shrink: 0; line-height: 1; user-select: none;
        }
        .svc-deploy:hover { background: rgba(168,85,247,.15); }
        .svc-deploy:active { opacity: 0.7; }
        .svc-deploy:disabled { opacity: 0.4; cursor: not-allowed; }
        .svc-deploy.spinning { animation: svc-spin 0.8s linear infinite; }

        /* Toast notifications (bottom-centre) */
        #toast-container {
            position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
            z-index: 9500; display: flex; flex-direction: column; gap: 8px;
            align-items: center; pointer-events: none;
            padding: 0 12px; width: max-content; max-width: calc(100vw - 24px);
        }
        .toast {
            pointer-events: auto;
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; border-radius: 10px;
            font-size: 13px; line-height: 1.3;
            background: rgba(15,23,42,.96); border: 1px solid rgba(51,65,85,.6);
            color: #e2e8f0; box-shadow: 0 8px 24px rgba(0,0,0,.4);
            opacity: 0; transform: translateY(8px);
            transition: opacity .2s ease, transform .2s ease;
            max-width: 100%;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { border-color: rgba(34,197,94,.5); }
        .toast.error { border-color: rgba(239,68,68,.5); }
        .toast a { color: #60a5fa; text-decoration: underline; white-space: nowrap; }

        /* Header icon button */
        .hdr-btn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; border-radius: 8px;
            background: rgba(30,41,59,.5); border: 1px solid rgba(51,65,85,.5);
            cursor: pointer; transition: background .15s, border-color .15s;
            color: #64748b; flex-shrink: 0;
        }
        .hdr-btn:hover { background: rgba(99,102,241,.15); border-color: rgba(99,102,241,.4); color: #a5b4fc; }
        .hdr-btn:active { transform: scale(0.92); }

        /* Modal base */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 9000;
            display: flex; align-items: flex-end; justify-content: center;
            padding: 0 0 env(safe-area-inset-bottom, 0);
            background: rgba(0,0,0,.55);
            backdrop-filter: blur(4px);
            opacity: 0; pointer-events: none;
            transition: opacity .2s ease;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal-panel {
            background: #0f172a;
            border: 1px solid rgba(51,65,85,.6);
            border-bottom: none;
            border-radius: 20px 20px 0 0;
            width: 100%; max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0));
            transform: translateY(100%);
            transition: transform .25s cubic-bezier(.4,0,.2,1);
        }
        .modal-overlay.open .modal-panel { transform: translateY(0); }
        .modal-handle { width: 36px; height: 4px; background: rgba(100,116,139,.4); border-radius: 2px; margin: 0 auto 16px; }

        /* resource rows */
        .res-row { margin-bottom: 14px; }
        .res-row:last-child { margin-bottom: 0; }
        .res-row-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 5px; }
        .res-label { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: .05em; }
        .res-value { font-size: 12px; color: #94a3b8; }
        .res-bar-bg { height: 6px; background: rgba(51,65,85,.5); border-radius: 3px; overflow: hidden; }
        .res-bar { height: 100%; border-radius: 3px; transition: width .5s ease; }
        .res-bar.green  { background: #22c55e; }
        .res-bar.yellow { background: #f59e0b; }
        .res-bar.red    { background: #ef4444; }

        /* temp pill */
        .temp-pill {
            display: inline-block; padding: 2px 10px; border-radius: 99px;
            font-size: 13px; font-weight: 700; letter-spacing: -.01em;
        }
        .temp-pill.green  { background: rgba(34,197,94,.15);  color: #86efac; }
        .temp-pill.yellow { background: rgba(245,158,11,.15); color: #fcd34d; }
        .temp-pill.red    { background: rgba(239,68,68,.15);  color: #fca5a5; }

        .section-label { font-size: 10px; color: #475569; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
        .status-dot { animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        /* Health detail tooltip (shown on hover/click of status dots) */
        .health-trigger { position: relative; cursor: help; }
        .health-tip {
            position: absolute; z-index: 9000;
            bottom: calc(100% + 8px); left: 0;
            min-width: 180px; max-width: 260px;
            background: rgba(15,23,42,.98); color: #e2e8f0;
            border: 1px solid rgba(99,102,241,.35); border-radius: 10px;
            padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.45);
            backdrop-filter: blur(10px);
            font-size: 11px; line-height: 1.5; text-align: left;
            opacity: 0; transform: translateY(4px); pointer-events: none;
            transition: opacity .15s ease, transform .15s ease;
            white-space: normal;
        }
        .health-trigger:hover .health-tip,
        .health-trigger.tip-open .health-tip { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .health-tip::after {
            content: ''; position: absolute; top: 100%; left: 12px;
            border: 5px solid transparent; border-top-color: rgba(15,23,42,.98);
        }
        .health-tip .ht-title { font-weight: 700; color: #f1f5f9; margin-bottom: 4px; font-size: 12px; }
        .health-tip .ht-row { display: flex; justify-content: space-between; gap: 10px; }
        .health-tip .ht-k { color: #94a3b8; }
        .health-tip .ht-v { color: #e2e8f0; font-weight: 600; word-break: break-word; text-align: right; }
        .health-tip .ht-v.ok { color: #86efac; }
        .health-tip .ht-v.bad { color: #fca5a5; }
        .health-tip .ht-err { color: #fca5a5; margin-top: 4px; word-break: break-word; }
        .fade-in { animation: fadeIn 0.35s ease; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

        /* Language selector */
        .lang-dropdown { position: relative; }
        .flag-img { width: 24px; height: 16px; object-fit: cover; border-radius: 2px; display: block; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
        .lang-current { padding:4px; border-radius:6px; cursor:pointer; border:2px solid rgba(100,116,139,.3); background:rgba(30,41,59,.4); transition:all .2s; display:flex; align-items:center; justify-content:center; }
        .lang-current:hover { border-color:rgba(59,130,246,.5); background:rgba(59,130,246,.1); transform:scale(1.05); }
        .lang-menu { position:absolute; top:calc(100% + 8px); right:0; background:rgba(30,41,59,.95); border:1px solid rgba(100,116,139,.4); border-radius:8px; padding:4px; display:none; flex-direction:column; gap:4px; box-shadow:0 4px 12px rgba(0,0,0,.3); backdrop-filter:blur(10px); z-index:1000; min-width:50px; }
        .lang-menu.open { display:flex; }
        .lang-option { padding:4px; border-radius:4px; cursor:pointer; transition:all .2s; display:flex; align-items:center; justify-content:center; border:2px solid transparent; }
        .lang-option:hover { background:rgba(59,130,246,.2); border-color:rgba(59,130,246,.4); }
        .lang-option.active { background:rgba(59,130,246,.15); border-color:rgba(59,130,246,.5); }

        /* Loading overlay */
        #loading-overlay { position:fixed; inset:0; z-index:99999; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0f172a; transition:opacity .35s ease; }
        #loading-overlay.done { opacity:0; pointer-events:none; }
        #dash-content { opacity:0; transition:opacity .35s ease; }
        #dash-content.visible { opacity:1; }
        .spinner { width:32px; height:32px; border:3px solid rgba(255,255,255,.1); border-top-color:rgba(255,255,255,.7); border-radius:50%; animation:spin .8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* User dropdown */
        .user-dropdown { position:relative; }
        .user-chip { display:flex; align-items:center; gap:6px; background:rgba(30,41,59,.6); border:1px solid rgba(51,65,85,.5); border-radius:20px; padding:3px 10px 3px 4px; font-size:0.75rem; color:#94a3b8; line-height:1; cursor:pointer; user-select:none; transition:border-color .2s, background .2s; }
        .user-chip:hover { border-color:rgba(99,102,241,.4); background:rgba(30,41,59,.9); }
        .user-avatar { width:22px; height:22px; background:linear-gradient(135deg,rgba(79,70,229,.5),rgba(99,102,241,.3)); border:1px solid rgba(99,102,241,.4); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.6875rem; font-weight:700; color:#a5b4fc; text-transform:uppercase; flex-shrink:0; }
        .user-menu { position:absolute; top:calc(100% + 8px); right:0; background:rgba(15,23,42,.97); border:1px solid rgba(51,65,85,.6); border-radius:10px; padding:4px; min-width:130px; box-shadow:0 8px 24px rgba(0,0,0,.4); backdrop-filter:blur(12px); display:none; z-index:1000; }
        .user-menu.open { display:block; }
        .user-menu-item { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:7px; font-size:0.8125rem; color:#94a3b8; cursor:pointer; transition:background .15s, color .15s; border:none; background:none; width:100%; text-align:left; }
        .user-menu-item:hover { background:rgba(239,68,68,.1); color:#f87171; }

        /* PC mode buttons */
        .pc-mode-btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 4px; font-size: 10px; font-weight: 600;
            padding: 6px 12px; border-radius: 8px;
            border: 2px solid rgba(51,65,85,.5);
            background: rgba(30,41,59,.5);
            color: #94a3b8; cursor: pointer;
            transition: all .15s ease;
            white-space: nowrap; min-width: 70px;
        }
        .pc-mode-btn:hover { background: rgba(99,102,241,.15); border-color: rgba(99,102,241,.4); color: #a5b4fc; }
        .pc-mode-btn:active { transform: scale(0.95); }
        .pc-mode-btn.active { background: rgba(34,197,94,.15); border-color: rgba(34,197,94,.6); color: #86efac; box-shadow: 0 0 8px rgba(34,197,94,.3); }
        .pc-mode-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Resource/Services tabs */
        .res-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .res-tab {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 14px; border-radius: 10px;
            border: 1px solid rgba(51,65,85,.5);
            background: rgba(30,41,59,.3);
            color: #64748b; font-size: 12px; font-weight: 600;
            cursor: pointer; transition: all .15s;
        }
        .res-tab:hover { background: rgba(51,65,85,.5); color: #94a3b8; }
        .res-tab.active { background: rgba(99,102,241,.15); border-color: rgba(99,102,241,.5); color: #a5b4fc; }
        .res-tab .tab-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

        /* Admin modal tabs */
        .admin-tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid rgba(51,65,85,.4); padding-bottom: 8px; }
        .admin-tab { padding: 8px 16px; border-radius: 8px 8px 0 0; background: transparent; color: #64748b; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; border: none; }
        .admin-tab:hover { background: rgba(51,65,85,.3); color: #94a3b8; }
        .admin-tab.active { background: rgba(99,102,241,.15); color: #a5b4fc; }

        /* Admin table */
        .admin-table { width: 100%; font-size: 13px; }
        .admin-table th { text-align: left; padding: 8px 12px; color: #64748b; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid rgba(51,65,85,.4); }
        .admin-table td { padding: 10px 12px; color: #e2e8f0; border-bottom: 1px solid rgba(51,65,85,.2); vertical-align: middle; }
        .admin-table tr:last-child td { border-bottom: none; }
        .admin-table tr:hover td { background: rgba(51,65,85,.15); }

        /* Profile chips */
        .profile-chip {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 8px; border-radius: 4px;
            font-size: 10px; font-weight: 600;
            background: rgba(51,65,85,.5); color: #94a3b8;
            margin: 2px;
        }
        .profile-chip.level-0 { background: rgba(239,68,68,.15); color: #fca5a5; }
        .profile-chip.level-1 { background: rgba(34,197,94,.15); color: #86efac; }
        .profile-chip.level-2 { background: rgba(245,158,11,.15); color: #fcd34d; }
        .profile-chip.level-3 { background: rgba(59,130,246,.15); color: #93c5fd; }
        .profile-chip .remove-btn { cursor: pointer; opacity: 0.6; margin-left: 2px; }
        .profile-chip .remove-btn:hover { opacity: 1; }

        /* Profile card */
        .profile-card {
            background: rgba(30,41,59,.5); border: 1px solid rgba(51,65,85,.4);
            border-radius: 10px; padding: 12px; margin-bottom: 10px;
        }
        .profile-card:last-child { margin-bottom: 0; }
        .profile-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .profile-card-title { font-size: 14px; font-weight: 600; color: #e2e8f0; }
        .profile-card-desc { font-size: 11px; color: #64748b; line-height: 1.4; }
        .profile-card-level { font-size: 12px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
        .profile-card-actions { display: flex; gap: 8px; margin-top: 8px; }

        /* User card */
        .user-card {
            background: rgba(30,41,59,.5); border: 1px solid rgba(51,65,85,.4);
            border-radius: 10px; padding: 12px;
        }
        .user-card-avatar {
            width: 40px; height: 40px; border-radius: 10px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 700; color: white;
            flex-shrink: 0; overflow: hidden;
        }
        .user-card-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-chip-sm {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600;
        }
        .profile-chip-sm .remove-btn {
            cursor: pointer; opacity: .6; font-size: 12px; line-height: 1;
        }
        .profile-chip-sm .remove-btn:hover { opacity: 1; }

        /* Service item in modal */
        .svc-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 10px;
            background: rgba(30,41,59,.4); border: 1px solid rgba(51,65,85,.3);
            margin-bottom: 8px; cursor: pointer; transition: all .15s;
            text-decoration: none; color: inherit;
        }
        .svc-item:hover { background: rgba(51,65,85,.4); border-color: rgba(99,102,241,.3); }
        .svc-item:last-child { margin-bottom: 0; }
        .svc-item .svc-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .svc-item .svc-name { font-size: 13px; font-weight: 500; color: #e2e8f0; }

        /* Buttons */
        .btn-xs {
            padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600;
            border: 1px solid rgba(51,65,85,.5); background: rgba(30,41,59,.5);
            color: #94a3b8; cursor: pointer; transition: all .15s;
        }
        .btn-xs:hover { background: rgba(99,102,241,.15); border-color: rgba(99,102,241,.4); color: #a5b4fc; }
        .btn-sm {
            padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600;
            border: 1px solid rgba(51,65,85,.5); background: rgba(30,41,59,.5);
            color: #94a3b8; cursor: pointer; transition: all .15s;
        }
        .btn-sm:hover { background: rgba(99,102,241,.15); border-color: rgba(99,102,241,.4); color: #a5b4fc; }
        .btn-sm.danger { color: #f87171; border-color: rgba(239,68,68,.3); }
        .btn-sm.danger:hover { background: rgba(239,68,68,.15); }
        .btn-sm.edit-btn { color: #fbbf24; border-color: rgba(251,191,36,.3); }
        .btn-sm.edit-btn:hover { background: rgba(251,191,36,.15); }

        /* Input */
        .admin-input {
            background: rgba(30,41,59,.8); border: 1px solid rgba(51,65,85,.5);
            border-radius: 6px; color: #e2e8f0; padding: 6px 10px; font-size: 13px; width: 100%;
        }
        .admin-input:focus { outline: none; border-color: rgba(99,102,241,.5); }
        .admin-select {
            background: rgba(30,41,59,.8); border: 1px solid rgba(51,65,85,.5);
            border-radius: 6px; color: #e2e8f0; padding: 6px 10px; font-size: 13px; cursor: pointer;
        }
        .admin-select:focus { outline: none; border-color: rgba(99,102,241,.5); }
        /* Alert badge */
        .alert-badge {
            position: absolute; top: -4px; right: -4px;
            min-width: 16px; height: 16px; padding: 0 4px;
            background: #ef4444; color: white;
            font-size: 10px; font-weight: 700;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }
        .alert-badge.pulse { animation: alertPulse 1.5s ease-in-out infinite; }
        @keyframes alertPulse { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)} 50%{box-shadow:0 0 0 6px rgba(239,68,68,0)} }

        /* Alert rows */
        .alert-row {
            padding: 12px; border-radius: 10px; margin-bottom: 8px;
            border: 1px solid rgba(51,65,85,.4);
        }
        .alert-row:last-child { margin-bottom: 0; }
        .alert-row.warning { background: rgba(245,158,11,.1); border-color: rgba(245,158,11,.3); }
        .alert-row.critical { background: rgba(239,68,68,.1); border-color: rgba(239,68,68,.3); }
        .alert-row-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
        .alert-container { font-size: 13px; font-weight: 600; color: #e2e8f0; }
        .alert-pct { font-size: 12px; font-weight: 700; }
        .alert-pct.warning { color: #fcd34d; }
        .alert-pct.critical { color: #fca5a5; }
        .alert-details { font-size: 11px; color: #94a3b8; }
        .alert-time { font-size: 10px; color: #64748b; margin-top: 4px; }

        /* Days selector */
        .days-selector { display: flex; gap: 6px; margin-bottom: 16px; }
        .days-btn {
            padding: 6px 12px; border-radius: 8px;
            border: 1px solid rgba(51,65,85,.5);
            background: rgba(30,41,59,.5);
            color: #94a3b8; font-size: 12px; font-weight: 600;
            cursor: pointer; transition: all .15s;
        }

        }

        .mx-spark-svg { flex: 1; height: 32px; display: block; }

        .mx-spark-cur {
            font-size: 12px; font-weight: 700; width: 56px; text-align: right;
            flex-shrink: 0; color: #e2e8f0;
        }
        .mx-spark-cur.green { color: #4ade80; }
        .mx-spark-cur.yellow { color: #fcd34d; }
        .mx-spark-cur.red { color: #fca5a5; }
        /* Per-container memory bars */
        .mx-cbar-row { margin-bottom: 10px; }
        .mx-cbar-row:last-child { margin-bottom: 0; }
        .mx-cbar-head {
            display: flex; justify-content: space-between; align-items: baseline;

        .mx-cbar-val { font-size: 11px; color: #94a3b8; }

        .mx-cbar-fill.green { background: #22c55e; }
        .mx-cbar-fill.yellow { background: #f59e0b; }
        .mx-cbar-fill.red { background: #ef4444; }
        /* Service latency/uptime table */
        .mx-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .mx-table th {
            text-align: left; color: #64748b; font-weight: 600; font-size: 10px;
            text-transform: uppercase; letter-spacing: .05em;
            padding: 4px 6px; border-bottom: 1px solid rgba(51,65,85,.5);

        .mx-table th.num, .mx-table td.num { text-align: right; }

        .mx-table td.svc { color: #e2e8f0; font-weight: 500; }
        .mx-up-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; }
        .mx-up-dot.ok { background: #22c55e; }
        .mx-up-dot.warn { background: #f59e0b; }
        .mx-up-dot.down { background: #ef4444; }
        .mx-empty { text-align: center; color: #64748b; font-size: 12px; padding: 14px 0; }

        /* Responsive container - compact (focused UI: app grid) */
        .responsive-compact { width: 100%; max-width: 100%; }
        @media (min-width: 640px) { .responsive-compact { max-width: 540px; } }
        @media (min-width: 1024px) { .responsive-compact { max-width: 640px; } }

let currentPcMode = null;

// Lazy-load cache for PC status: we only fetch when the user opens the PC tab,
// and we reuse the cached result for PC_STATUS_TTL ms so re-opening / switching
// tabs doesn't re-hit pc-agent every time.
let _pcStatusLoadedAt = 0;
const PC_STATUS_TTL = 30000;

// Fetch PC status only if we've never loaded it or the cache is stale.
// Pass force=true to bypass the cache (e.g. after changing the power mode).
async function ensurePcStatus(force = false) {
    if (!force && _pcStatusLoadedAt && (Date.now() - _pcStatusLoadedAt) < PC_STATUS_TTL) {
        return;
    }
    await loadPcStatus();
    _pcStatusLoadedAt = Date.now();
}

async function loadPcStatus() {
    try {
        const [statusRes, modeRes] = await Promise.all([
            fetch('/api/pc/status').then(r => r.json()),
            fetch('/api/pc/mode').then(r => r.json())
        ]);
        pcOnline = statusRes.online === true;
        const pcTabDot = document.getElementById('pc-tab-dot');
        if (pcTabDot) pcTabDot.className = `tab-dot ${pcOnline ? 'bg-green-500' : 'bg-red-400'}`;
        
        if (pcOnline && modeRes.mode) {
            // Mode from API - check against known modes
            const knownModes = ['balanced', 'gaming', 'servidor'];
            const modeLC = modeRes.mode.toLowerCase();
            // If mode matches known modes, use it; otherwise it's a custom profile
            currentPcMode = knownModes.includes(modeLC) ? modeLC : 'custom';
        } else {
            currentPcMode = null;
        }
    } catch {
        pcOnline = false;
        currentPcMode = null;
        const pcTabDot = document.getElementById('pc-tab-dot');
        if (pcTabDot) pcTabDot.className = 'tab-dot bg-red-400';
    }
}

// Metrics widgets (observability) — SUPER-only tab in the Resources modal.
//
// Data comes from the infrastructure metrics-service, reached only through the
// SUPER-gated backend proxy under /api/metrics/*. metrics-service is NOT in
// APP_CATALOGUE / CONTROLLABLE_CONTAINERS (it is infrastructure, not a tile).
// ═══════════════════════════════════════════════════════════════════════════
let mxRange = '1h';  // '1h' -> hi-res ring buffer; '24h' -> SQLite rollup

// Host trend sparklines to render: metric key + i18n label + value formatter +
// a thresholds fn (pct→color) reusing the same bands as the live Pi stats.
const MX_SPARKS = [
    { metric: 'host.ram.percent',  labelKey: 'mx_ram',  fmt: v => `${v.toFixed(0)}%`,  color: _barColor },
    { metric: 'host.cpu.percent',  labelKey: 'mx_cpu',  fmt: v => `${v.toFixed(0)}%`,  color: _barColor },
    { metric: 'host.temp.celsius', labelKey: 'mx_temp', fmt: v => `${v.toFixed(0)}°C`, color: _tempColor },
];

function setMxRange(range) {
    if (range === mxRange) return;
    mxRange = range;
    document.querySelectorAll('#mx-range .days-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.range === range));
    fetchAndRenderMetrics();
}

// Build an SVG sparkline path from a list of {ts, value} points. Returns the
// polyline + a filled area under it, scaled to the given box. Flat/empty series
// render as a baseline.
function _mxSparkPath(points, w, h, pad = 2) {
    if (!points || points.length === 0) return { line: '', area: '' };
    const vals = points.map(p => p.value);
    let min = Math.min(...vals), max = Math.max(...vals);
    if (max - min < 1e-6) { min -= 1; max += 1; }  // avoid div-by-zero on flat data
    const n = points.length;
    const xStep = n > 1 ? (w - pad * 2) / (n - 1) : 0;
    const scaleY = v => h - pad - ((v - min) / (max - min)) * (h - pad * 2);
    const coords = points.map((p, i) => [pad + i * xStep, scaleY(p.value)]);
    const line = coords.map(([x, y], i) => `${i === 0 ? 'M' : 'L'}${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');
    const first = coords[0], last = coords[coords.length - 1];
    const area = `${line} L${last[0].toFixed(1)} ${h} L${first[0].toFixed(1)} ${h} Z`;
    return { line, area };
}

const _MX_STROKE = { green: '#4ade80', yellow: '#fbbf24', red: '#f87171' };

async function _mxFetchSeries(metric) {
    const resolution = mxRange === '1h' ? 'hi' : 'rollup';
    const since = mxRange === '1h' ? '-1h' : '-24h';
    const qs = new URLSearchParams({ metric, resolution, since }).toString();
    const r = await fetch(`/api/metrics/series?${qs}`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    return data.points || [];
}

function _renderMxSparks(seriesByMetric) {
    const W = 180, H = 32;
    return MX_SPARKS.map(spec => {
        const pts = seriesByMetric[spec.metric] || [];
        const cur = pts.length ? pts[pts.length - 1].value : null;
        const colorName = cur != null ? spec.color(cur) : 'green';
        const stroke = _MX_STROKE[colorName];
        const { line, area } = _mxSparkPath(pts, W, H);
        const curTxt = cur != null ? spec.fmt(cur) : '—';
        return `
          <div class="mx-spark-row">
            <span class="mx-spark-label">${t(spec.labelKey)}</span>
            <svg class="mx-spark-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
              <path class="mx-fill" d="${area}" fill="${stroke}"/>
              <path d="${line}" stroke="${stroke}"/>
            </svg>
            <span class="mx-spark-cur ${colorName}">${curTxt}</span>
          </div>`;
    }).join('');
}

function _renderMxContainers(latest) {
    // latest.series is keyed "metric|label"; pick container.mem.percent rows.
    const rows = Object.values(latest.series || {})
        .filter(s => s.metric === 'container.mem.percent')
        .sort((a, b) => b.value - a.value);
    if (!rows.length) return `<div class="mx-empty">${t('mx_no_data')}</div>`;
    // used_mb companions for the "X MB" label, keyed by container label.
    const usedByName = {};
    for (const s of Object.values(latest.series || {})) {
        if (s.metric === 'container.mem.used_mb') usedByName[s.label] = s.value;
    }
    return rows.map(s => {
        const pct = s.value;
        const colorName = _barColor(pct);
        const usedMb = usedByName[s.label];
        const valTxt = usedMb != null ? `${usedMb.toFixed(0)} MB · ${pct.toFixed(0)}%` : `${pct.toFixed(0)}%`;
        return `
          <div class="mx-cbar-row">
            <div class="mx-cbar-head"><span class="mx-cbar-name">${s.label}</span><span class="mx-cbar-val">${valTxt}</span></div>
            <div class="mx-cbar-bg"><div class="mx-cbar-fill ${colorName}" style="width:${Math.min(pct, 100)}%"></div></div>
          </div>`;
    }).join('');
}

function _renderMxServices(summary) {
    // summary.metrics rows are {metric, label, min, avg, max, count}. Build a
    // per-service view from service.<key>.latency_ms and service.<key>.online.
    const svcs = {};
    for (const row of summary.metrics || []) {
        const m = row.metric || '';
        if (m.startsWith('service.') && m.endsWith('.latency_ms')) {
            (svcs[row.label] ??= {}).latencyAvg = row.avg;
            svcs[row.label].latencyMax = row.max;
        } else if (m.startsWith('service.') && m.endsWith('.online')) {
            (svcs[row.label] ??= {}).uptime = row.avg;  // mean of 0/1 → fraction up
        }
    }
    const names = Object.keys(svcs).sort();
    if (!names.length) return `<div class="mx-empty">${t('mx_no_data')}</div>`;
    const rowsHtml = names.map(name => {
        const s = svcs[name];
        const upPct = s.uptime != null ? s.uptime * 100 : null;
        const dotCls = upPct == null ? 'warn' : upPct >= 99 ? 'ok' : upPct >= 90 ? 'warn' : 'down';
        const lat = s.latencyAvg != null ? `${Math.round(s.latencyAvg)} ms` : '—';
        const latMax = s.latencyMax != null ? `${Math.round(s.latencyMax)} ms` : '—';
        const up = upPct != null ? `${upPct.toFixed(1)}%` : '—';
        return `<tr><td class="svc"><span class="mx-up-dot ${dotCls}"></span>${name}</td><td class="num">${lat}</td><td class="num">${latMax}</td><td class="num">${up}</td></tr>`;
    }).join('');
    return `
      <table class="mx-table">
        <thead><tr>
          <th>${t('mx_col_service')}</th>
          <th class="num">${t('mx_col_latency')}</th>
          <th class="num">${t('mx_col_max')}</th>
          <th class="num">${t('mx_col_uptime')}</th>
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>`;
}

async function fetchAndRenderMetrics() {
    const body = document.getElementById('res-body');
    document.getElementById('res-timestamp').textContent = new Date().toLocaleTimeString();
    const mxDot = document.getElementById('metrics-tab-dot');
    const summaryWindow = mxRange === '1h' ? '1h' : '24h';
    try {
        const [sparkArr, latest, summary] = await Promise.all([
            Promise.all(MX_SPARKS.map(s => _mxFetchSeries(s.metric))),
            fetch('/api/metrics/latest').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),
            fetch(`/api/metrics/summary?window=${summaryWindow}`).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),
        ]);
        const seriesByMetric = {};
        MX_SPARKS.forEach((s, i) => { seriesByMetric[s.metric] = sparkArr[i]; });
        if (mxDot) mxDot.className = 'tab-dot bg-green-500';
        body.innerHTML = `
          <div class="days-selector" id="mx-range">
            <button class="days-btn ${mxRange === '1h' ? 'active' : ''}" data-range="1h" onclick="setMxRange('1h')">${t('mx_range_1h')}</button>
            <button class="days-btn ${mxRange === '24h' ? 'active' : ''}" data-range="24h" onclick="setMxRange('24h')">${t('mx_range_24h')}</button>
          </div>
          <div class="mx-section">
            <div class="mx-section-title">${t('mx_trends')}</div>
            ${_renderMxSparks(seriesByMetric)}
          </div>
          <div class="mx-section">
            <div class="mx-section-title">${t('mx_containers')}</div>
            ${_renderMxContainers(latest)}
          </div>
          <div class="mx-section">
            <div class="mx-section-title">${t('mx_services')}</div>
            ${_renderMxServices(summary)}
          </div>`;
    } catch (e) {
        if (mxDot) mxDot.className = 'tab-dot bg-red-400';
        body.innerHTML = `<p class="text-center text-red-400 text-sm py-4">${t('mx_error')}: ${e.message}</p>`;
    }
}

let _alertInterval = null;
let alertDays = 1;

async function fetchMemoryAlerts(days) {
    try {
        const r = await fetch(`/api/monitoring/memory/alerts?days=${days}`);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        memoryAlerts = data.alerts || [];
        return memoryAlerts;
    } catch (e) {
        console.error('Failed to fetch memory alerts:', e);
        memoryAlerts = [];
        return [];
    }
}

function updateAlertBadge() {
    const badge = document.getElementById('alert-badge');
    if (!badge) return;
    const count = memoryAlerts.length;
    if (count === 0) {
        badge.style.display = 'none';
    } else {
        badge.style.display = 'flex';
        badge.textContent = count > 99 ? '99+' : count;
        // Pulse if any critical (>90%)
        const hasCritical = memoryAlerts.some(a => a.percent > 90);
        badge.classList.toggle('pulse', hasCritical);
    }
}

function renderAlerts() {
    const body = document.getElementById('alert-body');
    document.getElementById('alert-timestamp').textContent = new Date().toLocaleTimeString();
    
    if (!memoryAlerts.length) {
        body.innerHTML = `<div class="text-center py-8 text-slate-500"><svg class="mx-auto mb-3 w-10 h-10 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><p>${t('alert_no_alerts')}</p></div>`;
        return;
    }
    
    body.innerHTML = memoryAlerts.map(alert => {
        const severity = alert.percent > 90 ? 'critical' : 'warning';
        const usageMiB = (alert.usage_bytes / 1024 / 1024).toFixed(1);
        const limitMiB = (alert.limit_bytes / 1024 / 1024).toFixed(1);
        const ts = new Date(alert.timestamp).toLocaleString();
        return `
            <div class="alert-row ${severity}">
                <div class="alert-row-header">
                    <span class="alert-container">${alert.container}</span>
                    <span class="alert-pct ${severity}">${alert.percent.toFixed(1)}%</span>
                </div>
                <div class="alert-details">${t('alert_usage')}: ${usageMiB} MiB / ${t('alert_limit')}: ${limitMiB} MiB</div>
                <div class="alert-time">${ts}</div>
            </div>
        `;
    }).join('');
}

function setAlertDays(days) {
    alertDays = days;
    document.querySelectorAll('#days-selector .days-btn').forEach(btn => 
        btn.classList.toggle('active', parseInt(btn.dataset.days) === days)
    );
    document.getElementById('alert-body').innerHTML = '<div class="text-center text-slate-600 py-4 text-sm">Cargando…</div>';
    fetchAndRenderAlerts();
}

async function fetchAndRenderAlerts() {
    await fetchMemoryAlerts(alertDays);
    renderAlerts();
    updateAlertBadge();
}

function openAlertModal() {
    document.getElementById('alert-modal').classList.add('open');
    alertDays = 1;
    document.querySelectorAll('#days-selector .days-btn').forEach(btn => 
        btn.classList.toggle('active', parseInt(btn.dataset.days) === 1)
    );
    fetchAndRenderAlerts();
    _alertInterval = setInterval(fetchAndRenderAlerts, 300000); // 5 min
}

function closeAlertModal(e) {
    if (e && document.getElementById('alert-panel').contains(e.target)) return;
    document.getElementById('alert-modal').classList.remove('open');
    clearInterval(_alertInterval);
    _alertInterval = null;
}

let currentSvcTab = 'external';
let svcStatus = {};

function switchSvcTab(tab) {
    currentSvcTab = tab;
    document.querySelectorAll('#svc-tabs .res-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    renderSvcContent();
}

async function loadSvcStatus() {
    // Fire individual health checks in parallel - each updates UI independently as it resolves

    const checks = [
        // External services
        { key: 'photos_ext', endpoint: '/api/health/immich', extract: r => r.online === true },
        { key: 'passwords_ext', endpoint: '/api/health/passwords', extract: r => r.online === true },
        // Core services
        { key: 'core_mqtt', endpoint: '/api/health/zigbee', extract: r => r.mqtt_connected === true },
        { key: 'core_zigbee', endpoint: '/api/health/zigbee', extract: r => r.online === true },
    ];

    // Fire all requests simultaneously, update UI as each completes
    checks.forEach(({ key, endpoint, extract }) => {
        fetch(endpoint)
            .then(r => r.json())
            .then(data => {
                svcStatus[key] = extract(data);
                renderSvcContent();  // Re-render immediately when this service responds
            })
            .catch(() => {
                svcStatus[key] = false;
                renderSvcContent();
            });
    });
}

function renderSvcContent() {
    const body = document.getElementById('svc-body');
    if (currentSvcTab === 'external') {
        if (!externalServices.length) {
            body.innerHTML = '<p class="text-center text-slate-500 py-4 text-sm">No hay servicios externos disponibles</p>';
            return;
        }
        body.innerHTML = externalServices.map(svc => {
            const info = EXT_SERVICES[svc.key];
            if (!info) return '';
            const online = svcStatus[svc.key] ?? false;
            return `<a href="${info.url}" target="_blank" rel="noopener" class="svc-item">
                <span class="svc-dot ${online ? 'bg-green-500 status-dot' : 'bg-red-400'}"></span>
                <span class="svc-name">${t(info.nameKey)}</span>
            </a>`;
        }).join('');
    } else {
        body.innerHTML = CORE_SERVICES.map(svc => {
            const online = svcStatus[svc.key] ?? false;
            const inner = `<span class="svc-dot ${online ? 'bg-green-500 status-dot' : 'bg-red-400'}"></span><span class="svc-name">${t(svc.labelKey)}</span>`;
            return svc.url 
                ? `<a href="${svc.url}" class="svc-item">${inner}</a>`
                : `<div class="svc-item" style="cursor:default">${inner}</div>`;
        }).join('');
    }
}

async function openSvcModal() {
    document.getElementById('svc-modal').classList.add('open');
    currentSvcTab = 'external';
    document.querySelectorAll('#svc-tabs .res-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'external'));
    // Initialize all services as offline (red) - instant feedback
    ['photos_ext', 'passwords_ext', 'core_mqtt', 'core_zigbee'].forEach(k => svcStatus[k] = false);
    renderSvcContent();  // Show immediately with all red dots
    // Load actual status in background - will re-render when complete
    loadSvcStatus();
}

function closeSvcModal(e) {
    if (e && document.getElementById('svc-panel').contains(e.target)) return;
    document.getElementById('svc-modal').classList.remove('open');
}

async function removeUserProfile(username, profileId) {
    const user = adminUsers.find(u => u.username === username);
    if (user?.profiles.length <= 1) { alert('No se puede eliminar el último perfil'); return; }
    try {
        await fetch(`/api/auth/admin/users/${username}/profiles/${profileId}`, { method: 'DELETE' });
        await loadAdminData();
        renderAdminContent();
    } catch (e) { alert('Error: ' + e.message); }
}

function showAddProfileDialog(username) {
    const user = adminUsers.find(u => u.username === username);
    const userProfileIds = user?.profiles.map(p => p.id) || [];
    const available = Object.entries(adminProfiles).filter(([id]) => !userProfileIds.includes(id));
    if (!available.length) { alert('El usuario ya tiene todos los perfiles'); return; }
    
    const options = available.map(([id, p]) => `${p.name}`).join(', ');
    const selectedName = prompt(`Añadir perfil a ${username}.\nDisponibles: ${options}`);
    if (!selectedName) return;
    
    const match = available.find(([id, p]) => p.name.toLowerCase() === selectedName.toLowerCase());
    if (match) {
        addUserProfile(username, match[0]);
    } else {
        alert('Perfil no encontrado');
    }
}

async function addUserProfile(username, profileId) {
    try {
        await fetch(`/api/auth/admin/users/${username}/profiles/${profileId}`, { method: 'POST' });
        await loadAdminData();
        renderAdminContent();
    } catch (e) { alert('Error: ' + e.message); }
}

function showCreateProfileDialog() {
    const name = prompt('Nombre del nuevo perfil (mayúsculas):');
    if (!name) return;
    const level = parseInt(prompt('Nivel (0-3):', '1'));
    if (isNaN(level) || level < 0 || level > 3) { alert('Nivel inválido'); return; }
    const desc = prompt('Descripción:', '') || '';
    createProfile(name.toUpperCase(), level, desc);
}

async function createProfile(name, level, description) {
    try {
        const r = await fetch('/api/auth/admin/profiles', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, level, description })
        });
        if (!r.ok) { const e = await r.json(); alert('Error: ' + e.detail); return; }
        await loadAdminData();
        renderAdminContent();
    } catch (e) { alert('Error: ' + e.message); }
}

function editProfile(profileId) {
    const p = adminProfiles[profileId];
    if (!p || p.protected) return;
    
    // Populate modal fields
    document.getElementById('profile-edit-id').value = profileId;
    document.getElementById('profile-edit-name').value = p.name;
    document.getElementById('profile-edit-level').value = p.level;
    document.getElementById('profile-edit-desc').value = p.description || '';
    
    // Open modal
    document.getElementById('profile-edit-modal').classList.add('open');
}

function closeProfileEditModal(event) {

function renderApps() {
    if (!APPS.length) return;
    const showBtn = isAdmin();
    document.getElementById('apps-list').innerHTML = APPS.map(app => {
        // Only show control button for services that are controllable (not explicitly false)
        const canControl = app.controllable !== false;
        const btnHtml = (showBtn && canControl) ? `<button class="svc-btn loading" id="btn-${app.key}" onclick="toggleService(event,'${app.key}')">${t('svc_loading')}</button>` : '';
        const restartHtml = (showBtn && canControl) ? `<button class="svc-restart" id="restart-${app.key}" title="${t('svc_restart')}" aria-label="${t('svc_restart')}" style="display:none" onclick="restartService(event,'${app.key}')">🔄</button>` : '';
        // Deploy button: SUPER only, and only for apps mapped to a CI service.
        const deployHtml = (showBtn && DEPLOY_SERVICES[app.key]) ? `<button class="svc-deploy" id="deploy-${app.key}" title="${t('svc_deploy')}" aria-label="${t('svc_deploy')}" onclick="deployService(event,'${app.key}')">🚀</button>` : '';
        const tag = app.url ? 'a' : 'div';

                            <span class="w-1.5 h-1.5 rounded-full bg-slate-600 inline-block"></span><span>—</span>

                        </span>

    }).join('');

// Container control
async function loadContainerStates() {
    try {
        const r = await fetch('/api/system/containers');
        if (!r.ok) return;
        const data = await r.json();
        containerState = {};
        for (const [key, info] of Object.entries(data)) {
            containerState[key] = info.running;
            updateBtn(key, info.running);
        }
    } catch {}
}

function updateBtn(key, running) {
    const btn = document.getElementById('btn-' + key);
    if (!btn) return;
    btn.disabled = false;
    btn.className = running ? 'svc-btn running' : 'svc-btn stopped';
    btn.textContent = running ? '⏹ ' + t('svc_stop') : '▶ ' + t('svc_start');
    // The restart button only makes sense while the service is running.
    const restartBtn = document.getElementById('restart-' + key);
    if (restartBtn) {
        restartBtn.style.display = running ? 'inline-flex' : 'none';
        restartBtn.disabled = false;
        restartBtn.classList.remove('spinning');
    }
}

async function toggleService(event, key) {
    event.preventDefault(); event.stopPropagation();
    const btn = document.getElementById('btn-' + key);
    if (!btn || btn.disabled) return;
    const wasRunning = containerState[key];
    btn.disabled = true; btn.className = 'svc-btn loading'; btn.textContent = t('svc_loading');
    try {
        const r = await fetch(`/api/system/containers/${key}/${wasRunning ? 'stop' : 'start'}`, { method: 'POST' });
        if (r.ok) {
            await new Promise(res => setTimeout(res, 1500));
            await loadContainerStates();
            const app = APPS.find(a => a.key === key);
            if (app?.statusUrl) delete statusCache[app.statusUrl];
            await loadStatus();
        } else { updateBtn(key, wasRunning); }
    } catch { updateBtn(key, wasRunning); }
}

async function restartService(event, key) {
    event.preventDefault(); event.stopPropagation();
    const restartBtn = document.getElementById('restart-' + key);
    const btn = document.getElementById('btn-' + key);
    if (!restartBtn || restartBtn.disabled) return;
    // Lock both buttons and spin the restart icon while the stop->start runs.
    restartBtn.disabled = true;
    restartBtn.classList.add('spinning');
    if (btn) { btn.disabled = true; btn.className = 'svc-btn loading'; btn.textContent = t('svc_loading'); }
    try {
        const r = await fetch(`/api/system/containers/${key}/restart`, { method: 'POST' });
        if (r.ok) {
            // Backend already paused 2s between stop and start; give it a moment more.
            await new Promise(res => setTimeout(res, 2000));
            await loadContainerStates();
            const app = APPS.find(a => a.key === key);
            if (app?.statusUrl) delete statusCache[app.statusUrl];
            await loadStatus();
        } else { updateBtn(key, containerState[key]); }
    } catch { updateBtn(key, containerState[key]); }
}

function fmt(str, vars) {
    return str.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
}

function showToast(message, { kind = 'info', linkUrl = null, linkText = null, timeout = 6000 } = {}) {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const el = document.createElement('div');
    el.className = `toast ${kind}`;
    el.setAttribute('role', 'status');
    const msg = document.createElement('span');
    msg.textContent = message;
    el.appendChild(msg);
    if (linkUrl) {
        const a = document.createElement('a');
        a.href = linkUrl;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = linkText || linkUrl;
        el.appendChild(a);
    }
    container.appendChild(el);
    // Force reflow so the entrance transition plays.
    void el.offsetWidth;
    el.classList.add('show');
    const remove = () => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 250);
    };
    setTimeout(remove, timeout);
}

async function deployService(event, key) {
    event.preventDefault(); event.stopPropagation();
    const service = DEPLOY_SERVICES[key];
    if (!service) return;
    const deployBtn = document.getElementById('deploy-' + key);
    if (!deployBtn || deployBtn.disabled) return;
    const app = APPS.find(a => a.key === key);
    const name = app ? t(app.nameKey) : key;
    if (!window.confirm(fmt(t('deploy_confirm'), { name }))) return;

    deployBtn.disabled = true;
    deployBtn.classList.add('spinning');
    try {
        const r = await fetch(`/api/deploy/${encodeURIComponent(service)}`, { method: 'POST' });
        if (r.ok) {
            let data = {};
            try { data = await r.json(); } catch {}
            const url = data.run_url || data.actions_url;
            showToast(fmt(t('deploy_ok'), { name }), {
                kind: 'success',
                linkUrl: url,
                linkText: url ? t('deploy_view') : null,
            });
        } else {
            showToast(fmt(t('deploy_err'), { name }), { kind: 'error' });
        }
    } catch {
        showToast(fmt(t('deploy_err'), { name }), { kind: 'error' });
    } finally {
        deployBtn.disabled = false;
        deployBtn.classList.remove('spinning');
    }
}

// Status polling
const statusCache = {};
// Last health JSON per service key (for the detail tooltip)
const healthData = {};
async function fetchStatus(url) {
    if (statusCache[url] && (Date.now() - statusCache[url].ts) < 8000) return statusCache[url].data;
    const data = await fetch(url).then(r => r.json());
    statusCache[url] = { data, ts: Date.now() };
    return data;
}

// Friendly label for an arbitrary extra health field (falls back to the raw key)
function healthFieldLabel(key) {
    const mapped = t('ht_' + key);
    return mapped === ('ht_' + key) ? key : mapped;
}

// Format a health field value for display inside the tooltip
function healthFieldValue(value) {
    if (value === true) return { text: t('ht_yes'), cls: 'ok' };
    if (value === false) return { text: t('ht_no'), cls: 'bad' };
    if (value === null || value === undefined) return { text: '—', cls: '' };
    return { text: String(value), cls: '' };
}

// Build the tooltip inner HTML from a service's name + its last health JSON
function buildHealthTip(nameLabel, data) {
    const esc = s => String(s).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    if (!data) {
        return `<span class="ht-title">${esc(nameLabel)}</span>`
            + `<div class="ht-row"><span class="ht-k">${t('ht_status')}</span>`
            + `<span class="ht-v">${t('ht_loading')}</span></div>`;
    }
    const online = data.online === true;
    const rows = [];
    rows.push(`<div class="ht-row"><span class="ht-k">${t('ht_status')}</span>`
        + `<span class="ht-v ${online ? 'ok' : 'bad'}">${online ? t('ht_online') : t('ht_offline')}</span></div>`);
    if (typeof data.latency_ms === 'number') {
        rows.push(`<div class="ht-row"><span class="ht-k">${t('ht_latency')}</span>`
            + `<span class="ht-v">${data.latency_ms}ms</span></div>`);
    }
    // Any other diagnostic fields (mqtt_connected, melcloud_connected, etc.)
    const skip = new Set(['online', 'latency_ms', 'error']);
    for (const [k, v] of Object.entries(data)) {
        if (skip.has(k)) continue;
        const fv = healthFieldValue(v);
        rows.push(`<div class="ht-row"><span class="ht-k">${esc(healthFieldLabel(k))}</span>`
            + `<span class="ht-v ${fv.cls}">${esc(fv.text)}</span></div>`);
    }
    let html = `<span class="ht-title">${esc(nameLabel)}</span>` + rows.join('');
    if (data.error) {
        html += `<div class="ht-err">${t('ht_error')}: ${esc(data.error)}</div>`;
    }
    return html;
}

// Toggle the tooltip open on tap (touch devices have no hover)
function toggleTip(event, key) {
    event.stopPropagation();
    const el = document.getElementById('status-' + key);
    if (!el) return;
    const wasOpen = el.classList.contains('tip-open');
    document.querySelectorAll('.health-trigger.tip-open').forEach(e => e.classList.remove('tip-open'));
    if (!wasOpen) el.classList.add('tip-open');
}
// Dismiss any open tap-tooltip when clicking elsewhere
document.addEventListener('click', e => {
    if (!e.target.closest('.health-trigger')) {
        document.querySelectorAll('.health-trigger.tip-open').forEach(el => el.classList.remove('tip-open'));
    }
});

async function loadStatus() {
    for (const app of APPS) {
        if (!app.statusUrl || !app.getStatus) continue;
        try {
            const data = await fetchStatus(app.statusUrl);
            applyAppStatus(app, data);
        } catch {}
    }
}

// Update a single app card's status dot, label and tooltip from a health dict.
// Shared by the HTTP polling path (loadStatus) and the WebSocket push path
// (applyHealthSnapshot) so both render identically.
function applyAppStatus(app, data) {
    if (!app || !data || !app.getStatus) return;
    healthData[app.key] = data;
    const el = document.getElementById('status-' + app.key);
    if (!el) return;
    const isOnline = app.getStatus(data);
    const dot = el.querySelector('span:first-child');
    const label = el.querySelector('span:nth-child(2)');
    const tip = document.getElementById('tip-' + app.key);
    if (dot) dot.className = `status-dot w-1.5 h-1.5 rounded-full inline-block ${isOnline ? 'bg-green-500' : 'bg-red-400'}`;
    if (label) label.textContent = t(isOnline ? 'connected' : 'offline');
    if (tip) tip.innerHTML = buildHealthTip(t(app.nameKey), data);
    const card = el.closest('.app-card');
    if (card) card.classList.toggle('offline', !isOnline);
}

// Derive the /api/health/all result key for an app from its statusUrl
// (e.g. '/api/health/baby-gifts' -> 'baby-gifts'). This avoids maintaining a
// second hardcoded app-key -> health-key mapping that could drift.
function healthKeyForApp(app) {
    if (!app?.statusUrl) return null;
    const m = app.statusUrl.match(/\/api\/health\/(.+)$/);
    return m ? m[1] : null;
}

// Apply a full health snapshot (the {serviceKey: {...}} payload pushed over the
// WebSocket, identical in shape to GET /api/health/all) to every app card.
function applyHealthSnapshot(snapshot) {
    if (!snapshot || typeof snapshot !== 'object') return;
    for (const app of APPS) {
        const hk = healthKeyForApp(app);
        if (!hk) continue;
        const data = snapshot[hk];
        if (data === undefined) continue;
        // Keep the HTTP cache warm so a later fallback poll doesn't flicker.
        if (app.statusUrl) statusCache[app.statusUrl] = { data, ts: Date.now() };
        applyAppStatus(app, data);
    }
}

// User menu
function toggleUserMenu() { document.getElementById('user-menu').classList.toggle('open'); }
document.addEventListener('click', e => {
    const dd = document.getElementById('user-dropdown');
    if (dd && !dd.contains(e.target)) document.getElementById('user-menu')?.classList.remove('open');
});

// Load user
async function loadUser() {
    try {
        const res = await fetch('/api/auth/me');
        if (!res.ok) return;
        currentUserData = await res.json();
        const username = currentUserData.username || '';
        if (!username) return;
        
        document.getElementById('user-name').textContent = username;
        document.getElementById('user-avatar').textContent = username.charAt(0).toUpperCase();
        document.getElementById('user-dropdown').style.display = 'block';
        
        // Show buttons based on level (SUPER = level 0)
        if (isAdmin()) {
            document.getElementById('svc-btn').style.display = 'flex';
            document.getElementById('res-btn').style.display = 'flex';
            document.getElementById('alert-btn').style.display = 'flex';
            document.getElementById('admin-btn').style.display = 'flex';
        }
        
        // Build app list from permissions
        // photos and passwords go in external services modal, not main list
        APPS = (currentUserData.apps || [])
            .filter(p => !['zigbee', 'photos', 'passwords'].includes(p.key))
            .map(p => ({ key: p.key, ...APP_CATALOGUE[p.key] }))
            .filter(a => a);
        
        // External services
        externalServices = currentUserData.external_services || [];
        
        renderApps();
        loadStatus();
    } catch {}
}

// ═══════════════════════════════════════════════════════════════════════════
// Real-time health stream (WebSocket) with HTTP polling fallback
// ═══════════════════════════════════════════════════════════════════════════
// Primary path: a single WebSocket to /api/ws/health receives a full health
// snapshot immediately on connect and then every ~5s. If the socket never
// opens, errors, or closes, we fall back to the legacy HTTP polling loop
// (loadStatus every 10s) so the status dots keep updating regardless.
let _healthWs = null;
let _healthPollTimer = null;
let _wsReconnectTimer = null;
let _wsEverConnected = false;

function startHttpHealthFallback() {
    if (_healthPollTimer) return;  // already polling
    loadStatus();  // immediate refresh
    _healthPollTimer = setInterval(loadStatus, 10000);
}

function stopHttpHealthFallback() {
    if (_healthPollTimer) { clearInterval(_healthPollTimer); _healthPollTimer = null; }
}

function setupHealthStream() {
    // Guard: environments without WebSocket (very old browsers) just poll.
    if (typeof WebSocket === 'undefined') { startHttpHealthFallback(); return; }

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const url = `${proto}//${location.host}/api/ws/health`;

    let ws;
    try {
        ws = new WebSocket(url);
    } catch {
        startHttpHealthFallback();
        return;
    }
    _healthWs = ws;

    ws.onopen = () => {
        _wsEverConnected = true;
        // Live push is active — stop the HTTP fallback to avoid double work.
        stopHttpHealthFallback();
    };

    ws.onmessage = (event) => {
        try {
            const msg = JSON.parse(event.data);
            if (msg && msg.type === 'health' && msg.data) {
                applyHealthSnapshot(msg.data);
            }
        } catch {}
    };

    const onDrop = () => {
        if (_healthWs === ws) _healthWs = null;
        // Keep the UI fresh via HTTP while the socket is down.
        startHttpHealthFallback();
        // Try to re-establish the socket after a short delay (single timer).
        if (!_wsReconnectTimer) {
            _wsReconnectTimer = setTimeout(() => {
                _wsReconnectTimer = null;
                setupHealthStream();
            }, 15000);
        }
    };

    ws.onclose = onDrop;
    ws.onerror = () => {
        // If we never managed to connect, fall back immediately; onclose will
        // also fire and schedule a reconnect.
        if (!_wsEverConnected) startHttpHealthFallback();
    };
}

// Init
(async function init() {
    applyLang();
    try { await Promise.race([ loadUser(), new Promise(r => setTimeout(r, 5000)) ]); } catch {}
    const overlay = document.getElementById('loading-overlay');
    const content = document.getElementById('dash-content');
    content.classList.add('visible');
    overlay.classList.add('done');
    setTimeout(() => { overlay.style.display = 'none'; }, 400);
    setupHealthStream();
    setInterval(() => { if (isAdmin()) loadContainerStates(); }, 30000);
    // PC status is lazy-loaded: fetched only when the user opens the "Egnal PC"
    // tab in the Resources modal (see switchResSource / ensurePcStatus), so we
    // avoid hitting pc-agent on every page load and every 30s in the background.
    // Load memory alerts badge on init and refresh every 5min
    if (isAdmin()) {
        fetchMemoryAlerts(1).then(updateAlertBadge);
        setInterval(() => fetchMemoryAlerts(1).then(updateAlertBadge), 300000);
    }
})();
