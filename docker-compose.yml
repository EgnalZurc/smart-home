version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - smart-home

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "8081:8081"  # Exponer frontend para acceso desde navegador
    volumes:
      - ./infrastructure/zigbee2mqtt/config/configuration.yaml:/app/data/configuration.yaml:ro
      - ./infrastructure/zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyACM0  # No necesario en Windows - usamos serial_bridge.py via TCP
    environment:
      - TZ=Europe/Madrid
    networks:
      - smart-home

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: smart-home-backend
    restart: unless-stopped
    depends_on:
      - mosquitto
      - zigbee2mqtt
    ports:
      - "8080:8080"
    volumes:
      - backend_data:/app/data
    env_file:
      - .env
    environment:
      - TZ=Europe/Madrid
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    networks:
      - smart-home

volumes:
  mosquitto_data:
  mosquitto_log:
  backend_data:

networks:
  smart-home:
    driver: bridge
