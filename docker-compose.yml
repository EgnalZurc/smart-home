services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - 1883:1883
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log
    networks:
      - smart-home

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    restart: unless-stopped
    depends_on:
      - mosquitto
    expose:
      - 8081
    volumes:
      - ./data/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    environment:
      - TZ=Europe/Madrid
    networks:
      - smart-home

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: smart-home-backend
    restart: unless-stopped
    depends_on:
      - mosquitto
      - zigbee2mqtt
    expose:
      - 8080
    volumes:
      - ./data/backend:/app/data
    env_file:
      - .env
    environment:
      - TZ=Europe/Madrid
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    networks:
      - smart-home

  nginx:
    image: nginx:alpine
    container_name: nginx-reverse-proxy
    restart: unless-stopped
    depends_on:
      - backend
      - zigbee2mqtt
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./infrastructure/nginx/certs:/etc/letsencrypt:ro
      - ./data/nginx/logs:/var/log/nginx
      - ./data/nginx/certbot:/var/www/certbot:ro
    networks:
      - smart-home

networks:
  smart-home:
    driver: bridge
