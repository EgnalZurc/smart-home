services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - 1883:1883
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log
    networks:
      - smart-home

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    restart: unless-stopped
    depends_on:
      - mosquitto
    expose:
      - 8081
    volumes:
      - ./data/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    environment:
      - TZ=Europe/Madrid
    networks:
      - smart-home

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: smart-home-backend
    restart: unless-stopped
    depends_on:
      - mosquitto
      - zigbee2mqtt
    expose:
      - 8080
    volumes:
      - ./data/backend:/app/data
    env_file:
      - .env
    environment:
      - TZ=Europe/Madrid
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    networks:
      - smart-home

  nginx:
    image: nginx:alpine
    container_name: nginx-reverse-proxy
    restart: unless-stopped
    depends_on:
      - backend
      - zigbee2mqtt
      - immich-server
    ports:
      - 80:80
      - 8443:443
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
      - ./data/nginx/logs:/var/log/nginx
    networks:
      - smart-home

  # ?? Immich Photo Backup (PHO-1) ??????????????????????????????????????????????
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - /mnt/immich/upload:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env.immich
    ports:
      - "127.0.0.1:2283:2283"  # localhost only, accessed via Tailscale Serve
    depends_on:
      - immich-redis
      - immich-database
    restart: unless-stopped
    networks:
      - smart-home
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - immich-model-cache:/cache
    env_file:
      - .env.immich
    restart: unless-stopped
    networks:
      - smart-home
    profiles:
      - ml
    healthcheck:
      disable: false

  immich-redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    restart: unless-stopped
    networks:
      - smart-home
    healthcheck:
      test: redis-cli ping || exit 1

  immich-database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    env_file:
      - .env.immich
    environment:
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - /mnt/immich/database:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    networks:
      - smart-home
    healthcheck:
      disable: false


volumes:
  immich-model-cache:

networks:
  smart-home:
    driver: bridge
