services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    mem_limit: 16m
    memswap_limit: 16m
    ports:
      - 1883:1883
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log
    networks:
      - smart-home
      - cuchi-casa

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    depends_on:
      - mosquitto
    expose:
      - 8081
    volumes:
      - ./data/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    environment:
      - TZ=Europe/Madrid
    networks:
      - smart-home
      - cuchi-casa

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: smart-home-backend
    restart: unless-stopped
    mem_limit: 96m
    memswap_limit: 96m
    expose:
      - 8080
    volumes:
      - ./data/backend:/app/data
      - ./infrastructure/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    env_file:
      - .env
    environment:
      - TZ=Europe/Madrid
    networks:
      - smart-home
      - cuchi-casa

  nginx:
    image: nginx:alpine
    container_name: nginx-reverse-proxy
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    depends_on:
      - backend
      - zigbee2mqtt
    ports:
      - 80:80
      - 8443:443
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
      - ./data/nginx/logs:/var/log/nginx
    networks:
      - smart-home
      - cuchi-casa


  # 🔌 Docker Socket Proxy — Acceso controlado al socket Docker (DSP-1) ████████
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    mem_limit: 32m
    memswap_limit: 32m
    environment:
      # Lectura — necesario para listar y consultar containers
      CONTAINERS: 1
      # Escritura — necesario para start/stop
      POST: 1
      # Todo lo demás desactivado explícitamente
      IMAGES: 0
      INFO: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      SERVICES: 0
      SWARM: 0
      TASKS: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SESSION: 0
      SYSTEM: 0
      AUTH: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Sin ports: — solo accesible internamente desde la red smart-home
    expose:
      - 2375
    networks:
      - smart-home
      - cuchi-casa


  # Baby Gifts Service - gift registry for baby
  baby-gifts-service:
    build:
      context: ./baby-gifts-service
      dockerfile: Dockerfile
    container_name: baby-gifts-service
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    expose:
      - 8004
    volumes:
      - ./data/baby-gifts-service:/app/data
    environment:
      - TZ=Europe/Madrid
    networks:
      - smart-home
      - cuchi-casa

networks:
  smart-home:
    driver: bridge
  cuchi-casa:
    external: true
