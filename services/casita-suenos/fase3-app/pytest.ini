[pytest]
testpaths = tests
pythonpath = src
asyncio_mode = auto
cache_dir = /tmp/casita-pytest-cache

[coverage:run]
# Exclude modules that require external connections (IMAP, HTTP scraping)
# and integration modules that are tested manually in production
omit =
    src/fotocasa_email_parser.py
    src/idealista_email_parser.py
    src/habitaclia_scraper.py
    src/pisos_scraper.py
    src/fotocasa_scraper.py
    src/apify_client_wrapper.py
    src/setup_gmail.py

[coverage:report]
# Modules included in coverage should meet this threshold
fail_under = 80
