[pytest]
# Vacaciones Service test configuration
# Aligned with smart-home CI pipeline standards

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Async mode for pytest-asyncio (if used)
asyncio_mode = auto

# Warnings configuration - treat deprecation warnings as errors in our code
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
    # Ignore third-party deprecation warnings
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:fastapi.*
    ignore::DeprecationWarning:pydantic.*
    ignore::PendingDeprecationWarning:starlette.*
    ignore::PendingDeprecationWarning:multipart.*

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests that require external services

# Minimum pytest version
minversion = 7.0

# Timeout for individual tests (requires pytest-timeout)
# timeout = 30
