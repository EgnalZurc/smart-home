# Contrato de integración del servicio (complementa docker-compose.prod.yml).
# Copiar a services/<nombre>/service.toml y ajustar. Claves desconocidas: permitidas.
# El validador mínimo comprueba presencia y claves básicas; la coherencia profunda la dan
# compose + tests de dashboard/CI.
# Regla: cada servicio tiene su propio directorio (services/<nombre>/ por defecto).

[service]
key = "my-service"                 # = clave compose, container_name y carpeta en services/
class = "app"                      # app | infrastructure | wrapper | external
code_path = "services/my-service"  # ruta al código/directorio propio; p. ej. "dashboard" si no vive en services/
port = 0                           # puerto interno del contenedor (expose); 0 si no aplica
data_dir = "data/my-service"       # relativo a raíz prod; "" si sin datos persistentes
docker_image = "egnal/smart-home-my-service"  # sin :tag; "" si imagen oficial externa
health_path = "/health"            # "" si no aplica

[dashboard]
enabled = false                    # true si tiene health/proxy/integración en dashboard
app_key = ""                       # clave lógica UI (puede diferir de service.key), ej. "babygifts"
catalogue = false                  # tile en APP_CATALOGUE
controllable = false               # en CONTROLLABLE_CONTAINERS
deploy_service = ""                # nombre en DEPLOY_SERVICES / CI dispatch; "" si no
status_url = ""                    # ej. "/api/health/my-service"
in_all_health = false              # incluido en /api/health/all

[nginx]
exposed = false                    # true si tiene location en nginx
spa_path = ""                      # ej. "/smart-home/my-service"
api_prefix = ""                    # ej. "/api/my-service/"

[ci]
enabled = true                     # build/test en CI
workflow_dispatch = false          # opción en workflow_dispatch

[docs]
api_doc = false                    # documentado en docs/API.md
notes = ""
