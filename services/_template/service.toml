# Service integration contract (complements docker-compose.prod.yml).
# Copy to services/<name>/service.toml and adjust. Unknown keys are allowed.
# The minimal validator checks presence and basic keys; deeper coherence is ensured
# by compose + dashboard/CI tests.
# Rule: each service has its own directory (services/<name>/ by default).

[service]
key = "my-service"                 # = compose key, container_name, and folder in services/
class = "app"                      # app | infrastructure | wrapper | external
code_path = "services/my-service"  # path to code/own directory; e.g. "dashboard" if not under services/
port = 0                           # internal container port (expose); 0 if not applicable
data_dir = "data/my-service"       # relative to prod root; "" if no persistent data
docker_image = "egnal/smart-home-my-service"  # without :tag; "" for official external image
health_path = "/health"            # "" if not applicable

[dashboard]
enabled = false                    # true if it has dashboard health/proxy/integration
app_key = ""                       # logical UI key (may differ from service.key), e.g. "babygifts"
catalogue = false                  # tile in APP_CATALOGUE
controllable = false               # in CONTROLLABLE_CONTAINERS
deploy_service = ""                # name in DEPLOY_SERVICES / CI dispatch; "" if not applicable
status_url = ""                    # e.g. "/api/health/my-service"
in_all_health = false              # included in /api/health/all

[nginx]
exposed = false                    # true if it has a location in nginx
spa_path = ""                      # e.g. "/smart-home/my-service"
api_prefix = ""                    # e.g. "/api/my-service/"

[ci]
enabled = true                     # build/test in CI
workflow_dispatch = false          # option in workflow_dispatch

[docs]
api_doc = false                    # documented in docs/API.md
notes = ""