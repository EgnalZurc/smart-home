# ═══════════════════════════════════════════════════════════════════════════════
# SCHEDULED ALERTS
# Actions válidas (solo acciones manuales):
#   - sell_crypto: vender o cambiar una posición crypto
#   - stop_etf: dejar de aportar a un ETF
#   - modify_etf: cambiar cantidad de aportación ETF
#   - review: revisar algo manualmente
#   - renew_staking: renovar o retirar staking que vence
# NO usar buy_etf — las aportaciones están automatizadas en Trade Republic
# ═══════════════════════════════════════════════════════════════════════════════

# ETH staking fijo vence el 4 de noviembre
[[alerts.scheduled]]
id          = "eth_staking_maturity"
date        = "2026-11-01"
action      = "renew_staking"
symbol      = "ETH"
title       = "ETH Staking vence en 3 días"
description = "El staking fijo de ETH en Bitvavo vence el 4 de noviembre. Decidir: renovar staking fijo (30d), cambiar a flexible, o retirar."
priority    = "high"

# Verificar KuCoin vacío (migración completada)
[[alerts.scheduled]]
id          = "verify_kucoin_empty"
date        = "2026-10-06"
action      = "review"
symbol      = ""
title       = "Verificar KuCoin vacío"
description = "Confirmar que la cuenta de KuCoin está vacía después de la migración a Bitvavo."
priority    = "low"
