# ═══════════════════════════════════════════════════════════════════════════════
# Portfolio Monitor — Configuration File
# ═══════════════════════════════════════════════════════════════════════════════
# Copy this file to data/settings.toml and fill in your values.
# Credentials (GMAIL_USER, GMAIL_PASS) must be set as environment variables.

# ─────────────────────────────────────────────────────────────────────────────
# [general]
# ─────────────────────────────────────────────────────────────────────────────
[general]
# Report language: "es" (Spanish) or "en" (English)
lang = "es"

# Log verbosity: "DEBUG", "INFO", or "WARNING"
log_level = "INFO"

# ─────────────────────────────────────────────────────────────────────────────
# [schedule] — When to run each monitor
# ─────────────────────────────────────────────────────────────────────────────
[schedule]
# ETF monitor runs after European markets close
etf_time = "18:00"

# Crypto monitor runs in the morning
crypto_time = "09:00"

# ═══════════════════════════════════════════════════════════════════════════════
# ETF MONITOR
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# [[etf.funds]] — One block per ETF
# ─────────────────────────────────────────────────────────────────────────────
[[etf.funds]]
id               = "IUIT"
ticker           = "IUIT.L"
name             = "iShares S&P 500 IT Sector UCITS ETF"
isin             = "IE00B3WJKG14"
precio_medio     = 32.77
