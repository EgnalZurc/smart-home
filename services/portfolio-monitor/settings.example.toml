# ─────────────────────────────────────────────────────────────────────────────
# [etf.plan] — Investment plan phases and milestones
# ─────────────────────────────────────────────────────────────────────────────
[etf.plan]
# Date when Phase 2 begins (accelerated contributions)
phase_change_date = "2027-03-01"

# Projected portfolio values per year (one value per fund, same order as above)
[etf.plan.milestones]
1  = [1_800,    1_257]
2  = [3_352,    3_643]
3  = [10_812,   17_821]
4  = [20_090,   33_484]
5  = [31_627,   50_787]
6  = [45_975,   69_903]
7  = [63_818,   91_019]
8  = [86_007,   114_347]
9  = [113_602,  140_118]
10 = [147_918,  168_587]

# ─────────────────────────────────────────────────────────────────────────────
# [etf.tax] — Spanish IRPF capital gains brackets (base del ahorro)
# Updated for 2025 per Ley 7/2024 (vigente desde 1 enero 2025)
# These are TOTAL rates (estatal + autonómico combined)
# ─────────────────────────────────────────────────────────────────────────────
[etf.tax]
brackets = [
    [6_000,        0.19],    # 0 - 6.000€: 19%
    [50_000,       0.21],    # 6.000 - 50.000€: 21%
    [200_000,      0.23],    # 50.000 - 200.000€: 23%
    [300_000,      0.27],    # 200.000 - 300.000€: 27%
    [999_999_999,  0.30],    # +300.000€: 30% (nuevo tramo 2025)
]

# ─────────────────────────────────────────────────────────────────────────────
# [etf.thresholds] — Technical analysis thresholds
# ─────────────────────────────────────────────────────────────────────────────
[etf.thresholds]
ma_short            = 50     # Short moving average (days)
ma_long             = 200    # Long moving average (days)
drop_from_high_warn = -0.15  # Warn at -15% from 52w high
loss_vs_cost_warn   = -0.10  # Warn at -10% below avg cost
critical_threshold  = -0.20  # Critical alert at -20%

