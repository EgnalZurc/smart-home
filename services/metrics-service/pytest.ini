[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# pytest-asyncio 1.x requires explicit fixture loop scope (defaults to function)
asyncio_default_fixture_loop_scope = function
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
